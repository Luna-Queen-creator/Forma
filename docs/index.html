<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c39">
  <meta name="description" content="Plan, track and combine strength, cardio, yoga, mobility and meditation in one place.">
  <title>Forma · Your movement planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22%23123c39%22/%3E%3Cg transform=%22translate(256 256) scale(1.0) translate(-256 -256)%22%3E%3Cg transform=%22translate(256 270) skewX(-9) translate(-256 -270)%22 fill=%22none%22 stroke=%22%23d5f580%22 stroke-width=%2258%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M318 142 C 296 118, 232 116, 224 176 L 224 384%22/%3E%3Cpath d=%22M162 244 H 296%22/%3E%3C/g%3E%3Ccircle cx=%22338%22 cy=%22370%22 r=%2230%22 fill=%22%238fbf4a%22/%3E%3C/g%3E%3C/svg%3E">
  <!-- Installable app (these only apply when Forma is served from a web address, not opened as a file). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Forma">
  <!-- A personal app: ask search engines not to list it. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Web fonts load when online; offline the app falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const saved = JSON.parse(localStorage.getItem('forma-v2') || '{}');
      const theme = saved.settings && saved.settings.theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* first visit or storage blocked */ }
  </script>
  <!-- Load order matters: data and helpers first, views next, wiring last. -->
  <script defer src="js/library.js"></script>
  <script defer src="js/util.js"></script>
  <script defer src="js/model.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/stats.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/views/week.js"></script>
  <script defer src="js/views/routines.js"></script>
  <script defer src="js/views/exercises.js"></script>
  <script defer src="js/views/quick.js"></script>
  <script defer src="js/views/progress.js"></script>
  <script defer src="js/views/settings.js"></script>
  <script defer src="js/player.js"></script>
  <script defer src="js/pwa.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#week" data-view="week"><span class="mark">f</span><span class="brand-word">forma</span><span class="brand-dot">.</span></a>
    <p class="eyebrow">YOUR OWN RHYTHM</p>
    <nav aria-label="Main navigation">
      <button data-view="week"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>My week</span></button>
      <button data-view="routines"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.3"/><circle cx="4.8" cy="12" r="1.3"/><circle cx="4.8" cy="17.5" r="1.3"/></svg><span>Routines</span></button>
      <button data-view="library"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Exercises</span></button>
      <button data-view="quick"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.6 15.4 12l-5.2 3.4z"/></svg><span>Quick start</span></button>
      <button data-view="progress"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M2.5 20.5h19"/></svg><span>Progress</span></button>
      <button data-view="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span>Settings</span></button>
    </nav>
    <div class="side-bottom">
      <div class="save-badge" data-save-status>Saved on this device</div>
      <p>Everything autosaves in this browser. Export a backup now and then.</p>
      <button class="text-btn" data-action="export">↓ Export backup</button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <span id="breadcrumb">MY WEEK</span>
      <button class="btn small light" data-action="log-activity">+ Log activity</button>
    </header>
    <div id="app"></div>
    <footer>Make room for movement. Make it your own.</footer>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <dialog id="picker"><div id="picker-content"></div></dialog>
  <input type="file" accept="application/json,.json" id="backup-file" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="update-bar" role="status" hidden><span>A new version of Forma is ready.</span><button class="btn small lime" data-action="apply-update">Update now</button><button class="text-btn" data-action="dismiss-update">Later</button></div>
</body>
</html>
