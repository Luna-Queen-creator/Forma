<script>/* js/util.js */
// Small shared helpers: DOM, escaping, ids, dates, numbers and unit formatting.
'use strict';

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ESCAPES[c]);

function uid() {
  if (window.crypto?.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const round1 = n => Math.round(n * 10) / 10;
const sum = (list, fn = x => x) => list.reduce((total, item) => total + (Number(fn(item)) || 0), 0);
const plural = (n, word, many = word + 's') => `${n} ${n === 1 ? word : many}`;

/** Trim trailing zeros: 12.50 -> "12.5", 20.0 -> "20". */
function fmtNum(n, decimals = 1) {
  if (!Number.isFinite(n)) return '0';
  return String(Number(n.toFixed(decimals)));
}

// ---------------------------------------------------------------- dates ----

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
/** Parse "YYYY-MM-DD" at noon so DST changes never shift the day. */
function parseDate(key) { return new Date(key + 'T12:00:00'); }
function addDays(d, n) { const copy = new Date(d); copy.setDate(copy.getDate() + n); return copy; }
function todayKey() { return dateKey(new Date()); }
function isValidDateKey(x) {
  return typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && Number.isFinite(parseDate(x).getTime()) && dateKey(parseDate(x)) === x;
}

/** First day of the week containing d, honouring the week-start setting (1 = Monday, 0 = Sunday). */
function startOfWeek(d, weekStart = state.settings.weekStart) {
  const copy = new Date(d);
  copy.setHours(12, 0, 0, 0);
  copy.setDate(copy.getDate() - ((copy.getDay() - weekStart + 7) % 7));
  return copy;
}
function weekKeyOf(d) { return dateKey(startOfWeek(d)); }

const shortDate = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const weekdayShort = d => d.toLocaleDateString(undefined, { weekday: 'short' });
const longDate = d => d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const dateTime = iso => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

/** m:ss clock for timers. */
function formatClock(seconds) {
  const n = Math.max(0, Math.ceil(seconds));
  const h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), s = n % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
/** Human duration: "45 sec", "12 min", "1 h 5 min". */
function fmtDuration(seconds) {
  const n = Math.round(seconds || 0);
  if (n < 60) return `${n} sec`;
  const minutes = Math.round(n / 60);
  if (minutes < 60) return `${minutes} min`;
  return `${Math.floor(minutes / 60)} h${minutes % 60 ? ' ' + (minutes % 60) + ' min' : ''}`;
}

// ---------------------------------------------------------------- units ----
// Weights are stored in kg and distances in metres; only the display converts.

const KG_PER_LB = 0.45359237;
const M_PER_MI = 1609.344;
const imperial = () => state.settings.units === 'imperial';
const weightUnit = () => (imperial() ? 'lb' : 'kg');
const distanceUnit = () => (imperial() ? 'mi' : 'km');

function kgToDisplay(kg) { return imperial() ? kg / KG_PER_LB : kg; }
function displayToKg(v) { return imperial() ? v * KG_PER_LB : v; }
function mToDisplay(m) { return imperial() ? m / M_PER_MI : m / 1000; }
function displayToM(v) { return Math.round(imperial() ? v * M_PER_MI : v * 1000); }

function fmtWeight(kg) { return `${fmtNum(kgToDisplay(kg), 1)} ${weightUnit()}`; }
function fmtDistance(m) {
  if (!imperial() && m < 1000) return `${Math.round(m)} m`;
  return `${fmtNum(mToDisplay(m), 2)} ${distanceUnit()}`;
}
/** Pace as m:ss per km/mi. */
function fmtPace(seconds, metres) {
  if (!seconds || !metres) return '';
  return `${formatClock(seconds / mToDisplay(metres))} /${distanceUnit()}`;
}

<script>/* js/model.js */
// Domain constants, exercise lookup, templates and the routine compiler.
'use strict';

const MUSCLES = ['Shoulders', 'Chest', 'Arms', 'Core', 'Back', 'Glutes', 'Quadriceps', 'Hamstrings', 'Calves',
  'Adductors', 'Hip flexors', 'Forearms', 'Neck'];

const CATEGORIES = ['Strength', 'HIIT', 'Endurance', 'Yoga', 'Flexibility', 'Mobility', 'Warm-up', 'Balance',
  'Meditation', 'Advanced flexibility'];

/** Extra categories that only exist on logged activities. */
const ACTIVITY_ONLY_CATEGORIES = ['Sport', 'Other'];

const CATEGORY_META = {
  'Strength': { cls: 'strength', icon: '↗' },
  'HIIT': { cls: 'hiit', icon: '≋' },
  'Endurance': { cls: 'endurance', icon: '→' },
  'Yoga': { cls: 'yoga', icon: '◌' },
  'Flexibility': { cls: 'flexibility', icon: '↔' },
  'Mobility': { cls: 'mobility', icon: '↻' },
  'Warm-up': { cls: 'warmup', icon: '◔' },
  'Balance': { cls: 'balance', icon: '⊥' },
  'Meditation': { cls: 'meditation', icon: '◯' },
  'Advanced flexibility': { cls: 'advflex', icon: '⟷' },
  'Sport': { cls: 'sport', icon: '◈' },
  'Other': { cls: 'other', icon: '◈' },
};
const catClass = c => CATEGORY_META[c]?.cls || 'other';
const catIcon = c => CATEGORY_META[c]?.icon || '◈';
const isStretch = c => c === 'Flexibility' || c === 'Advanced flexibility';

/** Coarse groups used for charts so a stacked bar never needs more than five colours. */
const STAT_GROUPS = ['Strength', 'Cardio', 'Yoga & mobility', 'Mind', 'Sport & other'];
function statGroup(category) {
  if (category === 'Strength') return 'Strength';
  if (category === 'HIIT' || category === 'Endurance') return 'Cardio';
  if (category === 'Meditation') return 'Mind';
  if (['Yoga', 'Flexibility', 'Mobility', 'Warm-up', 'Balance', 'Advanced flexibility'].includes(category)) return 'Yoga & mobility';
  return 'Sport & other';
}

const GEAR = ['Mat', 'Chair or bench', 'Wall or support', 'Yoga props', 'Dumbbells', 'Kettlebell', 'Barbell',
  'Squat rack', 'Weight bench', 'Resistance band', 'Pull-up bar', 'Dip bars', 'Rings / suspension',
  'Cable / machines', 'Cardio machine', 'Bike', 'Pool', 'Box or step', 'Jump rope', 'Battle ropes'];
const DEFAULT_GEAR = ['Mat', 'Chair or bench', 'Wall or support'];

const SECTIONS = ['Warm-up', 'Main', 'Cool-down'];
const SIDES = ['Not applicable', 'Both sides', 'Alternating', 'Left', 'Right'];
const LEGACY_SIDES = ['Both / alternating'];
const MODES = ['reps', 'time', 'manual', 'distance'];
const MODE_LABELS = { reps: 'Repetitions', time: 'Timed', manual: 'Open hold (tap to finish)', distance: 'Distance' };

/** Types offered when logging something done outside the app. */
const ACTIVITY_TYPES = [
  { name: 'Run', category: 'Endurance', distance: true },
  { name: 'Walk', category: 'Endurance', distance: true },
  { name: 'Hike', category: 'Endurance', distance: true },
  { name: 'Cycling', category: 'Endurance', distance: true },
  { name: 'Swim', category: 'Endurance', distance: true },
  { name: 'Rowing', category: 'Endurance', distance: true },
  { name: 'Gym session', category: 'Strength' },
  { name: 'Class or group workout', category: 'HIIT' },
  { name: 'Yoga class', category: 'Yoga' },
  { name: 'Pilates', category: 'Mobility' },
  { name: 'Stretching', category: 'Flexibility' },
  { name: 'Meditation', category: 'Meditation' },
  { name: 'Climbing', category: 'Sport' },
  { name: 'Team sport', category: 'Sport' },
  { name: 'Racket sport', category: 'Sport' },
  { name: 'Martial arts', category: 'Sport' },
  { name: 'Dance', category: 'Sport' },
  { name: 'Other', category: 'Other' },
];

// ------------------------------------------------------------ exercises ----

const BUILTIN_BY_ID = new Map(BUILTIN_EXERCISES.map(e => [e.id, e]));

function allExercises() { return [...BUILTIN_EXERCISES, ...state.exercises]; }
function exercise(id) { return BUILTIN_BY_ID.get(id) || state.exercises.find(x => x.id === id); }
function exerciseByName(name) {
  const lower = String(name || '').toLowerCase();
  return state.exercises.find(x => x.name.toLowerCase() === lower) || BUILTIN_EXERCISES.find(x => x.name.toLowerCase() === lower);
}

/** True when every required piece of equipment (or one of its alternatives) is owned. */
function gearOk(e, owned = state.settings.gear) {
  return (e.gear || []).every(g => g.split('|').some(alt => owned.includes(alt)));
}
const gearLabel = g => g.split('|').join(' or ');

/** A fresh editor block for an exercise, using sensible defaults for its type. */
function newMove(e) {
  const strength = (e.category === 'Strength' || e.category === 'HIIT') && e.mode === 'reps';
  return {
    id: uid(), kind: 'exercise', exerciseId: e.id,
    section: e.category === 'Warm-up' ? 'Warm-up' : 'Main',
    mode: e.mode, sets: strength ? 3 : 1, value: e.value,
    rest: strength ? state.settings.defaultRest : 0, weight: 0,
    side: e.bilateral ? 'Both sides' : 'Not applicable', firstSide: 'Left', sideSwitch: 10,
    transition: null, waitReady: e.level === 'Advanced', note: '',
  };
}

// ------------------------------------------------------------ templates ----

/** Template step. `legacy` keeps the original templates exactly as they were. */
function tplStep(exerciseId, section = 'Main', overrides = {}) {
  const e = BUILTIN_BY_ID.get(exerciseId);

}

// ------------------------------------------------------- routine engine ----

/** Fill in defaults so older saved blocks behave like new ones. */
function normalizeBlock(s, find = exercise) {
  if (s.kind === 'group') return { ...s, name: s.name || '', rounds: s.rounds ?? 2, steps: (s.steps || []).map(b => normalizeBlock(b, find)) };
  if (s.kind === 'rest') return { ...s, value: s.value ?? 30, section: s.section || 'Main' };
  return {
    ...s, kind: 'exercise',
    mode: s.mode || find(s.exerciseId)?.mode || 'reps',
    side: LEGACY_SIDES.includes(s.side) ? 'Alternating' : (s.side || 'Not applicable'),
    transition: s.transition ?? null, sideSwitch: s.sideSwitch ?? 10, firstSide: s.firstSide || 'Left',
    waitReady: s.waitReady ?? false, weight: s.weight ?? 0, rest: s.rest ?? 0, note: s.note || '',

}

const MAX_QUEUE = 6000;

/**
 * Expand a routine into a flat queue of player steps:
 * move | rest | switch (change sides) | transition (setup time between exercises).
 */
function compileRoutine(r) {
  const queue = [];
  const add = q => {
    if (queue.length >= MAX_QUEUE) throw new Error('This routine expands to too many steps. Reduce its rounds or sets.');
    queue.push(q);
  };
  const expand = (blocks, roundLabel = '', groupName = '') => {
    for (const raw of blocks) {
      const s = normalizeBlock(raw);
      if (s.kind === 'group') {
        for (let round = 1; round <= s.rounds; round++) expand(s.steps, `Round ${round} of ${s.rounds}`, s.name);
        continue;
      }
      if (s.kind === 'rest') { add({ kind: 'rest', value: s.value, section: s.section, roundLabel, groupName }); continue; }
      const e = exercise(s.exerciseId);
      if (!e) throw new Error('An exercise in this routine is no longer available.');
      for (let set = 1; set <= s.sets; set++) {
        const sides = s.side === 'Both sides' ? [s.firstSide, s.firstSide === 'Left' ? 'Right' : 'Left'] : [s.side];
        sides.forEach((side, sideIndex) => {
          if (sideIndex && s.sideSwitch > 0) {
            add({ kind: 'switch', value: s.sideSwitch, section: s.section, roundLabel, groupName, nextSide: side });
          } else if (!sideIndex && queue.length && queue.at(-1).kind === 'move') {
            const seconds = s.transition ?? r.transition ?? 10;
            if (seconds > 0) add({ kind: 'transition', value: seconds, section: s.section, roundLabel, groupName });
          }
          add({ ...structuredClone(s), kind: 'move', blockId: s.id, exercise: structuredClone(e), set, side, roundLabel, groupName });
        });
        if (s.rest > 0) add({ kind: 'rest', value: s.rest, section: s.section, roundLabel, groupName });
      }
    }
  };
  expand(r.steps || []);
  return queue;
}

/** Rough seconds a queue step takes, for duration estimates. */
function stepSeconds(q) {
  if (q.kind !== 'move') return q.value;
  if (q.mode === 'reps') return q.value * 4;
  if (q.mode === 'distance') return (q.value / 1000) * (q.exercise.pace || 360);
  return q.value;
}

}

  try { return compileRoutine(r).filter(q => q.kind === 'move').length; } catch { return 0; }
}
/** Flat list of exercise blocks inside a routine (groups expanded once). */
function routineMoves(r) {
  const list = [];
  const walk = blocks => blocks.forEach(b => (b.kind === 'group' ? walk(b.steps || []) : b.kind !== 'rest' && list.push(b)));
  walk(r.steps || []);
  return list;
}

function routine(id) { return state.routines.find(x => x.id === id); }

/** One-line description of an editor block, e.g. "Back squat — 3 × 5 · 60 kg". */
function blockSummary(b) {
  if (b.kind === 'rest') return `Break · ${fmtDuration(b.value)}`;
  if (b.kind === 'group') {
    const names = (b.steps || []).filter(x => x.kind !== 'rest').map(x => exercise(x.exerciseId)?.name).filter(Boolean);
    return `${b.name ? b.name + ': ' : ''}${b.rounds} rounds of ${names.join(', ') || 'nothing yet'}`;
  }
  const e = exercise(b.exerciseId);
  const amount = b.mode === 'reps' ? `${b.value} reps` : b.mode === 'distance' ? fmtDistance(b.value) : fmtDuration(b.value);
  const sets = b.sets > 1 ? `${b.sets} × ${amount}` : amount;
  const extras = [b.weight ? fmtWeight(b.weight) : '', b.side === 'Both sides' ? 'each side' : ''].filter(Boolean).join(' · ');
  return `${e?.name || 'Unavailable exercise'} — ${sets}${extras ? ' · ' + extras : ''}`;
}

const TEMPLATES = buildTemplates();

<script>/* js/store.js */
// State, persistence, migration from the first version, validation and backups.
'use strict';

const STORAGE_KEY = 'forma-v2';
const SESSION_KEY = 'forma-v2-session';
const LEGACY_KEY = 'forma-v1';

/** Colour themes: id, name, and the two colours shown on the swatch. */
const PALETTES = [
  { id: 'forest', name: 'Forest', a: '#123c39', b: '#d5f580' },
  { id: 'rose', name: 'Rose', a: '#8a1d4e', b: '#ffc9de' },
  { id: 'lavender', name: 'Lavender', a: '#45318c', b: '#dccfff' },
  { id: 'ocean', name: 'Ocean', a: '#0f4c75', b: '#a9e8ff' },
  { id: 'kitty', name: 'Kitty', a: '#ff8fbd', b: '#ffd6e7' },
];

const DEFAULT_SETTINGS = {
  units: 'metric',        // metric | imperial
  weekStart: 1,           // 1 = Monday, 0 = Sunday
  theme: 'system',        // system | light | dark
  palette: 'forest',      // colour theme, see PALETTES
  sounds: true,           // bell at the end of timed steps
  countdown: true,        // short beeps for the last three seconds
  wakeLock: true,         // keep the screen on while a session runs
  defaultRest: 60,        // rest between sets for newly added strength moves
  gear: [...DEFAULT_GEAR],
  onlyMyGear: false,
  lastBackupAt: '',       // when a backup was last exported or shared
};

function freshState() {
  return { version: 2, settings: structuredClone(DEFAULT_SETTINGS), exercises: [], routines: [], schedule: [], history: [] };
}

let state = freshState();
let storageOK = true;
let storageProblem = '';

// ---------------------------------------------------------- validation ----

class BackupError extends Error {}

/**
 * Validate anything that came from storage or a backup file and bring it up to the current
 * version. Throws BackupError with a readable reason when something is wrong.
 * Accepts version 1 (the original Forma) and version 2.
 */
function normalizeState(raw) {
  const fail = why => { throw new BackupError('This is not a valid Forma backup: ' + why + '.'); };
  const str = (x, n = 5000) => typeof x === 'string' && x.length <= n;
  const num = (x, min, max) => Number.isFinite(x) && x >= min && x <= max;
  const int = (x, min, max) => num(x, min, max) && Number.isInteger(x);
  const idOk = x => str(x, 100) && /^[a-zA-Z0-9_-]+$/.test(x);
  const bool = x => typeof x === 'boolean';
  const optional = (x, test) => x === undefined || x === null || test(x);

  if (!raw || typeof raw !== 'object') fail('the file is empty or unreadable');
  if (raw.version !== 1 && raw.version !== 2) fail('unknown version');
  for (const key of ['exercises', 'routines', 'schedule', 'history']) {
    if (!Array.isArray(raw[key]) || raw[key].length > 20000) fail(`the ${key} list is missing or too long`);
  }
  const s = structuredClone(raw);
  const out = freshState();

  // Settings (v2 only). Unknown or invalid values fall back to defaults instead of failing.
  const st = s.settings || {};
  const pick = (key, ok) => (ok(st[key]) ? st[key] : DEFAULT_SETTINGS[key]);
  out.settings = {
    units: pick('units', x => ['metric', 'imperial'].includes(x)),
    weekStart: pick('weekStart', x => x === 0 || x === 1),
    theme: pick('theme', x => ['system', 'light', 'dark'].includes(x)),
    palette: pick('palette', x => PALETTES.some(p => p.id === x)),
    sounds: pick('sounds', bool), countdown: pick('countdown', bool), wakeLock: pick('wakeLock', bool),
    defaultRest: pick('defaultRest', x => int(x, 0, 600)),
    gear: Array.isArray(st.gear) ? st.gear.filter(g => GEAR.includes(g)) : [...DEFAULT_GEAR],
    onlyMyGear: pick('onlyMyGear', bool),
    lastBackupAt: pick('lastBackupAt', x => typeof x === 'string' && x.length <= 40),
  };

  // Custom exercises.
  const ids = new Set(BUILTIN_EXERCISES.map(e => e.id));
  const checkExercise = (e, where) => {
    if (!e || !idOk(e.id) || !str(e.name, 90) || !e.name.trim()) fail(`${where} has an invalid name or id`);
    if (!CATEGORIES.includes(e.category)) fail(`${where} (“${e.name}”) has an unknown activity`);
    if (!MODES.includes(e.mode) || !num(e.value, 1, e.mode === 'distance' ? 1e6 : 7200)) fail(`“${e.name}” has an invalid default value`);
    if (!Array.isArray(e.primary) || !Array.isArray(e.secondary || []) || ![...e.primary, ...(e.secondary || [])].every(m => MUSCLES.includes(m))) fail(`“${e.name}” lists an unknown muscle`);
    if (!Array.isArray(e.instructions) || e.instructions.length > 100 || !e.instructions.every(x => str(x))) fail(`“${e.name}” has invalid instructions`);
    if (!str(e.equipment ?? '', 100)) fail(`“${e.name}” has invalid equipment`);
    if (!optional(e.gear, g => Array.isArray(g) && g.every(x => str(x, 200)))) fail(`“${e.name}” has invalid equipment tags`);
    if ((e.image && !safeURL(e.image)) || (e.video && !safeURL(e.video))) fail(`“${e.name}” has a non-HTTPS link`);
  };
  for (const e of s.exercises) {
    checkExercise(e, 'A custom exercise');
    if (ids.has(e.id)) fail(`the exercise id “${e.id}” is used twice`);
    ids.add(e.id);
    out.exercises.push({
      id: e.id, name: e.name.trim(), category: e.category, mode: e.mode, value: e.value,
      primary: e.primary, secondary: e.secondary || [], instructions: e.instructions,
      equipment: e.equipment || '', gear: (e.gear || []).filter(g => g.split('|').every(x => GEAR.includes(x))),
      level: e.level === 'Advanced' ? 'Advanced' : 'General', bilateral: e.bilateral === true,
      image: e.image || '', video: e.video || '', basedOn: str(e.basedOn, 100) ? e.basedOn : undefined, custom: true,
    });
  }

  // Look exercises up in the data being loaded, not in whatever is currently open.
  const lookup = id => BUILTIN_BY_ID.get(id) || out.exercises.find(x => x.id === id);
  const lookupName = name => {
    const lower = String(name || '').toLowerCase();
    return out.exercises.find(x => x.name.toLowerCase() === lower) || BUILTIN_EXERCISES.find(x => x.name.toLowerCase() === lower);
  };

  // Routines.
  const checkBlocks = (list, depth, name) => {
    if (!Array.isArray(list) || list.length > 200) fail(`routine “${name}” has an invalid sequence`);
    for (const t of list) {
      if (!t || typeof t !== 'object') fail(`routine “${name}” has an empty block`);
      if (t.id !== undefined && !idOk(t.id)) fail(`routine “${name}” has a block with an invalid id`);
      if (!t.id) t.id = uid();
      if (t.kind === 'group') {
        if (depth || !int(t.rounds, 1, 50) || !optional(t.name, x => str(x, 60))) fail(`routine “${name}” has an invalid repeat group`);
        checkBlocks(t.steps, depth + 1, name);
        continue;
      }
      if (t.kind === 'rest') {
        if (!int(t.value, 1, 3600)) fail(`routine “${name}” has an invalid break`);
        continue;
      }
      const mode = t.mode ?? lookup(t.exerciseId)?.mode;
      const ok = ids.has(t.exerciseId) && int(t.sets, 1, 50)
        && int(t.value, 1, mode === 'distance' ? 1e6 : 7200) && int(t.rest, 0, 3600) && num(t.weight ?? 0, 0, 1000)
        && SECTIONS.includes(t.section) && [...SIDES, ...LEGACY_SIDES].includes(t.side)
        && optional(t.mode, x => MODES.includes(x)) && optional(t.transition, x => int(x, 0, 600))
        && optional(t.sideSwitch, x => int(x, 0, 120)) && optional(t.firstSide, x => ['Left', 'Right'].includes(x))
        && optional(t.waitReady, bool) && optional(t.note, x => str(x, 200));
      if (!ok) fail(`routine “${name}” has an invalid exercise step`);
    }
  };
  const routineIds = new Set();
  for (const r of s.routines) {
    if (!idOk(r.id) || routineIds.has(r.id) || !str(r.name, 90) || !r.name.trim() || !str(r.description ?? '', 200)
      || !CATEGORIES.includes(r.category) || !optional(r.transition, x => int(x, 0, 600))) fail('a routine has an invalid name, id or activity');
    routineIds.add(r.id);
    checkBlocks(r.steps, 0, r.name);
    if (!optional(r.nextNote, x => str(x, 2000))) fail(`routine “${r.name}” has an invalid note`);
    out.routines.push({ id: r.id, name: r.name, description: r.description || '', category: r.category, nextNote: r.nextNote || '',
      transition: r.transition ?? 10, steps: r.steps.map(b => normalizeBlock(b, lookup)), createdAt: str(r.createdAt, 50) ? r.createdAt : undefined });
  }

  // Schedule.
  const scheduleIds = new Set();
  for (const p of s.schedule) {
    const ok = idOk(p.id) && !scheduleIds.has(p.id) && routineIds.has(p.routineId) && isValidDateKey(p.date)
      && bool(p.repeat) && str(p.time ?? '', 5) && (!p.time || /^([01]\d|2[0-3]):[0-5]\d$/.test(p.time))
      && optional(p.skip, x => Array.isArray(x) && x.every(isValidDateKey)) && optional(p.until, x => x === '' || isValidDateKey(x));
    if (!ok) fail('a planned session is invalid');
    scheduleIds.add(p.id);
    out.schedule.push({ id: p.id, routineId: p.routineId, date: p.date, time: p.time || '', repeat: p.repeat, skip: p.skip || [], until: p.until || '' });
  }

  // History. Version 1 stored only the planned values; they become the "actual" values here.
  const checkSet = t => {
    const ok = str(t.name, 90) && MODES.includes(t.mode) && num(t.value, 0, 1e6) && num(t.weight ?? 0, 0, 1000)
      && str(t.side ?? '', 30) && num(t.set ?? 1, 1, 50) && optional(t.actualSeconds, x => num(x, 0, 1e9))
      && optional(t.roundLabel, x => str(x, 100)) && optional(t.reps, x => num(x, 0, 10000))
      && optional(t.distance, x => num(x, 0, 1e7)) && optional(t.exerciseId, idOk);
    if (!ok) fail('a recorded set is invalid');
    const e = (t.exerciseId && lookup(t.exerciseId)) || lookupName(t.name);
    return {
      exerciseId: e?.id || t.exerciseId, name: t.name, category: t.category || e?.category || 'Other', mode: t.mode,
      value: t.value, reps: t.reps ?? (t.mode === 'reps' ? t.value : undefined), weight: t.weight ?? 0,
      distance: t.distance ?? (t.mode === 'distance' ? t.value : undefined), side: t.side || 'Not applicable',
      set: t.set ?? 1, sets: t.sets, actualSeconds: t.actualSeconds, roundLabel: t.roundLabel || '', queueIndex: t.queueIndex,
    };
  };
  const categoryFor = h => {
    if (CATEGORIES.includes(h.category) || ACTIVITY_ONLY_CATEGORIES.includes(h.category)) return h.category;
    const r = out.routines.find(x => x.id === h.routineId) || out.routines.find(x => x.name === h.name);
    if (r) return r.category;
    if (/meditation/i.test(h.name)) return 'Meditation';
    return 'Other';
  };
  const historyIds = new Set();
  for (const h of s.history) {
    const ok = idOk(h.id) && !historyIds.has(h.id) && str(h.name, 90) && str(h.at, 50) && Number.isFinite(Date.parse(h.at))
      && num(h.seconds, 0, 1e7) && num(h.skipped ?? 0, 0, 10000) && Array.isArray(h.steps ?? []) && (h.steps ?? []).length <= MAX_QUEUE
      && optional(h.type, x => ['session', 'activity'].includes(x)) && optional(h.effort, x => int(x, 1, 10))
      && optional(h.note, x => str(x, 2000)) && optional(h.distance, x => num(x, 0, 1e7)) && optional(h.kind, x => str(x, 60))
      && optional(h.routineId, x => str(x, 100));
    if (!ok) fail('a history entry is invalid');
    historyIds.add(h.id);
    out.history.push({
      id: h.id, type: h.type || 'session', name: h.name, at: h.at, seconds: h.seconds, skipped: h.skipped || 0,
      category: categoryFor(h), routineId: h.routineId || out.routines.find(x => x.name === h.name)?.id,
      steps: (h.steps || []).map(checkSet), effort: h.effort, note: h.note || '', kind: h.kind, distance: h.distance,
      manual: h.manual === true,
    });
  }
  out.history.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));

  // An unfinished session (backups include one; version 1 kept it inside the state).
  if (s.activeSession) out.activeSession = normalizeSession(s.activeSession, checkExercise, checkSet, fail);
  return out;
}

function normalizeSession(a, checkExercise, checkSet, fail) {
  const str = (x, n) => typeof x === 'string' && x.length <= n;
  const num = (x, min, max) => Number.isFinite(x) && x >= min && x <= max;
  const int = (x, min, max) => num(x, min, max) && Number.isInteger(x);
  const ok = str(a.id, 100) && str(a.name, 90) && Array.isArray(a.queue) && a.queue.length && a.queue.length <= MAX_QUEUE
    && int(a.index, 0, a.queue.length - 1) && num(a.remaining, 0, 86400) && num(a.elapsed, 0, 1e9)
    && num(a.stepElapsed ?? 0, 0, 1e9) && Array.isArray(a.completed) && a.completed.length <= MAX_QUEUE;
  if (!ok) fail('the unfinished session is invalid');
  for (const q of a.queue) {
    if (!['move', 'rest', 'switch', 'transition'].includes(q.kind) || !num(q.value, 0, 1e6) || !str(q.section || '', 30) || !str(q.roundLabel || '', 100)) fail('the unfinished session has an invalid step');
    if (q.kind === 'move') {
      checkExercise(q.exercise, 'An exercise in the unfinished session');
      if (!MODES.includes(q.mode) || !int(q.set, 1, 50) || !int(q.sets, 1, 50) || !str(q.side, 30) || !num(q.weight ?? 0, 0, 1000)) fail('the unfinished session has an invalid exercise');
    }
    if (q.kind === 'switch' && !['Left', 'Right'].includes(q.nextSide)) fail('the unfinished session has an invalid side change');
  }
  return {
    ...a, completed: a.completed.map(checkSet), stepElapsed: a.stepElapsed || 0,
    skippedIdx: Array.isArray(a.skippedIdx) ? a.skippedIdx.filter(Number.isInteger) : [],
    skipped: Number.isInteger(a.skipped) ? a.skipped : 0,
    running: false, recovered: true, deadline: 0, lastTick: 0, pending: null,
  };
}

function safeURL(s) {
  if (!s) return false;
  try { return new URL(s).protocol === 'https:'; } catch { return false; }
}

// --------------------------------------------------------- persistence ----

function readStored(key) {
  const text = localStorage.getItem(key);
  return text ? { text, data: normalizeState(JSON.parse(text)) } : null;
}

/** Load in order of preference; keeps an untouched copy of anything that fails to load. */
function loadState() {
  let lastError = null;
  for (const key of [STORAGE_KEY, STORAGE_KEY + '-recovery', LEGACY_KEY, LEGACY_KEY + '-recovery']) {
    try {
      const found = readStored(key);
      if (!found) continue;
      state = found.data;
      if (key.startsWith(LEGACY_KEY)) storageProblem = 'migrated';
      if (lastError) storageProblem = 'recovered';
      return;
    } catch (err) {
      lastError = err;
      try {
        const text = localStorage.getItem(key);
        if (text && !localStorage.getItem('forma-unreadable-' + key)) localStorage.setItem('forma-unreadable-' + key, text);
      } catch { /* storage full or blocked */ }
    }
  }
  if (lastError) { storageOK = false; storageProblem = 'unreadable'; }
  else {
    try { localStorage.setItem('forma-probe', '1'); localStorage.removeItem('forma-probe'); }
    catch { storageOK = false; storageProblem = 'blocked'; }
  }
}

function loadSession() {
  let snapshot = state.activeSession;
  delete state.activeSession;
  try {
    const text = localStorage.getItem(SESSION_KEY);
    if (text) {
      const wrapped = normalizeState({ ...freshState(), exercises: state.exercises, routines: [], schedule: [], history: [], activeSession: JSON.parse(text) });
      snapshot = wrapped.activeSession;
    }
  } catch { /* an unreadable session is simply dropped */ }
  return snapshot || null;
}

function save() {
  state.lastSavedAt = new Date().toISOString();
  try {
    const data = JSON.stringify(state);
    localStorage.setItem(STORAGE_KEY, data);
    storageOK = true;
    try { localStorage.setItem(STORAGE_KEY + '-recovery', data); } catch { /* recovery copy is best effort */ }
  } catch {
    storageOK = false;
    toast('Could not save on this device. Export a backup before leaving.');
  }
  updateSaveBadges();
}

/** Called about once a second during a session; only writes the small session record. */
function saveSession() {
  try {
    if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(sessionSnapshot()));
    else localStorage.removeItem(SESSION_KEY);
  } catch { /* the main save reports storage problems */ }
}

function updateSaveBadges() {
  const text = storageOK ? 'Saved on this device' : 'Saving unavailable';
  $$('[data-save-status]').forEach(el => { el.textContent = text; el.classList.toggle('bad', !storageOK); });
}

// ------------------------------------------------------------- backups ----

function backupText() {
  if (session) { accountTime(); saveSession(); }
  const data = { ...state, exportedAt: new Date().toISOString(), app: 'Forma' };
  if (session && !session.isDemo) data.activeSession = sessionSnapshot();
  return JSON.stringify(data, null, 2);
}
const backupName = () => `forma-backup-${todayKey()}.json`;

function markBackedUp() {
  state.settings.lastBackupAt = new Date().toISOString();
  save();
}

function exportBackup() {
  download(backupName(), backupText(), 'application/json');
  markBackedUp();
  toast('Backup downloaded. Keep it somewhere safe.');
}

/** On phones: hand the backup to the share sheet (Google Drive, email, messages…). */
function canShareFiles() {
  try { return !!navigator.canShare?.({ files: [new File(['{}'], 'test.json', { type: 'application/json' })] }); } catch { return false; }
}
async function shareBackup() {
  const file = new File([backupText()], backupName(), { type: 'application/json' });
  try {
    await navigator.share({ files: [file], title: 'Forma backup' });
    markBackedUp();
    toast('Backup shared.');
  } catch (err) {
    if (err?.name !== 'AbortError') { toast('Sharing did not work here, so the backup was downloaded instead.'); exportBackup(); }
  }
}

function exportCSV() {
  const rows = [['date', 'time', 'session', 'type', 'category', 'duration_min', 'effort', 'exercise', 'set', 'side', 'planned', 'reps', `weight_${weightUnit()}`, 'seconds', `distance_${distanceUnit()}`, 'note']];
  const cell = v => {
    const text = String(v ?? '');
    return /[",\n;]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  };
  for (const h of state.history) {
    const d = new Date(h.at);
    const base = [dateKey(d), d.toTimeString().slice(0, 5), h.name, h.type, h.category, Math.round(h.seconds / 60), h.effort ?? ''];
    if (!h.steps.length) {
      rows.push([...base, '', '', '', '', '', '', '', h.distance ? fmtNum(mToDisplay(h.distance), 2) : '', h.note]);
      continue;
    }
    h.steps.forEach((t, i) => rows.push([...base, t.name, t.set, t.side, t.value, t.reps ?? '',
      t.weight ? fmtNum(kgToDisplay(t.weight), 1) : '', t.actualSeconds ?? '', t.distance ? fmtNum(mToDisplay(t.distance), 2) : '', i ? '' : h.note]));
  }
  download(`forma-history-${todayKey()}.csv`, rows.map(r => r.map(cell).join(',')).join('\n'), 'text/csv');
  toast('History exported as a spreadsheet file.');
}

function download(filename, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

<script>/* js/stats.js */
// Everything that reads the history: weekly totals, streaks, "last time", personal records.
'use strict';

const entryDay = h => dateKey(new Date(h.at));
const entryMinutes = h => h.seconds / 60;

function entryVolume(h) { return sum(h.steps, t => (t.weight && t.reps ? t.weight * t.reps : 0)); }
function entryDistance(h) { return h.distance || sum(h.steps, t => t.distance || 0); }
function entrySets(h) { return h.steps.length; }

/** Epley estimate of a one-rep max. Only meaningful for 1–12 reps with a load. */
function e1rm(weight, reps) {
  if (!weight || !reps || reps > 12) return 0;
  return reps === 1 ? weight : weight * (1 + reps / 30);
}

/** Does a logged history entry fulfil this planned session on this date? */
function doneEntryFor(plan, date) {
  const r = routine(plan.routineId);
  return state.history.find(h => entryDay(h) === date && h.type === 'session'
    && (h.routineId ? h.routineId === plan.routineId : r && h.name === r.name));
}

function entriesOn(date) { return state.history.filter(h => entryDay(h) === date); }

/** Minutes per week for the last `count` weeks, split into chart groups. Oldest first. */
function weeklyTotals(count = 12) {
  const thisWeek = startOfWeek(new Date());
  const weeks = Array.from({ length: count }, (_, i) => {
    const start = addDays(thisWeek, (i - count + 1) * 7);
    return { start, key: dateKey(start), total: 0, sessions: 0, groups: Object.fromEntries(STAT_GROUPS.map(g => [g, 0])) };
  });
  const byKey = new Map(weeks.map(w => [w.key, w]));
  for (const h of state.history) {
    const w = byKey.get(weekKeyOf(new Date(h.at)));
    if (!w) continue;
    const minutes = entryMinutes(h);
    w.groups[statGroup(h.category)] += minutes;
    w.total += minutes;
    w.sessions++;
  }
  return weeks;
}

/** Consecutive weeks with at least one entry. The current week only counts once it has one. */
function weekStreak() {
  const active = new Set(state.history.map(h => weekKeyOf(new Date(h.at))));
  let cursor = startOfWeek(new Date());
  if (!active.has(dateKey(cursor))) cursor = addDays(cursor, -7);
  let streak = 0;
  while (active.has(dateKey(cursor))) { streak++; cursor = addDays(cursor, -7); }
  return streak;
}

const matchesExercise = (t, e) => (t.exerciseId ? t.exerciseId === e.id : t.name === e.name);

/** Every recorded set of an exercise, newest session first: [{ entry, sets: [...] }]. */
function exerciseLog(e, excludeEntryId) {
  const out = [];
  for (let i = state.history.length - 1; i >= 0; i--) {
    const h = state.history[i];
    if (h.id === excludeEntryId) continue;
    const sets = h.steps.filter(t => matchesExercise(t, e));
    if (sets.length) out.push({ entry: h, sets });
  }
  return out;
}
function lastPerformance(e, excludeEntryId) { return exerciseLog(e, excludeEntryId)[0] || null; }

/** One set as short text: "8 × 60 kg", "45 sec", "5 km in 27:10". */
function setText(t) {
  if (t.mode === 'reps') return t.weight ? `${t.reps ?? t.value} × ${fmtWeight(t.weight)}` : `${t.reps ?? t.value} reps`;
  if (t.mode === 'distance') return `${fmtDistance(t.distance ?? t.value)}${t.actualSeconds ? ' in ' + formatClock(t.actualSeconds) : ''}`;
  return t.actualSeconds ? fmtDuration(t.actualSeconds) : fmtDuration(t.value);
}

/** Several sets compressed: "3 × 5 @ 80 kg" when identical, otherwise a list. */
function setsSummary(sets) {
  if (!sets.length) return '';
  const texts = sets.map(setText);
  if (texts.every(x => x === texts[0]) && sets.length > 1) {
    const t = sets[0];
    if (t.mode === 'reps') return t.weight ? `${sets.length} × ${t.reps ?? t.value} @ ${fmtWeight(t.weight)}` : `${sets.length} × ${t.reps ?? t.value} reps`;
    return `${sets.length} × ${texts[0]}`;
  }
  return texts.join(' · ');
}

/** Best results for one exercise across the given log. */
function bestOf(e, log = exerciseLog(e)) {
  const best = { weight: null, e1rm: 0, e1rmSet: null, reps: 0, seconds: 0, distance: 0, fastest: null, sessions: log.length, last: log[0]?.entry.at };
  for (const { sets } of log) {
    for (const t of sets) {
      if (t.mode === 'reps') {
        const reps = t.reps ?? t.value;
        if (t.weight && (!best.weight || t.weight > best.weight.weight || (t.weight === best.weight.weight && reps > (best.weight.reps ?? 0)))) best.weight = { ...t, reps };
        const est = e1rm(t.weight, reps);
        if (est > best.e1rm) { best.e1rm = est; best.e1rmSet = t; }
        if (!t.weight && reps > best.reps) best.reps = reps;
      } else if (t.mode === 'distance') {
        const d = t.distance ?? t.value;
        if (d > best.distance) best.distance = d;
        if (t.actualSeconds && d >= 1000) {
          const pace = t.actualSeconds / d;
          if (!best.fastest || pace < best.fastest.pace) best.fastest = { pace, seconds: t.actualSeconds, distance: d };
        }
      } else if ((t.actualSeconds ?? 0) > best.seconds) best.seconds = t.actualSeconds;
    }
  }
  return best;
}

/** The exercises you have logged, with their bests, most recently trained first. */
function allRecords() {
  const seen = new Map();
  for (let i = state.history.length - 1; i >= 0; i--) {
    for (const t of state.history[i].steps) {
      const key = t.exerciseId || 'name:' + t.name;
      if (!seen.has(key)) seen.set(key, exercise(t.exerciseId) || exerciseByName(t.name) || { id: t.exerciseId, name: t.name, category: t.category });
    }
  }
  return [...seen.values()].map(e => ({ e, best: bestOf(e) }));
}

/** Records beaten by a just-finished entry compared with everything before it. */
function newRecords(entry) {
  const found = [];
  const seen = new Set();
  for (const t of entry.steps) {
    const e = exercise(t.exerciseId) || exerciseByName(t.name);
    if (!e || seen.has(e.id)) continue;
    seen.add(e.id);
    const before = exerciseLog(e, entry.id);
    if (!before.length) continue;
    const old = bestOf(e, before);
    const now = bestOf(e, [{ entry, sets: entry.steps.filter(x => matchesExercise(x, e)) }]);
    if (now.weight && old.weight && now.weight.weight > old.weight.weight) found.push(`${e.name}: heaviest set, ${setText(now.weight)}`);
    else if (now.e1rm && old.e1rm && now.e1rm > old.e1rm * 1.001) found.push(`${e.name}: best estimated max, ${fmtWeight(now.e1rm)}`);
    else if (now.reps && now.reps > old.reps && !now.weight) found.push(`${e.name}: most reps, ${now.reps}`);
    else if (now.distance > old.distance && old.distance) found.push(`${e.name}: longest distance, ${fmtDistance(now.distance)}`);
    else if (now.seconds > old.seconds && old.seconds && e.category !== 'Meditation') found.push(`${e.name}: longest hold, ${fmtDuration(now.seconds)}`);
  }
  return found;
}

/** Where stickers sit on wide screens: [sticker, left %, top %, size px, rotation]. */

  ['face', 88, 12, 74, -10], ['paw', 24, 32, 46, 18], ['sleepy', 72, 46, 120, 4],
  ['heart', 52, 8, 40, 12], ['lifter', 6, 70, 92, -6], ['sparkle', 94, 60, 38, 0],
  ['sitting', 90, 82, 92, 6], ['facePink', 40, 88, 66, 10], ['paw', 64, 70, 40, -24],
  ['sparkle', 30, 54, 30, 0], ['heart', 16, 6, 34, -14], ['paw', 96, 30, 36, 30],
];
/** On phones there is no spare margin, so the stickers hug the screen edges, half tucked away,
    and stay clear of the top bar and headings. */
const STICKER_LAYOUT_PHONE = [
  ['face', 102, 26, 62, -14], ['paw', -1, 40, 40, 22], ['sleepy', 104, 55, 92, 6],
  ['lifter', -3, 69, 74, -8], ['heart', 101, 82, 34, 14], ['sparkle', 1, 55, 26, 0], ['facePink', -2, 93, 54, 12],
];

function stickerSVG(name, cls = '') {
  const s = STICKERS[name];
  return `<svg class="sticker ${cls}" viewBox="${s.box}" aria-hidden="true">${s.svg}</svg>`;
}

/** Fill the fixed background layer when the Kitty theme is on; empty it otherwise. */
function renderStickers() {
  const layer = $('#stickers');
  if (!layer) return;
  if (state.settings.palette !== 'kitty') { layer.innerHTML = ''; return; }
  const spots = (layout, cls) => layout.map(([name, left, top, size, rot]) =>
    `<span class="sticker-spot ${cls}" style="left:${left}%;top:${top}%;width:${size}px;transform:translate(-50%,-50%) rotate(${rot}deg)">${stickerSVG(name)}</span>`).join('');
  layer.innerHTML = spots(STICKER_LAYOUT, 'wide-only') + spots(STICKER_LAYOUT_PHONE, 'phone-only');
}

/** A kitten peeking over the top edge of the Today card. */
const PEEK_SVG = `<svg class="peek-kitty" viewBox="0 0 120 62" aria-hidden="true">
  <path d="M18 62 L20 30 L26 6 L48 24 Q60 21 72 24 L94 6 L100 30 L102 62Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  <path d="M18 62 L20 30 L26 6 L48 24 Q60 21 72 24 L94 6 L100 30 L102 62" fill="${FUR.white}" stroke="${KITTY_INK}" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M30 16 L33 30 L43 24Z M90 16 L87 30 L77 24Z" fill="#ffb3d0"/>
  <circle cx="45" cy="44" r="6" fill="${KITTY_INK}"/><circle cx="75" cy="44" r="6" fill="${KITTY_INK}"/>
  <circle cx="47" cy="42" r="2" fill="#fff"/><circle cx="77" cy="42" r="2" fill="#fff"/>
  <ellipse cx="34" cy="54" rx="6" ry="4" fill="#ff9cc4" opacity=".75"/><ellipse cx="86" cy="54" rx="6" ry="4" fill="#ff9cc4" opacity=".75"/>
  <path d="M57 50 h6 l-3 3.5z" fill="#ff7aa8"/>
  <ellipse cx="30" cy="62" rx="12" ry="8" fill="${FUR.white}" stroke="${KITTY_INK}" stroke-width="3"/>
  <ellipse cx="90" cy="62" rx="12" ry="8" fill="${FUR.white}" stroke="${KITTY_INK}" stroke-width="3"/>
  <path d="M26 58 v6 M34 58 v6 M86 58 v6 M94 58 v6" stroke="${KITTY_INK}" stroke-width="2" stroke-linecap="round"/></svg>`;
const peekKitty = () => (state.settings.palette === 'kitty' ? PEEK_SVG : '');

<script>/* js/ui.js */
// Shared UI: routing, dialogs, toasts, icons, the body map and small components.
'use strict';

/** Click handlers keyed by data-action. Each view registers its own. */
const actions = {};
/** Submit handlers keyed by form id. */
const forms = {};
/** Input/change handlers keyed by data-bind or element id. */
const binds = {};

const VIEWS = {
  week: { label: 'My week', crumb: 'MY WEEK' },
  routines: { label: 'Routines', crumb: 'ROUTINES' },
  library: { label: 'Exercises', crumb: 'EXERCISE LIBRARY' },
  quick: { label: 'Quick start', crumb: 'QUICK START' },
  progress: { label: 'Progress', crumb: 'PROGRESS' },
  settings: { label: 'Settings', crumb: 'SETTINGS' },
};
const renderers = {};
let view = 'week';

function go(name) {
  if (!VIEWS[name]) name = 'week';
  if (session) { toast('Finish or end your current session first.'); return; }
  view = name;
  if (location.hash !== '#' + name) history.replaceState(history.state, '', '#' + name);
  closeDialogs();
  render();
  window.scrollTo(0, 0);
}

// ------------------------------------------------------- back button ----
// Phones (and browsers) go "back" through history. While there is something to step back
// from (an open window, a workout, or any screen other than My week), Forma keeps exactly
// one extra history entry. Pressing back removes it; Forma then closes the top layer and
// adds the entry again if there is still more to step back from. On My week, back leaves.

let backGuard = history.state?.formaGuard === true;
let ignoreNextPop = false;
let backSyncTimer = 0;

function needsBackGuard() {
  return $('#modal').open || $('#picker').open || !!session || view !== 'week';
}
function syncBackGuard() {
  clearTimeout(backSyncTimer);
  backSyncTimer = setTimeout(() => {
    const need = needsBackGuard();
    if (need && !backGuard) { history.pushState({ formaGuard: true }, '', location.href); backGuard = true; }
    else if (!need && backGuard) { backGuard = false; ignoreNextPop = true; history.back(); }
  }, 0);
}
function keepHashInStep() {
  if (!session && location.hash !== '#' + view) history.replaceState(history.state, '', '#' + view);
}
/** One step back: the top-most thing closes. */
function handleBack() {
  if (typeof drag !== 'undefined' && drag) return;
  if ($('#picker').open) { actions['close-picker'](); return; }
  if ($('#modal').open) { if (pendingConfirm) actions['confirm-no'](); else actions.close(); return; }
  if (session) { exitSession(); return; }
  if (view !== 'week') go('week');
}
window.addEventListener('popstate', ev => {
  if (ignoreNextPop) { ignoreNextPop = false; keepHashInStep(); return; }
  backGuard = ev.state?.formaGuard === true;
  handleBack();
  keepHashInStep();
  syncBackGuard();
});

function render() {
  syncBackGuard();
  document.body.classList.toggle('in-session', !!session);
  if (session) { renderSession(); return; }
  $$('nav [data-view]').forEach(b => {
    const active = b.dataset.view === view;
    b.classList.toggle('active', active);
    if (active) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#breadcrumb').textContent = VIEWS[view].crumb;
  renderers[view]();
  if (!storageOK || storageProblem) app().insertAdjacentHTML('afterbegin', storageNotice());
  updateSaveBadges();
}

function storageNotice() {
  if (!storageOK && storageProblem === 'unreadable') return '<p class="note warning">Your saved data could not be read. A copy was kept in this browser. Restore a backup, or export before making changes.</p>';
  if (!storageOK) return '<p class="note warning">This browser is not letting Forma save. Export a backup before you leave.</p>';
  if (storageProblem === 'migrated') return '<p class="note">Welcome to the new Forma. Your routines, plans and history came across from the previous version.</p>';
  if (storageProblem === 'recovered') return '<p class="note">Your latest save could not be read, so Forma loaded the recovery copy.</p>';
  return '';
}

const app = () => $('#app');

// -------------------------------------------------------------- dialogs ----

function showModal(html, { wide = false, keepScroll = false } = {}) {
  const modal = $('#modal');
  const scroll = modal.scrollTop;
  $('#modal-content').innerHTML = `<div class="modal-inner">${html}</div>`;
  modal.classList.toggle('wide', wide);
  if (!modal.open) modal.showModal();
  modal.scrollTop = keepScroll ? scroll : 0;
}
function modalHead(title, sub = '') {
  return `<div class="modal-header"><div><h2>${esc(title)}</h2>${sub ? `<p class="muted small">${sub}</p>` : ''}</div>
    <button type="button" class="close" data-action="close" aria-label="Close dialog">×</button></div>`;
}
function closeModal() { const m = $('#modal'); if (m.open) m.close(); }
function closeDialogs() { closeModal(); const p = $('#picker'); if (p.open) p.close(); }

/** A small confirm dialog. `onYes` is stored and run by the confirm-yes action. */
let pendingConfirm = null;
function confirmDialog({ title, body, yes = 'Confirm', danger = true, onYes, onNo }) {
  pendingConfirm = { onYes, onNo };
  showModal(modalHead(title) + `<div>${body}</div><div class="modal-actions">
    <button type="button" class="btn light" data-action="confirm-no">Cancel</button>
    <button type="button" class="btn ${danger ? 'danger' : ''}" data-action="confirm-yes">${esc(yes)}</button></div>`);
}
actions['confirm-yes'] = () => { const c = pendingConfirm; pendingConfirm = null; closeModal(); c?.onYes?.(); };
actions['confirm-no'] = () => { const c = pendingConfirm; pendingConfirm = null; closeModal(); c?.onNo?.(); };

let toastTimer;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4200);
}

// ---------------------------------------------------------- components ----

function heading(title, sub = '', action = '') {
  return `<div class="heading"><div><h1>${title}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}</div>${action ? `<div class="heading-actions">${action}</div>` : ''}</div>`;
}
function emptyState(title, text, button = '') {
  return `<div class="empty"><h3>${title}</h3><p class="muted">${text}</p>${button}</div>`;
}
const pill = (text, cls = '') => `<span class="pill ${cls}">${text}</span>`;
function chips(name, values, current, labels = {}, cls = '') {
  return `<div class="chips ${cls}" role="group">${values.map(v => `<button type="button" class="chip ${v === current ? 'on' : ''}" data-action="chip" data-chip="${esc(name)}" data-value="${esc(v)}" aria-pressed="${v === current}">${esc(labels[v] || v)}</button>`).join('')}</div>`;
}
function options(values, current, labels = {}) {
  return values.map(v => `<option value="${esc(v)}" ${String(v) === String(current) ? 'selected' : ''}>${esc(labels[v] ?? v)}</option>`).join('');
}

const ICONS = {
  week: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  routines: '<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.3"/><circle cx="4.8" cy="12" r="1.3"/><circle cx="4.8" cy="17.5" r="1.3"/>',
  library: '<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
  quick: '<circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.6 15.4 12l-5.2 3.4z"/>',
  progress: '<path d="M4 20V11M10 20V5M16 20v-6M2.5 20.5h19"/>',
  settings: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
};
const icon = (name, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

/** Schematic front/back body with target areas coloured. */
function bodymap(e, size = '') {
  const stretch = isStretch(e?.category);
  const cls = m => (e?.primary?.includes(m) ? (stretch ? 'muscle stretch' : 'muscle primary') : e?.secondary?.includes(m) ? 'muscle secondary' : 'muscle');
  const figure = `<circle class="base" cx="30" cy="12" r="10"/><path class="base" d="M23 24h14l9 8 9 42-8 3-8-31-2 44 6 77-10 2-6-64-5 64-10-2 8-77-2-44-7 31-8-3 9-42z"/>`;
  return `<svg class="bodymap ${size}" viewBox="0 0 140 210" role="img" aria-label="Target areas: ${esc(e?.primary?.join(', ') || 'no specific muscles')}">
  <g transform="translate(4 7)">${figure}
    <path class="${cls('Chest')}" d="M20 36h9v15h-10zm11 0h9l1 15H31z"/><path class="${cls('Shoulders')}" d="M14 32l7-3-3 13-7 2zm26-3 7 3 3 12-7-2z"/>
    <path class="${cls('Arms')}" d="m10 46 7-2-6 24-6-2zm34-2 7 2 5 20-6 2z"/><path class="${cls('Core')}" d="M21 55h17l-2 28H23z"/>
    <path class="${cls('Quadriceps')}" d="m21 93 7 2-4 36-7-1zm10 2 7-2 3 37-7 1z"/><path class="${cls('Calves')}" d="m16 139 7 1-1 20-6 1zm19 1 7-1 1 22-6-1z"/>
    <path class="${cls('Adductors')}" d="m26 101 3 0-3 25-2-1zm4 0h3l3 24-2 1z"/><path class="${cls('Hip flexors')}" d="M21 84h7v8h-8zm11 0h6l1 8h-7z"/>
    <path class="${cls('Forearms')}" d="m7 61 5 2-3 9-5-2zm43 2 5-2 3 9-5 2z"/><path class="${cls('Neck')}" d="M26 23h8v6h-8z"/>
    <text x="16" y="190">FRONT</text></g>
  <g transform="translate(76 7)">${figure}
    <path class="${cls('Back')}" d="M21 34h18l-3 44H24z"/><path class="${cls('Shoulders')}" d="m14 32 7-3-3 13-7 2zm26-3 7 3 3 12-7-2z"/>
    <path class="${cls('Glutes')}" d="M21 82h18l1 16-10 3-11-3z"/><path class="${cls('Hamstrings')}" d="m20 103 7 2-3 28-7-1zm12 2 7-2 3 29-7 1z"/>
    <path class="${cls('Calves')}" d="m16 139 7 1-1 20-6 1zm19 1 7-1 1 22-6-1z"/><path class="${cls('Forearms')}" d="m7 61 5 2-3 9-5-2zm43 2 5-2 3 9-5 2z"/>
    <text x="18" y="190">BACK</text></g></svg>`;
}

/** Tiny line chart for a series of numbers (no axes, just the trend). */
function sparkline(values, { width = 220, height = 48 } = {}) {
  if (values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => [4 + (i / (values.length - 1)) * (width - 8), height - 6 - ((v - min) / span) * (height - 12)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const last = pts.at(-1);
  return `<svg class="sparkline" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" aria-hidden="true"><path d="${d}"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>`;
}

// --------------------------------------------------------------- theme ----

function applyTheme() {
  const root = document.documentElement;
  const t = state.settings.theme;
  if (t === 'system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', t);
  if (state.settings.palette === 'forest') root.removeAttribute('data-palette');
  else root.setAttribute('data-palette', state.settings.palette);
  // The phone's status bar takes the colour of the Today card.
  const bar = getComputedStyle(root).getPropertyValue('--hero-bg').trim();
  if (bar) $('meta[name="theme-color"]')?.setAttribute('content', bar);
  renderStickers();
}

<script>/* js/views/week.js */
// "My week": today's plan, the weekly calendar, scheduling and marking sessions done.
'use strict';

let weekOffset = 0;

function weekDays() {
  const start = addDays(startOfWeek(new Date()), weekOffset * 7);
  return Array.from({ length: 7 }, (_, i) => addDays(start, i));
}

/** Planned sessions on a day, including weekly repeats, earliest first. */
function plansOn(d) {
  const key = dateKey(d);
  return state.schedule
      .filter(s => (s.date === key && !s.skip.includes(key)) || (s.repeat && key > s.date && (!s.until || key <= s.until)
      && parseDate(s.date).getDay() === d.getDay() && !s.skip.includes(key)))
    .map(plan => ({ plan, routine: routine(plan.routineId), date: key }))
    .filter(x => x.routine)
    .sort((a, b) => (a.plan.time || '99').localeCompare(b.plan.time || '99'));
}

/** Plans (with their done entry, if any) plus anything logged that day that was not planned. */
function dayItems(d) {
  const key = dateKey(d);
  const used = new Set();
  const plans = plansOn(d).map(p => {
    const done = state.history.find(h => !used.has(h.id) && entryDay(h) === key && h.type === 'session'
      && (h.routineId ? h.routineId === p.plan.routineId : h.name === p.routine.name));
    if (done) used.add(done.id);
    return { ...p, done };
  });
  const logged = entriesOn(key).filter(h => !used.has(h.id));
  return { plans, logged };
}

function progressRing(fraction, big, small) {
  const r = 52, c = 2 * Math.PI * r;
  return `<div class="hero-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="${r}"/>
    <circle class="ring-fg" cx="60" cy="60" r="${r}" stroke-dasharray="${(clamp(fraction, 0, 1) * c).toFixed(1)} ${c.toFixed(1)}"/></svg>
    <div class="ring-label"><strong>${big}</strong><span>${small}</span></div></div>`;
}

function todayPanel() {
  const today = new Date();
  const { plans, logged } = dayItems(today);
  const open = plans.filter(p => !p.done);
  const title = plans.length && !open.length ? 'All done for today. Nicely done.'
    : open.length ? `${plural(open.length, 'session')} planned`
      : logged.length ? 'You moved today.' : 'Nothing planned yet.';
  const items = [
    ...plans.map(p => `<div class="today-item ${p.done ? 'done' : ''}">
      <div><strong>${esc(p.routine.name)}</strong><small>${[p.plan.time, `about ${duration(p.routine)} min`, p.routine.category].filter(Boolean).map(esc).join(' · ')}</small></div>
      ${p.done ? `<button class="done-badge" data-action="history-detail" data-id="${p.done.id}">${icon('check')} Done</button>`
        : `<button class="btn lime" data-action="start" data-id="${p.routine.id}">Start</button>`}</div>`),
    ...logged.map(h => `<div class="today-item done"><div><strong>${esc(h.name)}</strong><small>${fmtDuration(h.seconds)} · ${esc(h.category)}</small></div>
      <button class="done-badge" data-action="history-detail" data-id="${h.id}">${icon('check')} Logged</button></div>`),
  ].join('');

  // The ring covers the current calendar week.
  const days = Array.from({ length: 7 }, (_, i) => addDays(startOfWeek(today), i));
  let planned = 0, done = 0;
  days.forEach(d => { const x = dayItems(d); planned += x.plans.length; done += x.plans.filter(p => p.done).length; });
  const minutes = Math.round(sum(state.history.filter(h => weekKeyOf(new Date(h.at)) === dateKey(days[0])), entryMinutes));
  const ring = planned ? progressRing(done / planned, `${done}/${planned}`, 'planned sessions<br>done this week')
    : progressRing(minutes ? 1 : 0, minutes, 'minutes<br>this week');

  return `<section class="hero today">${peekKitty()}<div class="today-main">
    <p class="eyebrow">TODAY · ${esc(longDate(today).toUpperCase())}</p>
    <h2>${title}</h2>
    ${items ? `<div class="today-list">${items}</div>` : '<p class="hero-sub">Pick a routine, start something quick, or log what you did elsewhere.</p>'}
    <div class="row hero-actions">
      ${open.length ? '' : `<button class="btn lime" data-view="quick">Quick start</button>`}
      <button class="btn on-dark" data-action="schedule" data-date="${todayKey()}">${icon('plus')} Plan</button>
      <button class="btn on-dark" data-action="log-activity">${icon('plus')} Log activity</button>
    </div></div>${ring}</section>`;
}

renderers.week = () => {
  const days = weekDays(), today = todayKey();
  const calendar = days.map(d => {
    const key = dateKey(d);
    const { plans, logged } = dayItems(d);
    const events = plans.map(p => `<button class="event cat-${catClass(p.routine.category)} ${p.done ? 'done' : ''}" data-action="event" data-id="${p.plan.id}" data-date="${key}">
        ${p.done ? icon('check', 'event-check') : ''}${esc(p.routine.name)}
        <small>${[p.plan.time, duration(p.routine) + ' min', p.plan.repeat ? 'weekly' : ''].filter(Boolean).map(esc).join(' · ')}</small></button>`).join('')
      + logged.map(h => `<button class="event logged cat-${catClass(h.category)}" data-action="history-detail" data-id="${h.id}">
        ${icon('check', 'event-check')}${esc(h.name)}<small>${fmtDuration(h.seconds)}${h.distance ? ' · ' + fmtDistance(h.distance) : ''}</small></button>`).join('');
    return `<article class="day ${key === today ? 'today' : ''} ${key < today ? 'past' : ''}">
      <div class="day-label"><span>${weekdayShort(d)}</span><strong>${d.getDate()}</strong></div>
      ${events}<button class="add-day" data-action="schedule" data-date="${key}" aria-label="Plan a session on ${shortDate(d)}">＋</button></article>`;
  }).join('');

  const mine = state.routines.slice().sort((a, b) => lastDoneTime(b) - lastDoneTime(a)).slice(0, 3);
  app().innerHTML = heading('Your week, your way.', 'Plan it, do it, see it add up.',
    `<button class="btn" data-action="schedule">${icon('plus')} Plan a session</button>`)
    + todayPanel()
    + `<div class="row spread week-controls">
        <div class="row"><h2>${shortDate(days[0])} – ${shortDate(days[6])}</h2>${weekOffset ? '<button class="text-btn" data-action="this-week">Back to this week</button>' : ''}</div>
        <div class="row"><button class="icon-btn" aria-label="Previous week" data-action="prev-week">‹</button><button class="icon-btn" aria-label="Next week" data-action="next-week">›</button></div>
      </div>
      <section class="calendar" aria-label="Weekly schedule">${calendar}</section>
      <div class="section-head"><h2>${state.routines.length ? 'Ready when you are' : 'Start with a template'}</h2>
        <button class="text-btn" data-view="routines">All routines →</button></div>
      <section class="cards">${(state.routines.length ? mine : TEMPLATES.filter(t => ['tpl-fullbody', 'tpl-tabata', 'tpl-mobility'].includes(t.id))).map(r => routineCard(r, !state.routines.length)).join('')}</section>`;
};

function lastDoneTime(r) {
  for (let i = state.history.length - 1; i >= 0; i--) if (state.history[i].routineId === r.id) return Date.parse(state.history[i].at);
  return 0;
}

actions['prev-week'] = () => { weekOffset--; render(); };
actions['next-week'] = () => { weekOffset++; render(); };
actions['this-week'] = () => { weekOffset = 0; render(); };

// ----------------------------------------------------------- scheduling ----

function scheduleDialog(date = todayKey(), routineId) {
  if (!state.routines.length) {
    showModal(modalHead('Let’s make your first routine') + `<p>Save a routine before adding it to your week. Start from a template or build your own.</p>
      <div class="modal-actions"><button class="btn light" data-view="routines">Browse templates</button><button class="btn" data-action="new-routine">Create routine</button></div>`);
    return;
  }
  const order = [0, 1, 2, 3, 4, 5, 6].map(i => (i + state.settings.weekStart) % 7);
  const names = order.map(i => addDays(parseDate('2026-01-04'), i).toLocaleDateString(undefined, { weekday: 'short' })); // 4 Jan 2026 is a Sunday
  const day = parseDate(date).getDay();
  showModal(modalHead('Plan a session') + `<form id="schedule-form">
    <div class="field"><label for="plan-routine">Routine</label><select id="plan-routine" name="routineId">${state.routines.map(r => `<option value="${r.id}" ${routineId === r.id ? 'selected' : ''}>${esc(r.name)} · ${duration(r)} min</option>`).join('')}</select></div>
    <div class="form-grid"><div class="field"><label for="plan-date">Date</label><input id="plan-date" name="date" type="date" required value="${date}" data-bind="plan-date"></div>
      <div class="field"><label for="plan-time">Time (optional)</label><input id="plan-time" name="time" type="time"></div></div>
    <label class="checkrow"><input type="checkbox" name="repeat" data-bind="repeat-toggle"> Repeat every week</label>
    <div class="repeat-options" hidden>
      <p class="label">On</p>
      <div class="weekday-picker">${order.map((d, i) => `<label class="weekday"><input type="checkbox" name="days" value="${d}" ${d === day ? 'checked' : ''}><span>${esc(names[i])}</span></label>`).join('')}</div>
      <div class="field"><label for="plan-until">Until (optional)</label><input id="plan-until" name="until" type="date"></div>
    </div>
    <div class="modal-actions"><button class="btn light" type="button" data-action="close">Cancel</button><button class="btn">Add to my week</button></div></form>`);
}
binds['repeat-toggle'] = el => { el.form.querySelector('.repeat-options').hidden = !el.checked; };
binds['plan-date'] = el => {
  // Keep the pre-selected weekday in step with the date while repeat is still off.
  if (el.form.elements.repeat.checked || !isValidDateKey(el.value)) return;
  const day = String(parseDate(el.value).getDay());
  $$('input[name=days]', el.form).forEach(box => { box.checked = box.value === day; });
};

forms['schedule-form'] = (f, fd) => {
  const routineId = fd.get('routineId'), date = fd.get('date'), time = fd.get('time') || '';
  if (!isValidDateKey(date)) { toast('Choose a date.'); return; }
  if (fd.has('repeat')) {
    const until = fd.get('until') || '';
    if (until && until < date) { toast('The end date is before the start date.'); return; }
    const days = fd.getAll('days').map(Number);
    if (!days.length) days.push(parseDate(date).getDay());
    let added = 0;
    for (const weekday of days) {
      let d = parseDate(date);
      while (d.getDay() !== weekday) d = addDays(d, 1);
      if (until && dateKey(d) > until) continue;
      state.schedule.push({ id: uid(), routineId, date: dateKey(d), time, repeat: true, skip: [], until });
      added++;
    }
    toast(added > 1 ? `Added on ${added} days every week.` : 'Added to every week.');
  } else {
    state.schedule.push({ id: uid(), routineId, date, time, repeat: false, skip: [], until: '' });
    toast('Added to your week.');
  }
  save(); closeModal(); render();
};

actions.schedule = el => scheduleDialog(el.dataset.date || todayKey());
actions['schedule-routine'] = el => scheduleDialog(todayKey(), el.dataset.id);

actions.event = el => eventDialog(el.dataset.id, el.dataset.date);
function eventDialog(id, date) {
  const s = state.schedule.find(x => x.id === id), r = routine(s.routineId);
  const done = dayItems(parseDate(date)).plans.find(p => p.plan.id === id)?.done;
  const repeatText = s.repeat ? ` · repeats weekly${s.until ? ' until ' + shortDate(parseDate(s.until)) : ''}` : '';
  showModal(modalHead(r.name, esc(longDate(parseDate(date)) + (s.time ? ' · ' + s.time : '')))
    + `<p>${pill(esc(r.category))} <span class="muted">About ${duration(r)} min · ${plural(countSets(r), 'set')}${repeatText}</span></p>
    ${done ? `<p class="note good">${icon('check')} Done · ${fmtDuration(done.seconds)}${done.effort ? ' · effort ' + done.effort + '/10' : ''}${done.manual ? ' · marked manually' : ''}</p>` : ''}
    <ol class="plan-preview">${r.steps.map(b => `<li>${esc(blockSummary(b))}</li>`).join('')}</ol>
    <div class="modal-actions spread"><div class="row">
      <button class="btn danger" data-action="remove-event" data-id="${id}" data-date="${date}">${s.repeat ? 'Skip this day' : 'Remove'}</button>
      ${s.repeat ? `<button class="btn light" data-action="remove-series" data-id="${id}">Remove series</button>` : ''}
      <button class="btn light" data-action="reschedule" data-id="${id}" data-date="${date}">Move</button></div>
      <div class="row">${done ? '' : `<button class="btn light" data-action="mark-done" data-id="${id}" data-date="${date}">Mark as done</button>`}
      <button class="btn" data-action="start" data-id="${r.id}">Start session</button></div></div>`);
}

actions['remove-event'] = el => {
  const s = state.schedule.find(x => x.id === el.dataset.id);
  if (s.repeat) s.skip.push(el.dataset.date);
  else state.schedule = state.schedule.filter(x => x.id !== s.id);
  save(); closeModal(); render();
};
actions['remove-series'] = el => {
  state.schedule = state.schedule.filter(x => x.id !== el.dataset.id);
  save(); closeModal(); render(); toast('Series removed. Past history stays.');
};
actions.reschedule = el => {
  const s = state.schedule.find(x => x.id === el.dataset.id);
  showModal(modalHead('Move this session') + `<form id="move-form" data-id="${s.id}" data-old="${el.dataset.date}">
    <div class="form-grid"><div class="field"><label for="move-date">New date</label><input id="move-date" type="date" name="date" required value="${el.dataset.date}"></div>
    <div class="field"><label for="move-time">Time</label><input id="move-time" type="time" name="time" value="${esc(s.time)}"></div></div>
    <p class="muted small">${s.repeat ? 'Only this occurrence moves; the weekly series stays as it is.' : ''}</p>
    <div class="modal-actions"><button type="button" class="btn light" data-action="close">Cancel</button><button class="btn">Move session</button></div></form>`);
};
forms['move-form'] = (f, fd) => {
  const s = state.schedule.find(x => x.id === f.dataset.id);
  if (!isValidDateKey(fd.get('date'))) { toast('Choose a date.'); return; }
  if (s.repeat) {
    s.skip.push(f.dataset.old);
    state.schedule.push({ ...s, id: uid(), date: fd.get('date'), time: fd.get('time') || '', repeat: false, skip: [], until: '' });
  } else { s.date = fd.get('date'); s.time = fd.get('time') || ''; }
  save(); closeModal(); render(); toast('Session moved.');
};

// ---------------------------------------------------- marking as done ----

actions['mark-done'] = el => {
  const s = state.schedule.find(x => x.id === el.dataset.id), r = routine(s.routineId);
  showModal(modalHead('Mark as done', esc(r.name)) + `<form id="done-form" data-routine="${r.id}" data-date="${el.dataset.date}" data-time="${esc(s.time)}">
    <p class="muted">For when you did it without the player. It counts toward your week and progress.</p>
    <div class="form-grid"><div class="field"><label for="done-min">Duration (minutes)</label><input id="done-min" name="minutes" type="number" min="1" max="1440" required value="${duration(r) === '?' ? 30 : duration(r)}"></div>
    <div class="field"><label>Effort (optional)</label>${effortPicker()}</div></div>
    <div class="field"><label for="done-note">Note (optional)</label><textarea id="done-note" name="note" maxlength="2000" placeholder="How did it go?"></textarea></div>
    <div class="modal-actions"><button type="button" class="btn light" data-action="close">Cancel</button><button class="btn">Save</button></div></form>`);
};
forms['done-form'] = (f, fd) => {
  const r = routine(f.dataset.routine), date = f.dataset.date;
  const at = date === todayKey() ? new Date() : new Date(`${date}T${f.dataset.time || '12:00'}:00`);
  addHistory({ id: uid(), type: 'session', manual: true, name: r.name, routineId: r.id, category: r.category, at: at.toISOString(),
    seconds: Number(fd.get('minutes')) * 60, skipped: 0, steps: [], effort: readEffort(fd), note: fd.get('note').trim() });
  closeModal(); render(); toast('Marked as done.');
};

/** 1–10 effort chips used by several forms. */
function effortPicker(current) {
  return `<div class="effort" role="radiogroup" aria-label="Effort from 1 (very easy) to 10 (max)">${Array.from({ length: 10 }, (_, i) => i + 1)
    .map(n => `<label><input type="radio" name="effort" value="${n}" ${current === n ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div>
    <small class="muted">1 = very easy · 10 = everything you had</small>`;
}
function readEffort(fd) { const n = Number(fd.get('effort')); return n >= 1 && n <= 10 ? n : undefined; }

/** Insert into history keeping it sorted by time. */
function addHistory(entry) {
  state.history.push(entry);
  state.history.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  save();
}

</script>
<script>/* js/views/routines.js */
// Routines: the list, templates, the routine editor and the exercise picker.
'use strict';

let templateFilter = 'All';
const chipHandlers = {};
actions.chip = el => chipHandlers[el.dataset.chip]?.(el.dataset.value, el);

function routineCard(r, template = false) {
  const moves = routineMoves(r);
  const last = template ? 0 : lastDoneTime(r);
  const buttons = template
    ? `<button class="btn light" data-action="use-template" data-id="${r.id}">Make it mine ＋</button>
       <button class="text-btn" data-action="preview-template" data-id="${r.id}">Preview</button>`
    : `<button class="btn" data-action="start" data-id="${r.id}">Start</button>
       <button class="btn light" data-action="edit-routine" data-id="${r.id}">Edit</button>
       <button class="text-btn" data-action="schedule-routine" data-id="${r.id}">Schedule</button>
       <button class="text-btn" data-action="duplicate-routine" data-id="${r.id}">Duplicate</button>`;
  return `<article class="card">
    <div class="card-band cat-${catClass(r.category)}"><span class="category">${esc(r.category)}</span><span class="activity-symbol" aria-hidden="true">${catIcon(r.category)}</span></div>
    <div class="card-content">
      <span class="muted small">${plural(moves.length, 'exercise')} · about ${duration(r)} min${last ? ' · last done ' + shortDate(new Date(last)) : ''}</span>
      <h3>${esc(r.name)}</h3>
      <p class="muted">${esc(r.description || 'Your own combination of movement and rest.')}</p>
      <div class="row card-actions">${buttons}</div>
    </div></article>`;
}

renderers.routines = () => {
  const cats = ['All', ...CATEGORIES.filter(c => TEMPLATES.some(t => t.category === c))];
  const shown = TEMPLATES.filter(t => templateFilter === 'All' || t.category === templateFilter);
  app().innerHTML = heading('Made for your rhythm.', 'Mix any activities into one routine. Every step is yours to change.',
    `<button class="btn" data-action="new-routine">${icon('plus')} New routine</button>`)
    + (state.routines.length
      ? `<section class="cards">${state.routines.map(r => routineCard(r)).join('')}</section>`
      : emptyState('Your routines will live here', 'Start from scratch or make one of the templates below your own.', '<button class="btn" data-action="new-routine">Create your first routine</button>'))
    + `<div class="section-head"><h2>Templates</h2><span class="pill">Fully editable</span></div>
      <p class="muted">Starting points for gym days, conditioning, running, mobility and calm. Adapt weights, reps and timing to you.</p>
      ${chips('template-filter', cats, templateFilter)}
      <section class="cards">${shown.map(t => routineCard(t, true)).join('')}</section>`;
};
chipHandlers['template-filter'] = v => { templateFilter = v; render(); };

actions['preview-template'] = el => {
  const t = TEMPLATES.find(x => x.id === el.dataset.id);
  showModal(modalHead(t.name, `${esc(t.category)} · about ${duration(t)} min · ${plural(countSets(t), 'set')}`)
    + `<p>${esc(t.description)}</p><ol class="plan-preview">${t.steps.map(b => `<li>${esc(blockSummary(b))}</li>`).join('')}</ol>
    <div class="modal-actions"><button class="btn light" data-action="start-template" data-id="${t.id}">Try it now</button>
    <button class="btn" data-action="use-template" data-id="${t.id}">Make it mine ＋</button></div>`);
};
actions['start-template'] = el => startSession(TEMPLATES.find(x => x.id === el.dataset.id));
actions['use-template'] = el => editRoutine(null, el.dataset.id);
actions['new-routine'] = () => editRoutine();
actions['edit-routine'] = el => editRoutine(el.dataset.id);
actions['duplicate-routine'] = el => {
  const r = routine(el.dataset.id);
  state.routines.push({ ...structuredClone(r), id: uid(), name: (r.name + ' (copy)').slice(0, 90), steps: freshIds(r.steps), nextNote: '' });
  save(); render(); toast('Routine duplicated.');
};
actions['delete-routine'] = el => {
  const r = routine(el.dataset.id);
  const plans = state.schedule.filter(s => s.routineId === r.id).length;
  confirmDialog({
    title: 'Delete this routine?', yes: 'Delete routine',
    body: `<p>“${esc(r.name)}”${plans ? ` and ${plural(plans, 'planned session')}` : ''} will be removed. Your history stays.</p>`,
    onYes: () => {
      state.routines = state.routines.filter(x => x.id !== r.id);
      state.schedule = state.schedule.filter(s => s.routineId !== r.id);
      draft = null; draftDirty = false;
      save(); render(); toast('Routine deleted.');
    },
    onNo: () => renderEditor(false),
  });
};

function freshIds(blocks) {
  return blocks.map(b => ({ ...structuredClone(b), id: uid(), ...(b.kind === 'group' ? { steps: freshIds(b.steps) } : {}) }));
}

// --------------------------------------------------------------- editor ----

let draft = null;
let draftDirty = false;
const editorOpen = new Set();   // block ids whose "More options" are expanded

function editRoutine(id, templateId) {
  if (id) draft = structuredClone(routine(id));
  else if (templateId) {
    const t = TEMPLATES.find(x => x.id === templateId);
    draft = { ...structuredClone(t), id: uid(), steps: freshIds(t.steps) };
  } else draft = { id: uid(), name: '', description: '', category: 'Strength', transition: 10, steps: [] };
  draft.steps = draft.steps.map(b => normalizeBlock(b));
  draft.transition ??= 10;
  draftDirty = !!templateId;
  editorOpen.clear();
  renderEditor(false);
}

function getBlock(path) {
  const parts = path.split('.').map(Number);
  let list = draft.steps;
  for (let i = 0; i < parts.length - 1; i++) list = list[parts[i]].steps;
  return { list, index: parts.at(-1), block: list[parts.at(-1)] };
}

function draftSummary() {
  try {
    const q = compileRoutine(draft);
    return `${plural(q.filter(x => x.kind === 'move').length, 'set')} · about ${Math.max(1, Math.round(sum(q, stepSeconds) / 60))} min`;
  } catch { return 'Check your steps'; }
}

function valueField(b) {
  if (b.mode === 'distance') {
    return `<label>Distance (${distanceUnit()})<input type="number" data-field="value" data-unit="distance" min="0.01" max="1000" step="0.01" required value="${fmtNum(mToDisplay(b.value), 2)}"></label>`;
  }
  const label = b.mode === 'reps' ? 'Reps' : b.mode === 'manual' ? 'Target sec' : 'Seconds';
  return `<label>${label}<input type="number" data-field="value" min="1" max="7200" step="1" required value="${b.value}"></label>`;
}

const GRIP = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>';

/** Grip to drag a step (or move it with the arrow keys), with its number. */
function dragHandle(path, i, label) {
  return `<button type="button" class="drag-handle" data-drag-handle data-path="${path}" aria-label="Move ${esc(label)}: drag, or use the arrow keys" title="Drag to reorder">${GRIP}</button>
    <span class="step-number">${i + 1}</span>`;
}

function toolButtons(path) {
  return `<div class="step-tools">
    <button type="button" class="tiny" data-action="block-copy" data-path="${path}" aria-label="Duplicate" title="Duplicate">⧉</button>
    <button type="button" class="tiny remove" data-action="block-remove" data-path="${path}" aria-label="Remove" title="Remove">×</button></div>`;
}

function blockHTML(b, path, i, length) {
  if (b.kind === 'rest') {
    return `<div class="step rest-block" data-path="${path}"><div class="step-head">${dragHandle(path, i, 'break')}
      <div class="step-title"><strong>Break</strong><small>Counts down, then carries on</small></div>${toolButtons(path)}</div>
      <div class="step-main"><label>Seconds<input type="number" data-field="value" min="1" max="3600" step="1" required value="${b.value}"></label></div></div>`;
  }
  if (b.kind === 'group') {
    return `<div class="step repeat-group" data-path="${path}"><div class="step-head">${dragHandle(path, i, b.name || 'repeat group')}
      <div class="step-title"><strong>Repeat group</strong><small>Circuits, supersets and intervals</small></div>${toolButtons(path)}</div>
      <div class="step-main"><label class="grow">Name (optional)<input data-field="name" maxlength="60" value="${esc(b.name)}" placeholder="e.g. Circuit A"></label>
        <label>Rounds<input type="number" data-field="rounds" min="1" max="50" step="1" required value="${b.rounds}"></label></div>
      <div class="blocks">${b.steps.map((x, j) => blockHTML(x, `${path}.${j}`, j, b.steps.length)).join('') || '<p class="muted small empty-group">Empty so far. Add exercises below, or drag steps in here.</p>'}</div>
      ${addControls(path)}</div>`;
  }
  const e = exercise(b.exerciseId);
  const weighted = b.mode !== 'distance' && b.mode !== 'manual' && (['Strength', 'HIIT'].includes(e?.category) || b.weight > 0);
  const both = b.side === 'Both sides';
  return `<div class="step" data-path="${path}"><div class="step-head">${dragHandle(path, i, e?.name || 'exercise')}
    <div class="step-title"><strong>${esc(e?.name || 'Unavailable exercise')}</strong><small>${esc(e?.category || '')}${both ? ' · each side' : ''}${b.section !== 'Main' && b.section !== e?.category ? ' · ' + esc(b.section) : ''}</small></div>
    ${toolButtons(path)}</div>
    <div class="step-main">
      <label>Sets<input type="number" data-field="sets" min="1" max="50" step="1" required value="${b.sets}"></label>
      <span class="times" aria-hidden="true">×</span>${valueField(b)}
      ${weighted ? `<label>Weight (${weightUnit()})<input type="number" data-field="weight" data-unit="weight" min="0" max="2000" step="0.5" value="${fmtNum(kgToDisplay(b.weight), 1)}"></label>` : ''}
