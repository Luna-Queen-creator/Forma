/* Forma — styles.
   Colours are tokens on :root so the dark theme only redefines them. */

/* ------------------------------------------------------------ tokens --- */
:root {
  color-scheme: light;
  --font: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Manrope', 'DM Sans', system-ui, sans-serif;

  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #f0f4f1;
  --surface-3: #e6ede8;
  --ink: #183d39;
  --ink-strong: #0f2f2b;
  --muted: #5e716c;
  --line: #dce4df;
  --line-strong: #c3d1c9;
  --accent: #123c39;
  --accent-ink: #ffffff;
  --lime: #d5f580;
  --lime-ink: #19392d;
  --focus: #2f7a63;
  --danger-bg: #fbe9e6;
  --danger: #963326;
  --good-bg: #e8f4e4;
  --good: #2c6e46;
  --warn-bg: #fdf1dc;
  --warn: #8a5a0b;
  --hero-bg: #123c39;
  --hero-ink: #ffffff;
  --hero-muted: #c5d8cd;
  --hero-line: #3b6358;
  --note-bg: #eef4ee;
  --note-ink: #4d665b;
  --shadow: 0 20px 70px rgba(9, 40, 32, .20);
  --backdrop: rgba(16, 43, 39, .45);

  --bm-base: #e5ece7; --bm-stroke: #b3c6bb; --bm-muscle: #c8d7ce;
  --bm-primary: #286d57; --bm-secondary: #a3c868; --bm-stretch: #5d88a3;

  /* Category tints (backgrounds) and dots (small identity marks). */
  --cat-strength: #e8efda;  --dot-strength: #5f8a2d;
  --cat-hiit: #fde4d3;      --dot-hiit: #d4692e;
  --cat-endurance: #ffe9ce; --dot-endurance: #c98a12;
  --cat-yoga: #ece7f6;      --dot-yoga: #7760b8;
  --cat-flexibility: #e1eef0; --dot-flexibility: #3f8a95;
  --cat-mobility: #dceef2;  --dot-mobility: #2f7ea1;
  --cat-warmup: #f6efd6;    --dot-warmup: #b0902a;
  --cat-balance: #f2e4f6;   --dot-balance: #a45bb4;
  --cat-meditation: #f7ead8; --dot-meditation: #b27a3a;
  --cat-advflex: #dff0ea;   --dot-advflex: #2e8a6a;
  --cat-sport: #e3ecf7;     --dot-sport: #3f6fb3;
  --cat-other: #eceff1;     --dot-other: #7b8a8f;

  /* Chart series (validated categorical order, light surface). */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --grid: #e7ece9;

  /* Brand roles that colour themes override. */
  --hero-accent: #d5f580; --hero-btn-bg: #d5f580; --hero-btn-ink: #19392d; --hero-item: rgba(255, 255, 255, .06);
  --mark-bg: #123c39; --mark-ink: #d5f580; --brand-dot: #8ba84a; --toast-bg: #153e32;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1614; --surface: #15201e; --surface-2: #1b2826; --surface-3: #23322f;
    --ink: #e2ebe7; --ink-strong: #f4f8f6; --muted: #9db1aa; --line: #26352f; --line-strong: #37493f;
    --accent: #cdef7a; --accent-ink: #10231f; --lime: #cdef7a; --lime-ink: #10231f; --focus: #9bd37a;
    --danger-bg: #3a1f1b; --danger: #f2a293; --good-bg: #1d3325; --good: #9fd8a9; --warn-bg: #3a2e17; --warn: #f0c877;
    --hero-bg: #17302b; --hero-ink: #f4f8f6; --hero-muted: #a9c3b8; --hero-line: #2f4d45;
    --note-bg: #1b2826; --note-ink: #adc2ba; --shadow: 0 20px 70px rgba(0, 0, 0, .55); --backdrop: rgba(0, 0, 0, .6);
    --bm-base: #22312d; --bm-stroke: #3d544b; --bm-muscle: #2f423c; --bm-primary: #7fcf9f; --bm-secondary: #c2e07a; --bm-stretch: #7fb3d6;
    --cat-strength: #25301d; --cat-hiit: #3a261a; --cat-endurance: #382b17; --cat-yoga: #2a2538; --cat-flexibility: #1e3134;
    --cat-mobility: #1c2e37; --cat-warmup: #332d18; --cat-balance: #33243a; --cat-meditation: #372b1e; --cat-advflex: #1b3129;
    --cat-sport: #1e2838; --cat-other: #262c2e;
    --dot-strength: #9cc56a; --dot-hiit: #f0925e; --dot-endurance: #e5b04b; --dot-yoga: #ab98e6; --dot-flexibility: #6fbfca;
    --dot-mobility: #67b2d6; --dot-warmup: #d8bd61; --dot-balance: #cf8fdd; --dot-meditation: #d9a468; --dot-advflex: #5fc39c;
    --dot-sport: #7ea6e3; --dot-other: #9aa9ae;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --grid: #22302c;
    --hero-accent: #cdef7a; --hero-btn-bg: #cdef7a; --hero-btn-ink: #10231f; --hero-item: rgba(255, 255, 255, .06);
    --mark-bg: #123c39; --mark-ink: #d5f580; --brand-dot: #8ba84a; --toast-bg: #2b4a43;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1614; --surface: #15201e; --surface-2: #1b2826; --surface-3: #23322f;
  --ink: #e2ebe7; --ink-strong: #f4f8f6; --muted: #9db1aa; --line: #26352f; --line-strong: #37493f;
  --accent: #cdef7a; --accent-ink: #10231f; --lime: #cdef7a; --lime-ink: #10231f; --focus: #9bd37a;
  --danger-bg: #3a1f1b; --danger: #f2a293; --good-bg: #1d3325; --good: #9fd8a9; --warn-bg: #3a2e17; --warn: #f0c877;
  --hero-bg: #17302b; --hero-ink: #f4f8f6; --hero-muted: #a9c3b8; --hero-line: #2f4d45;
  --note-bg: #1b2826; --note-ink: #adc2ba; --shadow: 0 20px 70px rgba(0, 0, 0, .55); --backdrop: rgba(0, 0, 0, .6);
  --bm-base: #22312d; --bm-stroke: #3d544b; --bm-muscle: #2f423c; --bm-primary: #7fcf9f; --bm-secondary: #c2e07a; --bm-stretch: #7fb3d6;
  --cat-strength: #25301d; --cat-hiit: #3a261a; --cat-endurance: #382b17; --cat-yoga: #2a2538; --cat-flexibility: #1e3134;
  --cat-mobility: #1c2e37; --cat-warmup: #332d18; --cat-balance: #33243a; --cat-meditation: #372b1e; --cat-advflex: #1b3129;
  --cat-sport: #1e2838; --cat-other: #262c2e;
  --dot-strength: #9cc56a; --dot-hiit: #f0925e; --dot-endurance: #e5b04b; --dot-yoga: #ab98e6; --dot-flexibility: #6fbfca;
  --dot-mobility: #67b2d6; --dot-warmup: #d8bd61; --dot-balance: #cf8fdd; --dot-meditation: #d9a468; --dot-advflex: #5fc39c;
  --dot-sport: #7ea6e3; --dot-other: #9aa9ae;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --grid: #22302c;
  --hero-accent: #cdef7a; --hero-btn-bg: #cdef7a; --hero-btn-ink: #10231f; --hero-item: rgba(255, 255, 255, .06);
  --mark-bg: #123c39; --mark-ink: #d5f580; --brand-dot: #8ba84a; --toast-bg: #2b4a43;
}

/* -------------------------------------------------------------- base --- */
*, *::before, *::after { box-sizing: border-box; }
html { font-family: var(--font); color: var(--ink); background: var(--bg); font-synthesis: none; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .4; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
a { color: inherit; }
h1, h2, h3, p { margin-top: 0; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink-strong); }
h1 { font-size: clamp(1.9rem, 3.6vw, 2.8rem); line-height: 1.15; letter-spacing: -.03em; margin-bottom: 8px; }
h2 { font-size: 1.3rem; letter-spacing: -.01em; }
h3 { font-size: 1.05rem; }
p { line-height: 1.6; }
table { border-collapse: collapse; width: 100%; }
fieldset { border: 0; padding: 0; margin: 0 0 17px; min-width: 0; }
legend { font-size: 14px; font-weight: 600; margin-bottom: 8px; padding: 0; }
.icon { width: 20px; height: 20px; flex-shrink: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; line-height: 1.5; }
.center { text-align: center; justify-content: center; }
.warning { color: var(--danger); }

/* ----------------------------------------------------------- layout --- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 232px; z-index: 3;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 32px 20px; display: flex; flex-direction: column; overflow-y: auto;
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 32px; letter-spacing: -.06em; text-decoration: none; display: flex; align-items: center; gap: 10px; color: var(--ink-strong); }
.mark { display: inline-grid; place-items: center; background: var(--mark-bg); color: var(--mark-ink); border-radius: 11px; width: 38px; height: 40px; font-size: 34px; font-style: italic; padding-right: 4px; letter-spacing: 0; }
.brand-dot { color: var(--brand-dot); margin-left: -10px; }
.eyebrow { font-size: 11px; letter-spacing: .18em; margin: 16px 0 30px; color: var(--muted); }
nav { display: grid; gap: 4px; }
nav button { display: flex; align-items: center; gap: 13px; text-align: left; border-radius: 10px; padding: 11px 14px; font-size: 15px; font-weight: 500; color: var(--ink); }
nav button:hover { background: var(--surface-2); }
nav button.active { background: var(--surface-3); color: var(--ink-strong); font-weight: 600; }
.side-bottom { margin-top: auto; padding-top: 30px; }
.side-bottom p { font-size: 13px; color: var(--muted); margin: 8px 0; }
.save-badge { font-size: 13px; font-weight: 700; }
.save-badge.bad, [data-save-status].bad { color: var(--danger); }

main { margin-left: 232px; padding: 0 44px; max-width: 1640px; }
.topbar { height: 76px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; letter-spacing: .12em; color: var(--muted); }
#app { padding: 34px 0 20px; min-height: 78vh; }
footer { border-top: 1px solid var(--line); padding: 22px 0 30px; margin-top: 30px; color: var(--muted); font-size: 12px; }

/* ------------------------------------------------------- components --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 10px 18px; border-radius: 9px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap;
}
.btn:hover { filter: brightness(1.1); }
.btn .icon { width: 17px; height: 17px; }
.btn.light { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }
.btn.light:hover { background: var(--surface-2); filter: none; }
.btn.lime { background: var(--lime); color: var(--lime-ink); }
.btn.danger { background: var(--danger-bg); color: var(--danger); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.btn.on-dark { background: transparent; color: var(--hero-ink); border: 1px solid var(--hero-line); }
.btn.on-dark:hover { background: var(--hero-item); }
.hero .btn.lime { background: var(--hero-btn-bg); color: var(--hero-btn-ink); }
.text-btn { padding: 6px 2px; font-size: 14px; font-weight: 500; text-align: left; }
.text-btn:hover, .link:hover { text-decoration: underline; }
.link { padding: 0; text-decoration: underline; font-size: inherit; }
.icon-btn { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; width: 42px; height: 42px; font-size: 20px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: grid; gap: 10px; justify-items: start; margin: 12px 0; }
.pill { display: inline-block; border: 1px solid var(--line); padding: 3px 9px; border-radius: 20px; font-size: 12px; color: var(--muted); background: var(--surface); white-space: nowrap; }
.pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.category { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.label { font-size: 13px; font-weight: 600; margin: 16px 0 8px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 20px; padding: 7px 13px; font-size: 13px; font-weight: 500; }
.chip:hover { background: var(--surface-2); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.note { background: var(--note-bg); color: var(--note-ink); padding: 12px 16px; border-radius: 9px; font-size: 13px; margin: 16px 0; }
.note.warning { background: var(--danger-bg); color: var(--danger); }
.note.good { background: var(--good-bg); color: var(--good); }
.note.good .icon { width: 16px; height: 16px; vertical-align: -3px; }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.empty { padding: 34px 20px; text-align: center; border: 1px dashed var(--line-strong); border-radius: 13px; margin: 18px 0; }
.empty h3 { margin-bottom: 6px; }
.heading { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
.heading p { margin: 0; }
.heading-actions { display: flex; gap: 10px; flex-shrink: 0; }
.section-head { margin: 34px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.section-head.first { margin-top: 0; }
.section-head h2, .section-head h3 { margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 18px; min-width: 0; }
.panel h2 { margin-bottom: 8px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--dot-other); }

/* Category tints for bands and calendar events; dots use the stronger shade. */
.cat-strength { --tint: var(--cat-strength); --dotc: var(--dot-strength); }
.cat-hiit { --tint: var(--cat-hiit); --dotc: var(--dot-hiit); }
.cat-endurance { --tint: var(--cat-endurance); --dotc: var(--dot-endurance); }
.cat-yoga { --tint: var(--cat-yoga); --dotc: var(--dot-yoga); }
.cat-flexibility { --tint: var(--cat-flexibility); --dotc: var(--dot-flexibility); }
.cat-mobility { --tint: var(--cat-mobility); --dotc: var(--dot-mobility); }
.cat-warmup { --tint: var(--cat-warmup); --dotc: var(--dot-warmup); }
.cat-balance { --tint: var(--cat-balance); --dotc: var(--dot-balance); }
.cat-meditation { --tint: var(--cat-meditation); --dotc: var(--dot-meditation); }
.cat-advflex { --tint: var(--cat-advflex); --dotc: var(--dot-advflex); }
.cat-sport { --tint: var(--cat-sport); --dotc: var(--dot-sport); }
.cat-other { --tint: var(--cat-other); --dotc: var(--dot-other); }
.dot[class*="cat-"] { background: var(--dotc); }

/* ------------------------------------------------------------ forms --- */
input, select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px;
}
input[type="checkbox"], input[type="radio"] { width: auto; min-height: 0; accent-color: var(--focus); }
textarea { resize: vertical; min-height: 88px; }
label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.field { margin-bottom: 16px; }
.field small, .field > .muted { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid.wide-first { grid-template-columns: 2fr 1fr; }
.form-grid .field { margin-bottom: 14px; }
.checkrow { display: flex; align-items: center; gap: 9px; font-size: 14px; margin: 10px 0; }
.checkrow input { width: 18px; height: 18px; }
.checks { display: flex; gap: 6px 16px; flex-wrap: wrap; }
.checks .checkrow { margin: 4px 0; }
.effort { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 4px; }
.effort label { margin: 0; }
.effort input { position: absolute; opacity: 0; pointer-events: none; }
.effort span { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line-strong); font-size: 14px; cursor: pointer; background: var(--surface); }
.effort input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.effort input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.weekday-picker { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.weekday { margin: 0; }
.weekday input { position: absolute; opacity: 0; pointer-events: none; }
.weekday span { display: grid; place-items: center; min-width: 46px; height: 38px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line-strong); font-size: 13px; cursor: pointer; }
.weekday input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.weekday input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.segmented { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; gap: 3px; }
.seg-option { margin: 0; }
.seg-option input { position: absolute; opacity: 0; pointer-events: none; }
.seg-option span { display: block; padding: 7px 13px; border-radius: 7px; font-size: 13px; cursor: pointer; }
.seg-option input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg-option input:focus-visible + span { outline: 2px solid var(--focus); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); margin: 0; font-weight: 400; }
.toggle-row strong { display: block; font-weight: 600; font-size: 14px; }
.toggle-row small { color: var(--muted); font-size: 12px; }
.switch { appearance: none; -webkit-appearance: none; width: 44px !important; height: 26px; min-height: 26px; border-radius: 13px; background: var(--line-strong); position: relative; cursor: pointer; border: 0; padding: 0; flex-shrink: 0; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch:checked { background: var(--focus); }
.switch:checked::after { transform: translateX(18px); }
.inline-field { margin-top: 16px; }
.inline-field input { max-width: 140px; }
.gear-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.gear-chip { margin: 0; }
.gear-chip input { position: absolute; opacity: 0; pointer-events: none; }
.gear-chip span { display: block; padding: 8px 13px; border: 1px solid var(--line-strong); border-radius: 20px; font-size: 13px; cursor: pointer; }
.gear-chip input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gear-chip input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------------------------------------------------------- dialogs --- */
dialog {
  border: 1px solid var(--line); border-radius: 17px; padding: 0;
  width: min(720px, calc(100% - 24px)); max-height: 92dvh; overflow-y: auto;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
dialog.wide { width: min(900px, calc(100% - 24px)); }
dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(3px); }
#picker { width: min(620px, calc(100% - 24px)); }
.modal-inner { padding: 26px; }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 15px; }
.modal-header h2 { margin: 0 0 2px; }
.modal-header p { margin: 0; }
.close { background: var(--surface-2); border-radius: 50%; width: 36px; height: 36px; flex-shrink: 0; font-size: 22px; line-height: 1; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.modal-actions.spread { justify-content: space-between; }

/* -------------------------------------------------------------- week --- */
.hero { background: var(--hero-bg); color: var(--hero-ink); border-radius: 18px; padding: 26px 30px; display: grid; grid-template-columns: 1fr auto; gap: 24px; margin-bottom: 30px; align-items: center; }
.hero h2 { color: var(--hero-ink); font-size: 25px; margin: 6px 0 14px; }
.hero .eyebrow { color: var(--hero-accent); margin: 0; }
.hero-sub { color: var(--hero-muted); margin-bottom: 16px; max-width: 520px; }
.today-list { display: grid; gap: 8px; margin-bottom: 16px; max-width: 640px; }
.today-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--hero-item); border: 1px solid var(--hero-line); border-radius: 11px; padding: 10px 10px 10px 16px; }
.today-item strong { display: block; }
.today-item small { color: var(--hero-muted); }
.today-item.done strong { opacity: .85; }
.done-badge { display: inline-flex; align-items: center; gap: 5px; color: var(--hero-accent); font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 8px; }
.done-badge .icon { width: 16px; height: 16px; }
.done-badge:hover { background: var(--hero-item); }
.hero-actions { gap: 8px; }
.hero-ring { position: relative; width: 150px; height: 150px; margin: 0 8px; }
.hero-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--hero-line); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--hero-accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .4s; }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-label strong { font-family: var(--font-display); font-size: 34px; color: var(--hero-accent); line-height: 1.1; }
.ring-label span { font-size: 11px; color: var(--hero-muted); line-height: 1.35; }
.week-controls { margin: 0 0 16px; }
.week-controls h2 { margin: 0; }
.calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-height: 180px; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; }
.day.past { background: var(--surface-2); }
.day.today { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); background: var(--surface); }
.day-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.day-label strong { font-size: 17px; color: var(--ink-strong); }
.day.today .day-label strong { background: var(--accent); color: var(--accent-ink); border-radius: 50%; width: 28px; height: 28px; text-align: center; line-height: 28px; font-size: 15px; }
.event { width: 100%; text-align: left; padding: 8px 8px; background: var(--tint, var(--cat-other)); border-radius: 8px; line-height: 1.3; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; border-left: 3px solid var(--dotc, var(--dot-other)); }
.event small { display: block; margin-top: 3px; font-size: 11px; font-weight: 400; color: var(--muted); }
.event.done { opacity: .78; }
.event.logged { background: transparent; border: 1px dashed var(--line-strong); border-left: 3px solid var(--dotc, var(--dot-other)); }
.event-check { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; color: var(--good); stroke-width: 2.6; }
.add-day { margin-top: auto; color: var(--muted); width: 100%; padding: 6px 0; border: 1px dashed var(--line); border-radius: 7px; font-size: 16px; }
.add-day:hover { background: var(--surface-2); color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; display: flex; flex-direction: column; }
.card-band { padding: 16px 20px; background: var(--tint, var(--cat-other)); display: flex; align-items: center; justify-content: space-between; }
.activity-symbol { font-size: 22px; line-height: 1; }
.card-content { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; }
.card h3 { margin: 6px 0 6px; }
.card p { font-size: 14px; }
.card-actions { margin-top: auto; }
.plan-preview { padding-left: 22px; margin: 14px 0; font-size: 14px; line-height: 1.8; }

/* ----------------------------------------------------------- editor --- */
.blocks { display: grid; gap: 10px; margin: 10px 0; }
.step { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.step-number { background: var(--surface-3); border-radius: 50%; height: 26px; width: 26px; text-align: center; line-height: 26px; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.step-title { flex: 1; min-width: 0; }
.step-title strong { display: block; overflow-wrap: anywhere; }
.step-title small { color: var(--muted); font-size: 12px; }
.step-tools { display: flex; gap: 4px; flex-shrink: 0; }
.tiny { background: var(--surface-2); border-radius: 7px; min-width: 32px; height: 32px; font-size: 14px; }
.tiny:hover:not(:disabled) { background: var(--surface-3); }
.tiny.remove { color: var(--danger); background: var(--danger-bg); }
.step-main { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.step-main label { font-size: 12px; color: var(--muted); margin: 0; width: 104px; }
.step-main label.grow { flex: 1; min-width: 150px; }
.step-main input, .step-fields input, .step-fields select { margin-top: 4px; min-height: 40px; padding: 7px 10px; font-size: 15px; color: var(--ink); }
.times { padding-bottom: 10px; color: var(--muted); }
details.more { margin-top: 10px; }
details.more summary, .how-to summary, .table-view summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); padding: 4px 0; width: fit-content; }
details.more[open] summary { margin-bottom: 8px; }
.step-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.step-fields label { font-size: 12px; color: var(--muted); margin: 0; }
.note-field { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.note-field input { margin-top: 4px; min-height: 40px; }
.rest-block { background: var(--surface-2); }
.repeat-group { background: color-mix(in srgb, var(--lime) 22%, var(--surface)); border-color: var(--line-strong); }
.repeat-group > .blocks > .step { background: var(--surface); }
.block-add { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.empty-seq { padding: 18px; border: 1px dashed var(--line-strong); border-radius: 12px; text-align: center; }
.routine-settings { margin: 0 0 8px; }

/* ----------------------------------------------------------- picker --- */
#picker-search { margin-bottom: 4px; }
.pick-list { display: grid; gap: 4px; max-height: 52dvh; overflow-y: auto; margin: 10px -6px; padding: 0 6px; }
.pick-row { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; width: 100%; }
.pick-row:hover { background: var(--surface-2); border-color: var(--line); }
.pick-text { flex: 1; min-width: 0; }
.pick-text strong { display: block; font-size: 14px; }
.pick-text small { color: var(--muted); font-size: 12px; }
.pick-add { font-size: 18px; color: var(--muted); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); }
.pick-row.added .pick-add { animation: added .7s; }
@keyframes added { 0% { background: var(--lime); color: var(--lime-ink); transform: scale(1.25); } 100% { background: var(--surface-2); transform: none; } }
.picker-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------------------------------------------------------- library --- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
.toolbar input[type="search"] { flex: 1; min-width: 180px; }
.toolbar select { width: auto; min-width: 150px; }
.toolbar .checkrow { margin: 0 6px; }
.exercise-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.exercise-card { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: left; display: flex; gap: 14px; align-items: center; }
.exercise-card:hover { border-color: var(--line-strong); background: var(--surface-2); }
.exercise-card h3 { margin: 3px 0; font-size: 15px; }
.exercise-card p { font-size: 12px; margin: 0; color: var(--muted); line-height: 1.45; }
.exercise-card .category { font-size: 10px; }
.gear-line { margin-top: 3px !important; }
.logged-mark { color: var(--good); font-weight: 600; }
.bodymap { width: 64px; height: 96px; flex-shrink: 0; }
.bodymap.large { width: 150px; height: 225px; }
.bodymap.session-map { width: 110px; height: 150px; display: block; margin: 12px auto 4px; }
.bodymap .base { fill: var(--bm-base); stroke: var(--bm-stroke); stroke-width: 1; }
.bodymap .muscle { fill: var(--bm-muscle); }
.bodymap .primary { fill: var(--bm-primary); }
.bodymap .secondary { fill: var(--bm-secondary); }
.bodymap .stretch { fill: var(--bm-stretch); }
.bodymap text { font: 8px sans-serif; fill: var(--muted); }
.legend { font-size: 12px; display: flex; gap: 14px; justify-content: center; margin-top: 8px; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--bm-primary); }
.swatch.secondary { background: var(--bm-secondary); }
.swatch.stretch { background: var(--bm-stretch); }
.detail-grid { display: grid; grid-template-columns: 190px 1fr; gap: 24px; }
.detail-grid h3 { margin: 16px 0 4px; }
.anatomy { text-align: center; background: var(--surface-2); padding: 14px; border-radius: 12px; align-self: start; }
.instructions { line-height: 1.65; padding-left: 20px; font-size: 15px; }
.instructions li { margin-bottom: 8px; }
.illustration { max-width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; }
.your-history { margin-top: 18px; padding: 16px; background: var(--surface-2); border-radius: 12px; }
.your-history h3 { margin-bottom: 4px; }
.sparkline { display: block; margin: 8px 0; max-width: 100%; }
.sparkline path { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sparkline circle { fill: var(--s1); stroke: var(--surface-2); stroke-width: 2; }
.history-mini { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.history-mini li { display: flex; gap: 14px; padding: 5px 0; border-top: 1px solid var(--line); }
.history-mini li span:first-child { color: var(--muted); width: 64px; flex-shrink: 0; }
.related-title { margin-top: 20px; }

/* ------------------------------------------------------ quick start --- */
.quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.quick-grid .panel { margin: 0; }
.quick-grid .panel .category { color: var(--muted); }
.quick-grid .panel h2 { margin: 6px 0 4px; }
.recent-list { display: grid; gap: 8px; margin-bottom: 26px; }
.recent-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 16px; }
.recent-item > div { flex: 1; min-width: 0; }
.recent-item strong { display: block; }
.recent-item small { color: var(--muted); }

/* --------------------------------------------------------- progress --- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.stats.compact { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
.stat-label { font-size: 13px; color: var(--muted); }
.stat-value { font-family: var(--font); font-size: 32px; font-weight: 600; color: var(--ink-strong); line-height: 1.2; }
.small-stat .stat-value { font-size: 22px; }
.stat-sub { font-size: 12px; color: var(--muted); }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 10px; font-size: 13px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.key.s1, .seg.s1 { background: var(--s1); fill: var(--s1); }
.key.s2, .seg.s2 { background: var(--s2); fill: var(--s2); }
.key.s3, .seg.s3 { background: var(--s3); fill: var(--s3); }
.key.s4, .seg.s4 { background: var(--s4); fill: var(--s4); }
.key.s5, .seg.s5 { background: var(--s5); fill: var(--s5); }
.chart-wrap { position: relative; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--line-strong); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .bar-value { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--font); }
.chart .hit { fill: transparent; }
.chart .col { cursor: default; outline: none; }
.chart .col .seg { transition: opacity .15s; }
.chart .col.dim .seg { opacity: .35; }
.chart .col:focus-visible .hit { stroke: var(--focus); stroke-width: 2; }
.chart-tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 12px; font-size: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .12); pointer-events: none; display: grid; gap: 2px; min-width: 160px; z-index: 2; }
.chart-tip[hidden] { display: none; }
.chart-tip span { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.table-view { margin-top: 10px; }
.table-scroll { overflow-x: auto; }
.table-view table, table.records, table.sets { font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td small { display: block; font-size: 12px; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
.history-section { margin-top: 10px; }
.month { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; font-family: var(--font); }
.history-list { display: grid; gap: 6px; margin-bottom: 14px; }
.history-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); padding: 13px 16px; border-radius: 11px; text-align: left; width: 100%; }
.history-row:hover { background: var(--surface-2); }
.history-main { flex: 1; min-width: 0; }
.history-main strong { display: block; }
.history-main small { color: var(--muted); font-size: 12px; }
.history-kind { font-size: 12px; color: var(--muted); white-space: nowrap; }
.entry-note { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; }

/* --------------------------------------------------------- settings --- */
.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.settings-grid .panel { margin: 0; }
.span-2 { grid-column: span 2; }

/* ----------------------------------------------------------- player --- */
.session { max-width: 720px; margin: 0 auto; text-align: center; }
.session-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.progress { height: 5px; background: var(--surface-3); border-radius: 5px; margin: 12px 0 18px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--focus); transition: width .25s; }
.session-name { color: var(--muted); margin-bottom: 12px; }
.session-card { padding: 24px 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.session-card.is-pause { background: var(--surface-2); }
.session-title { font-size: clamp(1.6rem, 4vw, 2.1rem); margin: 10px 0 4px; }
.side-label { font-size: 19px; font-weight: 700; color: var(--good); margin: 0; }
.timer { font-family: var(--font-display); font-weight: 600; font-size: clamp(4rem, 13vw, 6.2rem); letter-spacing: -.04em; margin: 4px 0; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink-strong); }
.step-bar { height: 4px; background: var(--surface-3); border-radius: 4px; max-width: 280px; margin: 0 auto 14px; overflow: hidden; }
.step-bar span { display: block; height: 100%; background: var(--lime); border-radius: 4px; }
.is-pause .step-bar span { background: var(--focus); }
.big-target { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin: 8px 0 0; }
.big-target strong { font-family: var(--font-display); font-size: clamp(4rem, 12vw, 5.6rem); line-height: 1; color: var(--ink-strong); letter-spacing: -.04em; }
.big-target span { font-size: 18px; color: var(--muted); }
.set-clock { margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
.target-line { margin: 10px 0 0; color: var(--muted); font-weight: 600; }
.log-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 6px 0 16px; }
.log-field { display: grid; gap: 6px; justify-items: center; }
.log-field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 11px; overflow: hidden; background: var(--surface); }
.stepper button { width: 46px; font-size: 22px; background: var(--surface-2); }
.stepper button:hover { background: var(--surface-3); }
.stepper input { width: 86px; border: 0; border-radius: 0; text-align: center; font-size: 20px; font-weight: 600; min-height: 50px; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.step-note { font-style: italic; color: var(--muted); }
.player-controls { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 6px; }
.player-controls .btn { min-height: 52px; padding: 12px 22px; font-size: 16px; }
.round-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); font-size: 26px; line-height: 1; color: var(--ink); }
.round-btn:hover:not(:disabled) { background: var(--surface-3); }
.main-toggle { min-width: 110px; }
.last-time { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.last-time strong { color: var(--ink); }
.how-to { text-align: left; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
.how-to .instructions { margin: 10px 0 0; }
.up-next { margin-bottom: 0; }
.session-help { margin-top: 14px; }
.breath { width: 160px; height: 160px; background: var(--good-bg); border: 18px solid var(--surface-2); border-radius: 50%; margin: 20px auto; display: grid; place-content: center; color: var(--good); font-weight: 600; padding: 10px; }
.breath.running { animation: breathe 10s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.1); } }
.prepare-next { display: grid; gap: 4px; justify-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 18px auto; max-width: 320px; }
.prepare-next strong { font-size: 19px; }
.pacer { position: relative; width: 220px; height: 220px; margin: 16px auto 6px; display: grid; place-items: center; }
.pacer::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px dashed var(--line-strong); }
.pacer-circle { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, var(--lime), var(--bm-secondary)); opacity: .85; transform: scale(.5); transition: transform .25s linear; }
.pacer-text { position: relative; display: grid; gap: 2px; color: var(--lime-ink); }
.pacer-text strong { font-size: 18px; }
.pacer-text span { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 1em; }
body.in-session .topbar .btn { display: none; }

/* ------------------------------------------------------------ toast --- */
#toast { position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 12px 20px; border-radius: 10px; background: var(--toast-bg); color: #fff; box-shadow: 0 6px 30px rgba(0, 0, 0, .2); z-index: 20; max-width: min(90%, 480px); font-size: 14px; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ------------------------------------------------------- responsive --- */
@media (min-width: 1500px) { main { padding: 0 60px; } }
@media (max-width: 1180px) {
  .sidebar { width: 200px; padding: 26px 14px; }
  main { margin-left: 200px; padding: 0 26px; }
  .calendar { gap: 5px; }
  .day { padding: 8px 6px; }
  .exercise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .sidebar { width: 72px; padding: 22px 10px; align-items: center; }
  .brand-word, .brand-dot, .sidebar .eyebrow, .sidebar nav span, .side-bottom { display: none; }
  .sidebar nav { margin-top: 30px; }
  .sidebar nav button { padding: 12px; justify-content: center; }
  main { margin-left: 72px; padding: 0 20px; }
  .calendar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quick-grid, .settings-grid { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .hero-ring { width: 120px; height: 120px; margin: 0; }
  .ring-label strong { font-size: 28px; }
}
@media (max-width: 640px) {
  .sidebar {
    inset: auto 0 0; width: 100%; height: calc(64px + env(safe-area-inset-bottom)); padding: 4px 4px env(safe-area-inset-bottom);
    border-top: 1px solid var(--line); border-right: 0; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px);
    flex-direction: row; overflow: visible;
  }
  .brand { display: none; }
  .sidebar nav { display: flex; justify-content: space-around; margin: 0; gap: 0; width: 100%; }
  .sidebar nav button { flex-direction: column; gap: 3px; padding: 7px 2px; border-radius: 8px; flex: 1; min-width: 0; }
  .sidebar nav span { display: block; font-size: 10px; white-space: nowrap; }
  body.in-session .sidebar { display: none; }
  main { margin: 0; padding: 0 16px calc(76px + env(safe-area-inset-bottom)); }
  body.in-session main { padding-bottom: 24px; }
  .topbar { height: 58px; font-size: 11px; }
  #app { padding-top: 22px; }
  .heading { flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .heading h1 { font-size: 29px; }
  .heading p { font-size: 14px; }
  .hero { padding: 22px 18px; grid-template-columns: 1fr; gap: 6px; }
  .hero h2 { font-size: 22px; }
  .hero-ring { display: none; }
  .calendar { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .day { min-height: 120px; }
  .day:last-child { grid-column: span 2; min-height: 90px; }
  .event { font-size: 13px; }
  .cards, .exercise-grid, .stats { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat-value { font-size: 26px; }
  .section-head { align-items: baseline; }
  .section-head h2 { font-size: 19px; }
  .modal-inner { padding: 18px 16px; }
  dialog, dialog.wide, #picker { width: calc(100% - 16px); max-height: 94dvh; }
  .detail-grid { grid-template-columns: 1fr; }
  .anatomy .bodymap.large { width: 100px; height: 150px; }
  .form-grid, .form-grid.three, .form-grid.wide-first { grid-template-columns: 1fr; gap: 0; }
  .step-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .step { padding: 11px; }
  .step-main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .step-main label { width: auto; }
  .step-main label.grow { grid-column: span 2; }
  .step-main .times { display: none; }
  .tiny { min-width: 30px; height: 30px; }
  .repeat-group { padding: 10px; }
  .toolbar select { flex: 1; min-width: 130px; }
  .session-card { padding: 18px 14px; }
  /* One row on phones: back · begin/pause · done · skip; "+10 s" drops to its own row. */
  .player-controls { display: grid; grid-template-columns: 42px 1fr 1.3fr 42px; gap: 7px; }
  .player-controls .btn { padding: 12px 6px; font-size: 15px; min-width: 0; }
  .player-controls [data-action="add-time"] { grid-row: 2; grid-column: 2 / 4; min-height: 42px; }
  .main-toggle { min-width: 0; }
  .round-btn { width: 42px; height: 42px; font-size: 24px; }
  .stepper input { width: 58px; font-size: 18px; }
  .stepper button { width: 40px; }
  .log-row { gap: 10px; }
  .bodymap.session-map { width: 84px; height: 116px; margin-top: 8px; }
  .big-target strong { font-size: 4rem; }
  .pacer { width: 190px; height: 190px; }
  .modal-actions.spread { flex-direction: column-reverse; align-items: stretch; }
  .modal-actions.spread .row { justify-content: flex-end; }
  .history-kind { display: none; }
  #toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
  body.in-session #toast { bottom: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.more-row { margin: 16px 0; }

/* ------------------------------------------------------ installed app --- */
#update-bar { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 12px; background: var(--hero-bg); color: var(--hero-ink); padding: 8px 10px 8px 18px; border-radius: 12px; box-shadow: var(--shadow); font-size: 14px; width: max-content; max-width: calc(100% - 24px); }
#update-bar[hidden] { display: none; }
#update-bar .text-btn { color: var(--hero-muted); }
.status-line { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.good-text { color: var(--good); }
.warn-text { color: var(--warn); }
@media (display-mode: standalone) {
  .topbar { padding-top: env(safe-area-inset-top); height: calc(76px + env(safe-area-inset-top)); }
}
@media (display-mode: standalone) and (max-width: 640px) {
  .topbar { height: calc(58px + env(safe-area-inset-top)); }
}

/* ------------------------------------------------- app feel (no select) --- */
/* Tapping text should never highlight it, like a native app. Fields you type in still select. */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button, a, summary, label, .chip { touch-action: manipulation; }

/* ------------------------------------------- shared exercise filters --- */
.filter-controls { display: grid; gap: 10px; margin-bottom: 10px; min-width: 0; }
.filter-controls .chips { margin: 0; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; overscroll-behavior-x: contain; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex-shrink: 0; }
.filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-toggle .icon { width: 16px; height: 16px; }
.filter-toggle.has { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
.sort-label { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; color: var(--muted); }
.sort-label select { width: auto; min-height: 36px; padding: 6px 10px; font-size: 13px; }
.result-count { margin-left: auto; }
.filter-panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px; background: var(--surface-2); border-radius: 12px; }
.filter-panel[hidden] { display: none; }
.filter-panel > label { font-size: 12px; color: var(--muted); margin: 0; }
.filter-panel select { margin-top: 4px; min-height: 40px; padding: 7px 10px; font-size: 14px; }
.panel-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-foot .checkrow { margin: 0; font-size: 13px; }
.panel-foot .text-btn { font-size: 13px; }
.group-head { grid-column: 1 / -1; font-family: var(--font); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 2px 0; }
.exercise-grid > .group-head:first-child { margin-top: 4px; }

/* ----------------------------------------------------- exercise picker --- */
#picker { overflow: hidden; }
.picker-view { display: flex; flex-direction: column; height: min(88dvh, 880px); padding: 22px 24px 16px; }
.picker-view .modal-header { margin-bottom: 12px; flex-shrink: 0; }
.picker-view .filter-controls { flex-shrink: 0; }
#picker .pick-list { display: block; flex: 1; min-height: 0; max-height: none; overflow-y: auto; margin: 4px -8px 0; padding: 0 8px 8px; overscroll-behavior: contain; }
.pick-list .group-head { position: sticky; top: 0; z-index: 1; background: var(--surface); margin: 0; padding: 12px 2px 6px; }
.picker-detail { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -8px; padding: 0 8px 12px; overscroll-behavior: contain; }
.picker-detail h2 { margin-bottom: 12px; }
.picker-foot { flex-shrink: 0; margin-top: 8px; }
.back-btn { font-weight: 600; font-size: 15px; }
.pick-row.rich { display: flex; align-items: center; gap: 4px; padding: 0; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; background: var(--surface); }
.pick-row.rich:hover { background: var(--surface); border-color: var(--line-strong); }
.pick-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; padding: 8px 4px 8px 10px; border-radius: 11px 0 0 11px; }
.pick-info:hover { background: var(--surface-2); }
.bodymap.mini { width: 34px; height: 51px; }
.pick-row.rich .pick-text small { display: block; line-height: 1.45; }
.pick-row.rich .pick-text .dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: 0; }
.pick-meta .last { color: var(--good); font-weight: 600; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 6px; background: var(--surface-3); color: var(--muted); vertical-align: 2px; margin-left: 4px; }
.pick-row.rich .pick-add { width: 48px; height: 48px; margin-right: 7px; display: grid; place-items: center; grid-auto-flow: column; gap: 1px; font-size: 22px; border-radius: 12px; background: var(--surface-2); color: var(--ink); flex-shrink: 0; }
.pick-row.rich .pick-add:hover { background: var(--surface-3); }
.pick-row.rich .pick-add.on { background: var(--lime); color: var(--lime-ink); font-size: 18px; font-weight: 700; }
.pick-add small { font-size: 11px; }
.pick-add.pop { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.18); } }

/* ------------------------------------------------- drag to reorder --- */
.step-head { gap: 8px; }
.drag-handle { width: 30px; height: 40px; margin: -4px 0 -4px -6px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; touch-action: none; cursor: grab; flex-shrink: 0; }
.drag-handle svg { width: 20px; height: 20px; }
.drag-handle:hover, .drag-handle:focus-visible { background: var(--surface-2); color: var(--ink-strong); }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
.drag-source { opacity: .35; }
.drag-ghost { position: fixed; z-index: 20; margin: 0; pointer-events: none; max-height: 220px; overflow: hidden; background: var(--surface); box-shadow: 0 18px 50px rgba(0, 0, 0, .28); transform: scale(1.02) rotate(-.6deg); }
.drop-line { position: fixed; z-index: 21; height: 4px; border-radius: 4px; background: var(--focus); pointer-events: none; }
.drop-line::before { content: ''; position: absolute; left: -6px; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--focus); }
.just-moved { animation: moved 1s ease; }
@keyframes moved { 0% { box-shadow: 0 0 0 3px var(--lime); } 100% { box-shadow: 0 0 0 3px transparent; } }
.empty-group { padding: 14px; border: 1px dashed var(--line-strong); border-radius: 10px; text-align: center; margin: 0; }

@media (max-width: 640px) {
  .picker-view { height: 92dvh; padding: 16px 14px 12px; }
  .filter-panel { grid-template-columns: 1fr 1fr; }
  .filter-panel > label:nth-of-type(3) { grid-column: 1 / -1; }
  .result-count { width: 100%; margin: 0; order: 3; }
  .sort-label > span { display: none; }
  .step-number { display: none; }
  .picker-foot { flex-wrap: wrap; row-gap: 8px; }
  .picker-foot #picker-count { flex-basis: 100%; }
  .picker-foot #picker-count:empty { display: none; }
  .picker-foot .row { margin-left: auto; }
}

/* ------------------------------------------------------- colour picker --- */
.palette-picker { display: flex; flex-wrap: wrap; gap: 10px; }
.palette-option { margin: 0; display: grid; justify-items: center; gap: 4px; cursor: pointer; }
.palette-option input { position: absolute; opacity: 0; pointer-events: none; }
.palette-swatch { position: relative; width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--sa) 0 50%, var(--sb) 50% 100%); box-shadow: 0 0 0 1px var(--line-strong); display: grid; place-items: center; overflow: hidden; }
.palette-option input:checked + .palette-swatch { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--focus); }
.palette-option input:focus-visible + .palette-swatch { outline: 2px solid var(--focus); outline-offset: 4px; }
.palette-name { font-size: 12px; color: var(--muted); }
.palette-option input:checked ~ .palette-name { color: var(--ink-strong); font-weight: 600; }
.swatch-kitty { width: 40px; height: 40px; }

/* --------------------------------------------------------- kitty theme --- */
#stickers { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#stickers:empty { display: none; }
.sticker-spot { position: absolute; display: block; opacity: .55; filter: drop-shadow(0 2px 3px rgba(92, 35, 66, .18)); }
.sticker-spot .sticker { width: 100%; height: auto; display: block; }
main { position: relative; z-index: 1; }
.hero { position: relative; }
.peek-kitty { position: absolute; top: -40px; right: 26%; width: 92px; height: auto; pointer-events: none; filter: drop-shadow(0 -1px 2px rgba(92, 35, 66, .15)); }
[data-palette="kitty"] .hero { margin-top: 42px; }
[data-palette="kitty"] .card, [data-palette="kitty"] .panel, [data-palette="kitty"] .day, [data-palette="kitty"] .stat { border-radius: 18px; }

:root[data-palette="kitty"][data-theme="dark"] .sticker-spot { opacity: .3; }
.sticker-spot.phone-only { display: none; }

{"id": "lib-supported-front-split", "name": "Supported front split", "category": "Advanced flexibility", "primary": ["Hamstrings", "Hip flexors"], "secondary": [], "mode": "manual", "value": 30, "equipment": "Mat, blocks and bolster", "gear": ["Mat", "Yoga props"], "level": "Advanced", "bilateral": true, "instructions": ["Prerequisite: comfortable supported hamstring and hip-flexor stretches and a controlled way to enter and leave. Learn the setup with a qualified coach.", "After warming up, use blocks for your hands and a bolster under your pelvis. Gradually lengthen one leg forward and the other back only within your comfortable range.", "Keep enough support to avoid sliding or dropping. The selected side is the front leg. Back out slowly; never push through pain."], "family": "frontsplit"},
{"id": "lib-front-split", "name": "Front split", "category": "Advanced flexibility", "primary": ["Hamstrings", "Hip flexors"], "secondary": [], "mode": "manual", "value": 30, "equipment": "Mat and blocks", "gear": ["Mat", "Yoga props"], "level": "Advanced", "bilateral": true, "instructions": ["Prerequisite: a supported front split you can enter and leave under control; coaching is recommended.", "After warming up, extend one leg forward and one backward using hand support. Stop at your own range rather than aiming for floor contact.", "The selected side is the front leg. Avoid bouncing or forcing depth; bend the legs and use your hands to exit gradually."], "family": "frontsplit"},
{"id": "lib-supported-middle-split", "name": "Supported middle split", "category": "Advanced flexibility", "primary": ["Adductors", "Hamstrings"], "secondary": [], "mode": "manual", "value": 30, "equipment": "Non-slip surface, blocks and bolster", "gear": ["Mat", "Yoga props"], "level": "Advanced", "bilateral": false, "instructions": ["Prerequisite: comfortable supported straddle work and a controlled exit; learn your setup with a qualified coach.", "With hands and pelvis supported, gradually open your legs sideways only within a comfortable range. Keep control of your feet and supports.", "Do not let your weight force the legs apart. Use your hands and bend the knees to ease out."], "family": "middlesplit"},
{"id": "lib-middle-split", "name": "Middle split", "category": "Advanced flexibility", "primary": ["Adductors"], "secondary": [], "mode": "manual", "value": 30, "equipment": "Non-slip surface and blocks", "gear": ["Mat", "Yoga props"], "level": "Advanced", "bilateral": false, "instructions": ["Prerequisite: controlled supported middle-split practice; coaching is recommended.", "After warming up, widen your legs gradually with hand support and stay within the range you can control.", "Floor contact is not required. Never bounce or use slippery flooring; ease out with support."], "family": "middlesplit"},
{"id": "lib-pancake-fold", "name": "Pancake fold", "category": "Advanced flexibility", "primary": ["Adductors", "Hamstrings"], "secondary": [], "mode": "manual", "value": 30, "equipment": "Mat and cushion", "gear": ["Mat"], "level": "Advanced", "bilateral": false, "instructions": ["Sit with legs comfortably apart, using a cushion if needed.", "Hinge forward from your hips only as far as you can comfortably control; keep hands supported.", "Avoid rounding and pulling yourself deeper. Return slowly."]},
{"id": "lib-supported-standing-side-split", "name": "Supported standing side split", "category": "Advanced flexibility", "primary": ["Adductors", "Hamstrings"], "secondary": [], "mode": "manual", "value": 30, "equipment": "Secure rail or wall and optional strap", "gear": ["Wall or support"], "level": "Advanced", "bilateral": true, "instructions": ["Prerequisite: supported single-leg balance and controlled side-leg mobility; learn this advanced setup with a qualified coach.", "Hold a secure support. Raise the free leg sideways only to a height you can control, using a strap only if already familiar with it.", "The selected side is the raised leg. Keep the supporting knee soft, do not pull toward your head, and lower slowly."], "family": "standingsplit"},
{"id": "lib-standing-side-split", "name": "Standing side split", "category": "Advanced flexibility", "primary": ["Adductors", "Hamstrings", "Glutes"], "secondary": [], "mode": "manual", "value": 30, "equipment": "Secure support nearby", "gear": ["Wall or support"], "level": "Advanced", "bilateral": true, "instructions": ["Prerequisite: a controlled supported standing side split and stable single-leg balance; coaching is recommended.", "Lift one leg sideways while maintaining control of the standing leg and torso. Use only the range you have already developed.", "The selected side is the raised leg. Height is optional, including approaching the head; never yank the foot upward. Use support to exit if needed."], "family": "standingsplit"},
{"id": "x-back-squat", "name": "Barbell back squat", "category": "Strength", "primary": ["Quadriceps", "Glutes"], "secondary": ["Hamstrings", "Adductors", "Core", "Back"], "mode": "reps", "value": 5, "equipment": "Barbell and squat rack", "gear": ["Barbell", "Squat rack"], "level": "General", "bilateral": false, "instructions": ["Set the bar in a rack at upper-chest height. Step under it and rest it across your upper back, hands just outside your shoulders.", "Brace your core, unrack and take two small steps back. Sit down between your hips with your knees tracking over your toes.", "Descend to a depth you control, then drive up through your whole foot. Set the safety bars low enough to catch a missed rep."], "family": "squat"},
{"id": "x-front-squat", "name": "Front squat", "category": "Strength", "primary": ["Quadriceps"], "secondary": ["Glutes", "Core", "Back"], "mode": "reps", "value": 5, "equipment": "Barbell and squat rack", "gear": ["Barbell", "Squat rack"], "level": "General", "bilateral": false, "instructions": ["Rest the bar on the front of your shoulders with your elbows high, holding it with your fingertips or crossed arms.", "Keep your torso upright and brace as you squat straight down between your heels.", "Stand up by driving your elbows and chest up together. Use the safety bars."], "family": "squat"},
{"id": "x-deadlift", "name": "Deadlift", "category": "Strength", "primary": ["Hamstrings", "Glutes", "Back"], "secondary": ["Quadriceps", "Forearms", "Core"], "mode": "reps", "value": 5, "equipment": "Barbell and plates", "gear": ["Barbell"], "level": "General", "bilateral": false, "instructions": ["Stand with the bar over your mid-foot, feet about hip-width apart. Hinge down and grip the bar just outside your legs.", "Pull your shoulders down, brace your core and take the slack out of the bar before it leaves the floor.", "Push the floor away and stand tall with the bar close to your legs. Lower it the same way, hips back first."], "family": "hinge"},
{"id": "x-romanian-deadlift", "name": "Romanian deadlift", "category": "Strength", "primary": ["Hamstrings", "Glutes"], "secondary": ["Back", "Forearms"], "mode": "reps", "value": 8, "equipment": "Barbell", "gear": ["Barbell"], "level": "General", "bilateral": false, "instructions": ["Hold the bar at hip height with a shoulder-width grip and soft knees.", "Push your hips back and let the bar slide down your thighs while your back stays long.", "Stop when you feel a strong hamstring stretch, usually around mid-shin, then drive your hips forward to stand."], "family": "hinge"},
{"id": "x-bench-press", "name": "Bench press", "category": "Strength", "primary": ["Chest"], "secondary": ["Arms", "Shoulders"], "mode": "reps", "value": 5, "equipment": "Barbell, bench and rack", "gear": ["Barbell", "Weight bench", "Squat rack"], "level": "General", "bilateral": false, "instructions": ["Lie on the bench with your eyes under the bar, feet planted and shoulder blades pulled together.", "Unrack with straight arms and lower the bar with control to your lower chest, elbows about 45° from your body.", "Press back up over your shoulders. Use safety arms or a spotter for heavy sets."], "family": "press"},
{"id": "x-incline-bench", "name": "Incline bench press", "category": "Strength", "primary": ["Chest", "Shoulders"], "secondary": ["Arms"], "mode": "reps", "value": 8, "equipment": "Barbell, incline bench and rack", "gear": ["Barbell", "Weight bench", "Squat rack"], "level": "General", "bilateral": false, "instructions": ["Set the bench to about 30°. Lie back with your shoulder blades set and feet planted.", "Lower the bar with control to your upper chest.", "Press up and slightly back so the bar finishes over your shoulders."], "family": "press"},
{"id": "x-overhead-press", "name": "Overhead press", "category": "Strength", "primary": ["Shoulders"], "secondary": ["Arms", "Core", "Back"], "mode": "reps", "value": 6, "equipment": "Barbell (a rack helps)", "gear": ["Barbell"], "level": "General", "bilateral": false, "instructions": ["Hold the bar at shoulder height with your hands just outside your shoulders and elbows slightly in front of the bar.", "Squeeze your glutes and brace, then press straight up, moving your head back slightly to let the bar pass.", "Finish with the bar over your mid-foot and your head through, then lower with control."]},
{"id": "x-barbell-row", "name": "Barbell row", "category": "Strength", "primary": ["Back"], "secondary": ["Arms", "Forearms", "Hamstrings"], "mode": "reps", "value": 8, "equipment": "Barbell", "gear": ["Barbell"], "level": "General", "bilateral": false, "instructions": ["Hinge forward to about 45° with the bar hanging at arm’s length and your back long.", "Pull the bar toward your lower ribs, leading with your elbows.", "Lower it under control without letting your torso bounce up."], "family": "row"},
{"id": "x-hip-thrust", "name": "Barbell hip thrust", "category": "Strength", "primary": ["Glutes"], "secondary": ["Hamstrings", "Core"], "mode": "reps", "value": 10, "equipment": "Barbell, bench and a bar pad", "gear": ["Barbell", "Weight bench"], "level": "General", "bilateral": false, "instructions": ["Sit with your upper back against a bench and a padded bar over your hips. Plant your feet about hip-width apart.", "Tuck your chin slightly and drive through your heels until your torso is level with the bench.", "Squeeze your glutes at the top, then lower with control."]},
{"id": "x-goblet-squat", "name": "Goblet squat", "category": "Strength", "primary": ["Quadriceps", "Glutes"], "secondary": ["Core", "Adductors"], "mode": "reps", "value": 10, "equipment": "One dumbbell or kettlebell", "gear": ["Dumbbells|Kettlebell"], "level": "General", "bilateral": false, "instructions": ["Hold a dumbbell or kettlebell vertically against your chest, elbows pointing down.", "Sit down between your heels with your chest tall, letting your elbows travel inside your knees.", "Drive up through your whole foot to stand."], "family": "squat"},
{"id": "x-db-bench-press", "name": "Dumbbell bench press", "category": "Strength", "primary": ["Chest"], "secondary": ["Arms", "Shoulders"], "mode": "reps", "value": 10, "equipment": "Dumbbells and bench", "gear": ["Dumbbells", "Weight bench"], "level": "General", "bilateral": false, "instructions": ["Lie on a bench with a dumbbell in each hand at chest level and your feet planted.", "Press the dumbbells up until your arms are straight over your shoulders.", "Lower slowly until your elbows are just below the bench, keeping your wrists stacked over your elbows."], "family": "press"},
{"id": "x-db-incline-press", "name": "Incline dumbbell press", "category": "Strength", "primary": ["Chest", "Shoulders"], "secondary": ["Arms"], "mode": "reps", "value": 10, "equipment": "Dumbbells and incline bench", "gear": ["Dumbbells", "Weight bench"], "level": "General", "bilateral": false, "instructions": ["Set a bench to about 30° and lie back with the dumbbells at your upper chest.", "Press them up and slightly together until your arms are straight.", "Lower with control to a comfortable stretch across your chest."], "family": "press"},
{"id": "x-db-rdl", "name": "Dumbbell Romanian deadlift", "category": "Strength", "primary": ["Hamstrings", "Glutes"], "secondary": ["Back", "Forearms"], "mode": "reps", "value": 10, "equipment": "Dumbbells", "gear": ["Dumbbells"], "level": "General", "bilateral": false, "instructions": ["Stand tall holding dumbbells in front of your thighs, knees soft.", "Push your hips back and slide the dumbbells down your legs, keeping your back long.", "At a strong hamstring stretch, drive your hips forward to stand."], "family": "hinge"},
{"id": "x-walking-lunge", "name": "Walking lunge", "category": "Strength", "primary": ["Quadriceps", "Glutes"], "secondary": ["Hamstrings", "Calves", "Core"], "mode": "reps", "value": 10, "equipment": "None (hold dumbbells to add load)", "gear": [], "level": "General", "bilateral": false, "instructions": ["Stand tall, holding dumbbells at your sides if you want extra load.", "Step forward and lower until both knees bend to about 90°, back knee hovering above the floor.", "Push through the front foot and step through into the next lunge. Count each leg as one repetition."]},
{"id": "x-bulgarian-split-squat", "name": "Bulgarian split squat", "category": "Strength", "primary": ["Quadriceps", "Glutes"], "secondary": ["Adductors", "Hamstrings", "Core"], "mode": "reps", "value": 8, "equipment": "Bench or chair (dumbbells optional)", "gear": ["Chair or bench|Weight bench"], "level": "General", "bilateral": true, "instructions": ["Stand about a stride in front of a bench and rest the top of your back foot on it.", "Lower straight down until your front thigh is near parallel, front knee over your foot.", "Drive through the front foot to rise. Finish all reps, then switch legs."], "family": "squat"},
{"id": "x-hammer-curl", "name": "Hammer curl", "category": "Strength", "primary": ["Arms", "Forearms"], "secondary": [], "mode": "reps", "value": 12, "equipment": "Dumbbells", "gear": ["Dumbbells"], "level": "General", "bilateral": false, "instructions": ["Hold dumbbells at your sides with your palms facing in.", "Curl them up while keeping your elbows by your ribs.", "Lower slowly without swinging."]},
{"id": "x-overhead-triceps", "name": "Overhead triceps extension", "category": "Strength", "primary": ["Arms"], "secondary": ["Shoulders"], "mode": "reps", "value": 12, "equipment": "One dumbbell", "gear": ["Dumbbells"], "level": "General", "bilateral": false, "instructions": ["Hold one dumbbell overhead with both hands, arms straight.", "Bend your elbows to lower it behind your head, keeping your elbows pointing forward.", "Straighten your arms to press it back up."]},
{"id": "x-db-fly", "name": "Dumbbell fly", "category": "Strength", "primary": ["Chest"], "secondary": ["Shoulders"], "mode": "reps", "value": 12, "equipment": "Dumbbells and bench", "gear": ["Dumbbells", "Weight bench"], "level": "General", "bilateral": false, "instructions": ["Lie on a bench with the dumbbells above your chest, palms facing and elbows softly bent.", "Open your arms in a wide arc until you feel a stretch across your chest.", "Bring the dumbbells back together as if hugging a tree."]},
{"id": "x-rear-delt-fly", "name": "Rear delt fly", "category": "Strength", "primary": ["Shoulders", "Back"], "secondary": [], "mode": "reps", "value": 12, "equipment": "Light dumbbells", "gear": ["Dumbbells"], "level": "General", "bilateral": false, "instructions": ["Hinge forward with a long back and let the dumbbells hang below your chest.", "With soft elbows, raise the dumbbells out to the sides and squeeze your shoulder blades.", "Lower slowly. Keep the weight light enough that you do not shrug."]},

{"id": "x-farmers-carry", "name": "Farmer’s carry", "category": "Strength", "primary": ["Forearms", "Core"], "secondary": ["Back", "Shoulders", "Glutes"], "mode": "time", "value": 40, "equipment": "Two heavy dumbbells or kettlebells", "gear": ["Dumbbells|Kettlebell"], "level": "General", "bilateral": false, "instructions": ["Pick up a heavy weight in each hand with a neutral back.", "Walk with short, steady steps, standing tall with your shoulders down.", "Set the weights down with control when your grip or posture starts to fade."]},
{"id": "x-db-thruster", "name": "Dumbbell thruster", "category": "HIIT", "primary": ["Quadriceps", "Shoulders"], "secondary": ["Glutes", "Arms", "Core"], "mode": "reps", "value": 10, "equipment": "Dumbbells", "gear": ["Dumbbells"], "level": "General", "bilateral": false, "instructions": ["Hold dumbbells at your shoulders with your feet about shoulder-width apart.", "Squat down, then drive up powerfully and use that momentum to press the dumbbells overhead.", "Bring them back to your shoulders as you sink into the next squat."]},
{"id": "x-kb-swing", "name": "Kettlebell swing", "category": "Strength", "primary": ["Glutes", "Hamstrings"], "secondary": ["Core", "Back", "Forearms"], "mode": "reps", "value": 15, "equipment": "Kettlebell", "gear": ["Kettlebell"], "level": "General", "bilateral": false, "instructions": ["Stand with your feet slightly wider than your hips and the bell a little in front of you. Hinge and grip it with both hands.", "Hike it back between your legs, then snap your hips forward so the bell floats to about chest height.", "Let it fall back into the hinge and repeat. The power comes from your hips, not your arms."], "family": "hinge"},
{"id": "x-kb-deadlift", "name": "Kettlebell deadlift", "category": "Strength", "primary": ["Glutes", "Hamstrings"], "secondary": ["Back", "Quadriceps"], "mode": "reps", "value": 10, "equipment": "Kettlebell or dumbbell", "gear": ["Kettlebell|Dumbbells"], "level": "General", "bilateral": false, "instructions": ["Stand with the bell between your feet.", "Hinge at your hips, bend your knees slightly and grip the handle with a long back.", "Stand up by driving your hips forward, then lower it the same way."], "family": "hinge"},
{"id": "x-kb-press", "name": "Single-arm kettlebell press", "category": "Strength", "primary": ["Shoulders"], "secondary": ["Arms", "Core"], "mode": "reps", "value": 8, "equipment": "Kettlebell or dumbbell", "gear": ["Kettlebell|Dumbbells"], "level": "General", "bilateral": true, "instructions": ["Hold the bell in the rack position, resting on your forearm at shoulder height.", "Brace and press it overhead until your arm is straight, bicep near your ear.", "Lower back to the rack with control. Finish the set, then switch arms."]},
{"id": "x-turkish-getup", "name": "Turkish get-up", "category": "Strength", "primary": ["Shoulders", "Core"], "secondary": ["Glutes", "Arms", "Hip flexors"], "mode": "reps", "value": 3, "equipment": "Kettlebell or dumbbell", "gear": ["Kettlebell|Dumbbells"], "level": "General", "bilateral": true, "instructions": ["Lie on your back holding the weight straight up in one hand, same-side knee bent. Keep your eyes on the weight throughout.", "Roll to your elbow, then your hand, lift your hips, sweep the straight leg under you to a kneel, and stand up.", "Reverse each step to lie back down. Learn the sequence with no weight, or a shoe balanced on your fist, first."]},
{"id": "x-lat-pulldown", "name": "Lat pulldown", "category": "Strength", "primary": ["Back"], "secondary": ["Arms", "Shoulders"], "mode": "reps", "value": 10, "equipment": "Cable machine", "gear": ["Cable / machines"], "level": "General", "bilateral": false, "instructions": ["Sit with your thighs under the pad and grip the bar a little wider than your shoulders.", "Draw your shoulder blades down, then pull the bar to your upper chest, leading with your elbows.", "Let it rise slowly until your arms are straight."], "family": "pullup"},
{"id": "x-cable-row", "name": "Seated cable row", "category": "Strength", "primary": ["Back"], "secondary": ["Arms", "Forearms"], "mode": "reps", "value": 10, "equipment": "Cable machine", "gear": ["Cable / machines"], "level": "General", "bilateral": false, "instructions": ["Sit tall with your feet on the platform and knees soft, holding the handle with straight arms.", "Pull the handle to your lower ribs while squeezing your shoulder blades together.", "Return slowly until your arms are straight, without rounding forward."], "family": "row"},
{"id": "x-leg-press", "name": "Leg press", "category": "Strength", "primary": ["Quadriceps", "Glutes"], "secondary": ["Hamstrings", "Adductors"], "mode": "reps", "value": 10, "equipment": "Leg press machine", "gear": ["Cable / machines"], "level": "General", "bilateral": false, "instructions": ["Sit with your back flat on the pad and your feet hip-width apart on the platform.", "Release the safeties and lower the platform until your knees bend to about 90°, keeping your lower back on the pad.", "Press back up without snapping your knees straight."]},
{"id": "x-leg-curl", "name": "Leg curl", "category": "Strength", "primary": ["Hamstrings"], "secondary": ["Calves"], "mode": "reps", "value": 12, "equipment": "Leg curl machine", "gear": ["Cable / machines"], "level": "General", "bilateral": false, "instructions": ["Adjust the machine so your knees line up with its pivot and the pad sits just above your heels.", "Curl the pad toward you by bending your knees.", "Return slowly without letting the weight stack crash."]},
{"id": "x-leg-extension", "name": "Leg extension", "category": "Strength", "primary": ["Quadriceps"], "secondary": [], "mode": "reps", "value": 12, "equipment": "Leg extension machine", "gear": ["Cable / machines"], "level": "General", "bilateral": false, "instructions": ["Sit with your knees lined up with the machine’s pivot and the pad on your lower shins.", "Straighten your legs to lift the pad.", "Pause briefly, then lower with control."]},
{"id": "x-triceps-pushdown", "name": "Triceps pushdown", "category": "Strength", "primary": ["Arms"], "secondary": [], "mode": "reps", "value": 12, "equipment": "Cable with bar or rope, or a band", "gear": ["Cable / machines|Resistance band"], "level": "General", "bilateral": false, "instructions": ["Stand facing a high cable and grip the attachment with your elbows at your sides.", "Push down until your arms are straight, keeping your elbows still.", "Let it rise slowly to about chest height."]},
