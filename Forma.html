      <label>Rest (sec)<input type="number" data-field="rest" min="0" max="3600" step="1" required value="${b.rest}" title="Rest after each set"></label>
    </div>
    <details class="more" data-open-id="${b.id}" ${editorOpen.has(b.id) ? 'open' : ''}><summary>More options</summary>
      <div class="step-fields">
        <label>Section<select data-field="section">${options(SECTIONS, b.section)}</select></label>
        <label>Tracking<select data-field="mode" data-rerender>${options(MODES, b.mode, MODE_LABELS)}</select></label>
        <label>Sides<select data-field="side" data-rerender>${options(SIDES, b.side, { 'Both sides': 'Both sides, one after the other', 'Alternating': 'Alternating in one set' })}</select></label>
        ${both ? `<label>Start with<select data-field="firstSide">${options(['Left', 'Right'], b.firstSide)}</select></label>
          <label>Side change (sec)<input type="number" data-field="sideSwitch" min="0" max="120" step="1" required value="${b.sideSwitch}"></label>` : ''}
        <label>Setup time before (sec)<input type="number" data-field="transition" min="0" max="600" step="1" placeholder="Routine default" value="${b.transition ?? ''}"></label>
        ${weighted ? '' : `<label>Weight (${weightUnit()})<input type="number" data-field="weight" data-unit="weight" min="0" max="2000" step="0.5" value="${fmtNum(kgToDisplay(b.weight), 1)}"></label>`}
      </div>
      <label class="checkrow"><input type="checkbox" data-field="waitReady" ${b.waitReady ? 'checked' : ''}> Wait for me to tap Begin before this exercise</label>
      <label class="note-field">Note<input data-field="note" maxlength="200" value="${esc(b.note)}" placeholder="e.g. slow on the way down, blue band"></label>
    </details></div>`;
}

function addControls(parent) {
  return `<div class="block-add">
    <button type="button" class="btn light" data-action="open-picker" data-parent="${parent}">${icon('plus')} Exercises</button>
    <button type="button" class="btn light" data-action="block-add-rest" data-parent="${parent}">${icon('plus')} Break</button>
    ${parent === '' ? `<button type="button" class="btn light" data-action="block-add-group">${icon('plus')} Repeat group</button>` : ''}</div>`;
}

function renderEditor(keepScroll = true) {
  // Remember which "More options" panels are open right now, so a re-render keeps them open.
  $$('#routine-form details[data-open-id]').forEach(d => (d.open ? editorOpen.add(d.dataset.openId) : editorOpen.delete(d.dataset.openId)));
  const isNew = !routine(draft.id);
  showModal(modalHead(isNew ? 'Build your routine' : 'Edit routine') + `<form id="routine-form" novalidate>
    <div class="form-grid wide-first"><div class="field"><label for="routine-name">Name</label>
      <input id="routine-name" data-draft="name" required maxlength="90" value="${esc(draft.name)}" placeholder="e.g. Push day, Sunday flow"></div>
      <div class="field"><label for="routine-category">Main activity</label><select id="routine-category" data-draft="category">${options(CATEGORIES, draft.category)}</select></div></div>
    <div class="field"><label for="routine-desc">Note to yourself (optional)</label><input id="routine-desc" data-draft="description" maxlength="200" value="${esc(draft.description)}"></div>
    <details class="more routine-settings"><summary>Routine settings</summary>
      <div class="field"><label for="default-transition">Setup time between exercises (seconds)</label>
      <input id="default-transition" type="number" data-draft="transition" required min="0" max="600" step="1" value="${draft.transition}">
      <small>Time to get into position before the next exercise. A break replaces it. Use 0 for back-to-back intervals.</small></div></details>
    <div class="section-head"><h3>Your sequence</h3><span class="pill" id="draft-summary">${draftSummary()}</span></div>
    <div class="blocks">${draft.steps.map((b, i) => blockHTML(b, String(i), i, draft.steps.length)).join('') || '<p class="muted empty-seq">Add exercises, breaks or a repeat group to begin.</p>'}</div>
    ${addControls('')}
    <div class="modal-actions spread">
      ${isNew ? '<span></span>' : `<button type="button" class="btn danger" data-action="delete-routine" data-id="${draft.id}">Delete</button>`}
      <div class="row"><button type="button" class="btn light" data-action="close">Cancel</button><button class="btn">Save routine</button></div>
    </div></form>`, { wide: true, keepScroll });
}

/** Read an editor input, converting display units back to kg / metres. */
function readField(input) {
  if (input.type === 'checkbox') return input.checked;
  if (input.type === 'number') {
    if (input.value === '') return input.dataset.field === 'transition' ? null : undefined;
    const v = Number(input.value);
    if (!Number.isFinite(v)) return undefined;
    if (input.dataset.unit === 'weight') return Math.round(displayToKg(v) * 1000) / 1000;
    if (input.dataset.unit === 'distance') return displayToM(v);
    return v;
  }
  return input.value;
}

/** Live-binds editor inputs to the draft. Returns true when it handled the event. */
function editorInput(ev) {
  const input = ev.target;
  if (!draft || !input.closest?.('#routine-form')) return false;
  if (input.dataset.draft) {
    const key = input.dataset.draft;
    const v = readField(input);
    if (v !== undefined) draft[key] = v;
  } else if (input.dataset.field) {
    const holder = input.closest('[data-path]');
    const { block } = getBlock(holder.dataset.path);
    const v = readField(input);
    if (v !== undefined) block[input.dataset.field] = v;
    if (ev.type === 'change' && input.hasAttribute('data-rerender')) {
      if (input.dataset.field === 'mode') block.value = exercise(block.exerciseId)?.mode === block.mode ? exercise(block.exerciseId).value : defaultValueFor(block.mode);
      draftDirty = true;
      renderEditor();
      return true;
    }
  } else return false;
  draftDirty = true;
  const summary = $('#draft-summary');
  if (summary) summary.textContent = draftSummary();
  return true;
}
const defaultValueFor = mode => ({ reps: 10, time: 30, manual: 30, distance: 1000 }[mode]);

function editorAction(name, el) {
  const path = el.dataset.path;
  if (name === 'block-remove') { const { list, index } = getBlock(path); list.splice(index, 1); }
  if (name === 'block-up' || name === 'block-down') {
    const { list, index } = getBlock(path);
    const to = index + (name === 'block-up' ? -1 : 1);
    if (to >= 0 && to < list.length) [list[index], list[to]] = [list[to], list[index]];
  }
  if (name === 'block-copy') {
    const { list, index, block } = getBlock(path);
    if (list.length >= 200) { toast('Maximum 200 blocks per list.'); return; }
    list.splice(index + 1, 0, freshIds([block])[0]);
  }
  if (name === 'block-add-rest' || name === 'block-add-group') {
    const parent = el.dataset.parent ?? '';
    const list = parent === '' ? draft.steps : getBlock(parent).block.steps;
    if (list.length >= 200) { toast('Maximum 200 blocks per list.'); return; }
    if (name === 'block-add-rest') list.push({ id: uid(), kind: 'rest', value: 30, section: 'Main' });
    else list.push({ id: uid(), kind: 'group', name: '', rounds: 3, steps: [] });
  }
  draftDirty = true;
  renderEditor();
}
['block-remove', 'block-up', 'block-down', 'block-copy', 'block-add-rest', 'block-add-group'].forEach(name => {
  actions[name] = el => editorAction(name, el);
});

function emptyGroups(blocks) { return blocks.some(b => b.kind === 'group' && !b.steps.length); }

forms['routine-form'] = f => {
  const bad = f.querySelector(':invalid');
  if (bad) {
    const details = bad.closest('details');
    if (details) { details.open = true; editorOpen.add(details.dataset.openId); }
    f.reportValidity();
    return;
  }
  draft.name = draft.name.trim();
  if (!draft.name) { toast('Give your routine a name.'); $('#routine-name').focus(); return; }
  if (!routineMoves(draft).length) { toast('Add at least one exercise.'); return; }
  if (emptyGroups(draft.steps)) { toast('A repeat group is empty. Add something to it or remove it.'); return; }
  try {
    compileRoutine(draft);
    normalizeState({ ...state, routines: [...state.routines.filter(r => r.id !== draft.id), draft] });
  } catch (err) { toast(err.message.replace('This is not a valid Forma backup: ', 'Please check this routine: ')); return; }
  const i = state.routines.findIndex(r => r.id === draft.id);
  if (i < 0) state.routines.push({ ...draft, createdAt: new Date().toISOString() });
  else state.routines[i] = draft;
  draft = null; draftDirty = false;
  save(); closeModal(); render(); toast('Routine saved. Ready when you are.');
};

/** Protect unsaved edits from an accidental close. */
function guardEditorClose() {
  if (!draft || !draftDirty || !$('#routine-form')) return false;
  confirmDialog({
    title: 'Discard your changes?', yes: 'Discard', body: '<p>Your edits to this routine have not been saved.</p>',
    onYes: () => { draft = null; draftDirty = false; },
    onNo: () => renderEditor(false),
  });
  return true;
}
actions.close = () => { if (!guardEditorClose()) closeModal(); };

// --------------------------------------------------------------- picker ----
// A compact version of the library: same search, filters and sorting, details on tap,
// and a + button to add. Several exercises can be added in one go; the last add can be undone.

let pickerTarget = '';      // '' = the routine itself, otherwise the path of a repeat group
let pickerAdds = [];        // [{ blockId, exerciseId }] added during this visit, for undo and badges
let pickerScroll = 0;
let pickerDetailId = null;  // the exercise whose details are open inside the picker, if any

actions['open-picker'] = el => openPicker(el.dataset.parent ?? '');
function openPicker(parent) {
  pickerTarget = parent;
  pickerAdds = [];
  listLimits.picker = 60;
  renderPickerShell();
  const dlg = $('#picker');
  if (!dlg.open) dlg.showModal();
  if (matchMedia('(pointer: fine)').matches) $('.filter-search', dlg)?.focus();
}

function pickerTargetList() { return pickerTarget === '' ? draft.steps : getBlock(pickerTarget).block.steps; }
function pickerTargetName() {
  if (pickerTarget === '') return draft.name.trim() || 'your routine';
  return getBlock(pickerTarget).block.name || 'the repeat group';
}

function renderPickerShell() {
  pickerDetailId = null;
  $('#picker-content').innerHTML = `<div class="picker-view">
    <div class="modal-header"><div><h2>Add exercises</h2><p class="muted small">to ${esc(pickerTargetName())}</p></div>
      <button type="button" class="close" data-action="close-picker" aria-label="Close">×</button></div>
    ${filterControlsHTML('picker')}
    <div id="picker-list" class="pick-list"></div>
    ${pickerFootHTML()}</div>`;
  renderPickerList();
}

function pickerFootHTML() {
  const extra = pickerDetailId ? `<button type="button" class="btn lime" data-action="pick" data-id="${pickerDetailId}" data-back="1">${icon('plus')} Add</button>` : '';
  const last = pickerAdds.at(-1);
  const text = pickerAdds.length ? `${plural(pickerAdds.length, 'exercise')} added · last: ${esc(exercise(last.exerciseId)?.name || '')}`
    : pickerDetailId ? '' : 'Tap a name for details, ＋ to add.';
  return `<div class="picker-foot"><span id="picker-count" class="muted small">${text}</span>
    <div class="row">${pickerAdds.length ? '<button type="button" class="btn light small" data-action="picker-undo">Undo</button>' : ''}${extra}
    <button type="button" class="btn" data-action="close-picker">Done</button></div></div>`;
}
function refreshPickerFoot() {
  const foot = $('#picker .picker-foot');
  if (foot) foot.outerHTML = pickerFootHTML();
}

function pickerRow(e, usage) {
  const added = pickerAdds.filter(a => a.exerciseId === e.id).length;
  const n = usedCount(usage, e);
  const last = n ? lastPerformance(e) : null;
  const gearText = esc((e.gear || []).map(gearLabel).join(', ') || 'No equipment');
  const meta2 = last ? `${gearText} · <span class="last">last: ${esc(setsSummary(last.sets))}</span>` : gearText;
  return `<div class="pick-row rich">
    <button type="button" class="pick-info" data-action="picker-detail" data-id="${e.id}" aria-label="Details for ${esc(e.name)}">
      ${bodymap(e, 'mini')}
      <span class="pick-text"><strong>${esc(e.name)}${e.level === 'Advanced' ? ' <span class="badge">Advanced</span>' : ''}${e.custom ? ' <span class="badge">Yours</span>' : ''}</strong>
        <small><span class="dot cat-${catClass(e.category)}" aria-hidden="true"></span>${esc(e.category)} · ${esc(e.primary.slice(0, 3).join(', ') || 'Breath & awareness')}</small>
        <small class="pick-meta">${meta2}</small></span>
    </button>
    <button type="button" class="pick-add ${added ? 'on' : ''}" data-action="pick" data-id="${e.id}" aria-label="Add ${esc(e.name)}">${added ? '✓' + (added > 1 ? `<small>${added}</small>` : '') : '＋'}</button>
  </div>`;
}

function renderPickerList() {
  const box = $('#picker-list');
  if (!box) return;
  const usage = exerciseUsage();
  const { list: all, groupOf } = filterExercises(filters.picker, usage);
  const list = all.slice(0, listLimits.picker);
  const count = $('[data-count="picker"]');
  if (count) count.textContent = plural(all.length, 'exercise');
  box.innerHTML = withHeadings(list, groupOf, e => pickerRow(e, usage), g => `<h3 class="group-head">${esc(g)}</h3>`)
    + (all.length > list.length ? `<div class="center row more-row"><button type="button" class="btn light small" data-action="picker-more">Show ${Math.min(60, all.length - list.length)} more</button></div>` : '')
    + (all.length ? '' : `<div class="empty"><h3>Nothing matches</h3><p class="muted">Try fewer words, another activity or fewer filters.</p><button type="button" class="btn light small" data-action="clear-filters" data-scope="picker">Clear filters</button></div>`);
}
actions['picker-more'] = () => { listLimits.picker += 60; const top = $('#picker-list').scrollTop; renderPickerList(); $('#picker-list').scrollTop = top; };

actions['picker-detail'] = el => {
  const e = exercise(el.dataset.id);
  if (!e) return;
  if ($('#picker-list')) pickerScroll = $('#picker-list').scrollTop;
  pickerDetailId = e.id;
  $('#picker-content').innerHTML = `<div class="picker-view">
    <div class="modal-header"><button type="button" class="text-btn back-btn" data-action="picker-back">‹ All exercises</button>
      <button type="button" class="close" data-action="close-picker" aria-label="Close">×</button></div>
    <div class="picker-detail"><h2>${esc(e.name)}</h2>${exerciseInfoHTML(e, 'picker-detail')}</div>
    ${pickerFootHTML()}</div>`;
};
actions['picker-back'] = () => {
  renderPickerShell();
  const list = $('#picker-list');
  if (list) list.scrollTop = pickerScroll;
};

actions.pick = el => {
  const e = exercise(el.dataset.id);
  const list = pickerTargetList();
  if (list.length >= 200) { toast('Maximum 200 blocks per list.'); return; }
  const block = newMove(e);
  list.push(block);
  pickerAdds.push({ blockId: block.id, exerciseId: e.id });
  draftDirty = true;
  navigator.vibrate?.(8);
  renderEditor();
  if (el.dataset.back) { actions['picker-back'](); toast(`${e.name} added.`); return; }
  updatePickButtons(e.id);
  refreshPickerFoot();
};

/** Update one exercise's ＋ / ✓ button without re-rendering the list (keeps the scroll position). */
function updatePickButtons(exerciseId) {
  const added = pickerAdds.filter(a => a.exerciseId === exerciseId).length;
  $$(`#picker-list .pick-add[data-id="${exerciseId}"]`).forEach(btn => {
    btn.classList.toggle('on', added > 0);
    btn.innerHTML = added ? '✓' + (added > 1 ? `<small>${added}</small>` : '') : '＋';
    if (added) { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  });
}

/** Remove a block anywhere in the draft by id. */
function removeBlockById(blocks, id) {
  const i = blocks.findIndex(b => b.id === id);
  if (i >= 0) { blocks.splice(i, 1); return true; }
  return blocks.some(b => b.kind === 'group' && removeBlockById(b.steps, id));
}

actions['picker-undo'] = () => {
  const last = pickerAdds.pop();
  if (!last) return;
  removeBlockById(draft.steps, last.blockId);
  renderEditor();
  updatePickButtons(last.exerciseId);
  refreshPickerFoot();
  toast(`${exercise(last.exerciseId)?.name || 'Exercise'} removed again.`);
};

actions['close-picker'] = () => {
  $('#picker').close();
  if (pickerAdds.length) {
    // Bring the newest step into view in the editor.
    const added = pathOfBlock(pickerAdds.at(-1).blockId);
    $(`#routine-form [data-path="${added}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
};

/** Name matches first, then everything else that matches, each group in library order. */
function rankByQuery(list, query) {
  const q = query.trim().toLowerCase();
  if (!q) return list;
  const score = e => {
    const name = e.name.toLowerCase();
    if (name === q) return 0;
    if (name.startsWith(q)) return 1;
    if (name.includes(q)) return 2;
    if (q.split(/\s+/).every(w => name.includes(w))) return 3;
    return 4;
  };
  return list.map((e, i) => [score(e), i, e]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);
}

/** Library order: by activity, then alphabetical; your own exercises first. */
function libraryOrder(list) {
  const rank = c => CATEGORIES.indexOf(c);
  return list.slice().sort((a, b) => (b.custom === true) - (a.custom === true) || rank(a.category) - rank(b.category) || a.name.localeCompare(b.name));
}

function exerciseMatches(e, query) {
  if (!query) return true;
  const hay = [e.name, e.category, e.equipment, ...(e.primary || []), ...(e.secondary || []), ...(e.gear || [])].join(' ').toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(word => hay.includes(word));
}


// --------------------------------------------------------- drag & drop ----
// Pointer events cover mouse, touch and pen. The handle has touch-action: none, so dragging
// it never scrolls the page; the dialog scrolls itself when you drag near its edges.

let drag = null;

/** Path ("3" or "2.1") of a block by id in the current draft. */
function pathOfBlock(id, blocks = draft.steps, prefix = '') {
  for (let i = 0; i < blocks.length; i++) {
    const path = prefix + i;
    if (blocks[i].id === id) return path;
    if (blocks[i].kind === 'group') {
      const inner = pathOfBlock(id, blocks[i].steps, path + '.');
      if (inner) return inner;
    }
  }
  return null;
}

/** Move a block to `index` in the list at `toListPath` ('' = top level). Returns the moved block, or null. */
function moveBlockTo(fromPath, toListPath, index) {
  const from = getBlock(fromPath);
  const target = toListPath === '' ? draft.steps : getBlock(toListPath).block.steps;
  if (from.block.kind === 'group' && toListPath !== '') return null;   // groups do not nest
  if (target === from.list) {
    if (index === from.index || index === from.index + 1) return null; // dropped where it was
    if (index > from.index) index--;
  } else if (target.length >= 200) { toast('Maximum 200 blocks per list.'); return null; }
  from.list.splice(from.index, 1);
  target.splice(index, 0, from.block);
  return from.block;
}

function flashBlock(id) {
  const el = $(`#routine-form [data-path="${pathOfBlock(id)}"]`);
  if (el) { el.classList.remove('just-moved'); void el.offsetWidth; el.classList.add('just-moved'); }
}

/** Every place a dragged step could land: between the cards of each list it may enter. */
function dropSlots() {
  const form = $('#routine-form');
  const lists = [{ el: $(':scope > .blocks', form), path: '' }];
  if (!drag.isGroup) $$('.repeat-group', form).forEach(g => lists.push({ el: $(':scope > .blocks', g), path: g.dataset.path }));
  const slots = [];
  for (const { el, path } of lists) {
    if (!el) continue;
    const box = el.getBoundingClientRect();
    const cards = [...el.children].filter(c => c.matches('[data-path]'));
    if (!cards.length) { slots.push({ path, index: 0, y: box.top + box.height / 2, left: box.left, width: box.width }); continue; }
    let prevBottom = cards[0].getBoundingClientRect().top - 10;
    cards.forEach((c, k) => {
      const r = c.getBoundingClientRect();
      slots.push({ path, index: k, y: (prevBottom + r.top) / 2, left: box.left, width: box.width });
      prevBottom = r.bottom;
    });
    slots.push({ path, index: cards.length, y: prevBottom + 5, left: box.left, width: box.width });
  }
  return slots;
}

function beginDrag(handle, ev) {
  const card = handle.closest('.step');   // the whole card, not the handle (which carries the path too)
  const rect = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.removeAttribute('data-path');
  $$('[data-path]', ghost).forEach(n => n.removeAttribute('data-path'));
  Object.assign(ghost.style, { width: rect.width + 'px', left: rect.left + 'px', top: rect.top + 'px' });
  const line = document.createElement('div');
  line.className = 'drop-line';
  $('#modal').append(ghost, line);
  card.classList.add('drag-source');
  document.body.classList.add('is-dragging');
  try { handle.setPointerCapture(ev.pointerId); } catch { /* older browsers */ }
  navigator.vibrate?.(12);
  drag = { path: card.dataset.path, id: getBlock(card.dataset.path).block.id, isGroup: card.classList.contains('repeat-group'),
    card, ghost, line, grab: ev.clientY - rect.top, y: ev.clientY, pointerId: ev.pointerId, target: null, raf: 0 };
  moveDrag();
  drag.raf = requestAnimationFrame(autoScroll);
}

function moveDrag() {
  const d = drag;
  d.ghost.style.top = `${d.y - d.grab}px`;
  let best = null;
  for (const slot of dropSlots()) if (!best || Math.abs(slot.y - d.y) < Math.abs(best.y - d.y)) best = slot;
  d.target = best;
  if (best) Object.assign(d.line.style, { top: `${best.y - 2}px`, left: `${best.left}px`, width: `${best.width}px` });
}

function autoScroll() {
  if (!drag) return;
  const modal = $('#modal'), r = modal.getBoundingClientRect(), edge = 90;
  let dy = 0;
  if (drag.y < r.top + edge) dy = -Math.ceil((r.top + edge - drag.y) / 5);
  else if (drag.y > r.bottom - edge) dy = Math.ceil((drag.y - (r.bottom - edge)) / 5);
  if (dy) {
    const before = modal.scrollTop;
    modal.scrollTop += dy;
    if (modal.scrollTop !== before) moveDrag();
  }
  drag.raf = requestAnimationFrame(autoScroll);
}

function endDrag(commit) {
  const d = drag;
  drag = null;
  cancelAnimationFrame(d.raf);
  d.ghost.remove();
  d.line.remove();
  d.card.classList.remove('drag-source');
  document.body.classList.remove('is-dragging');
  if (!commit || !d.target) return;
  if (moveBlockTo(d.path, d.target.path, d.target.index)) {
    draftDirty = true;
    renderEditor();
    flashBlock(d.id);
  }
}

document.addEventListener('pointerdown', ev => {
  const handle = ev.target.closest?.('[data-drag-handle]');
  if (!handle || !draft || drag || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
  ev.preventDefault();
  beginDrag(handle, ev);
});
document.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.pointerId) return;
  ev.preventDefault();
  drag.y = ev.clientY;
  moveDrag();
}, { passive: false });
document.addEventListener('pointerup', ev => { if (drag && ev.pointerId === drag.pointerId) endDrag(true); });
document.addEventListener('pointercancel', ev => { if (drag && ev.pointerId === drag.pointerId) endDrag(false); });

// Keyboard: focus a grip and press the up / down arrow keys.
document.addEventListener('keydown', ev => {
  const handle = ev.target.closest?.('[data-drag-handle]');
  if (!handle || !draft || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
  ev.preventDefault();
  const { list, index, block } = getBlock(handle.dataset.path);
  const to = index + (ev.key === 'ArrowUp' ? -1 : 1);
  if (to < 0 || to >= list.length) return;
  [list[index], list[to]] = [list[to], list[index]];
  draftDirty = true;
  renderEditor();
  $(`#routine-form [data-path="${pathOfBlock(block.id)}"] > .step-head [data-drag-handle]`)?.focus();
  flashBlock(block.id);
});

// ----------------------------------------------------- add to a routine ----

actions['add-to-routine'] = el => {
  const e = exercise(el.dataset.id);
  showModal(modalHead('Add to a routine', esc(e.name)) + (state.routines.length
    ? `<div class="pick-list">${state.routines.map(r => `<button type="button" class="pick-row" data-action="add-to" data-routine="${r.id}" data-id="${e.id}">
        <span class="dot cat-${catClass(r.category)}"></span><span class="pick-text"><strong>${esc(r.name)}</strong><small>${plural(routineMoves(r).length, 'exercise')} · about ${duration(r)} min</small></span><span class="pick-add">＋</span></button>`).join('')}</div>`
    : '<p class="muted">You have no routines yet.</p>')
    + `<div class="modal-actions"><button class="btn light" data-action="detail" data-id="${e.id}">Back</button><button class="btn" data-action="new-routine-with" data-id="${e.id}">New routine with it</button></div>`);
};
actions['add-to'] = el => {
  const r = routine(el.dataset.routine), e = exercise(el.dataset.id);
  if (r.steps.length >= 200) { toast('That routine is full.'); return; }
  r.steps.push(newMove(e));
  save(); closeModal(); render();
  toast(`Added to “${r.name}”.`);
};
actions['new-routine-with'] = el => {
  const e = exercise(el.dataset.id);
  editRoutine();
  draft.category = e.category;
  draft.steps.push(newMove(e));
  draftDirty = true;
  renderEditor(false);
};

</script>
<script>/* js/views/exercises.js */
// The exercise library, exercise details (with your own history) and custom exercises.
// The search / filter / sort controls here are shared with the exercise picker in the routine editor.
'use strict';

const FILTER_DEFAULTS = { query: '', category: 'All', muscle: 'All muscles', gear: 'Any equipment', level: 'Any level', sort: 'suggested' };
const filters = { library: { ...FILTER_DEFAULTS }, picker: { ...FILTER_DEFAULTS } };
const filterPanelOpen = { library: window.innerWidth > 760, picker: false };
const SORTS = { suggested: 'Suggested', az: 'A to Z', used: 'Most used by you', recent: 'Recently done', muscle: 'By main muscle' };
const listLimits = { library: 60, picker: 60 };

/** How many sessions included each exercise, and when it was last done. */
function exerciseUsage() {
  const usage = new Map();
  for (const h of state.history) {
    for (const t of h.steps) {
      if (!t.exerciseId) continue;
      const u = usage.get(t.exerciseId) || { sessions: new Set(), last: 0 };
      u.sessions.add(h.id);
      u.last = Math.max(u.last, Date.parse(h.at));
      usage.set(t.exerciseId, u);
    }
  }
  return usage;
}
const usedCount = (usage, e) => usage.get(e.id)?.sessions.size || 0;

function activeFilterCount(f) {
  return [f.muscle !== 'All muscles', f.gear !== 'Any equipment', f.level !== 'Any level', state.settings.onlyMyGear].filter(Boolean).length;
}

/** Filter and sort the exercises. `groupOf` (or null) names the section heading for each. */
function filterExercises(f, usage = exerciseUsage()) {
  let list = allExercises().filter(e => exerciseMatches(e, f.query)
    && (f.category === 'All' || (f.category === 'Yours' ? e.custom : e.category === f.category))
    && (f.muscle === 'All muscles' || e.primary.includes(f.muscle) || e.secondary.includes(f.muscle))
    && (f.gear === 'Any equipment' || (f.gear === 'No equipment' ? !(e.gear || []).length : (e.gear || []).some(g => g.split('|').includes(f.gear))))
    && (f.level === 'Any level' || (e.level || 'General') === f.level)
    && (!state.settings.onlyMyGear || gearOk(e)));
  const byName = (a, b) => a.name.localeCompare(b.name);
  const tried = e => (usage.has(e.id) ? 'Done before' : 'Not tried yet');
  let groupOf = null;
  if (f.sort === 'az') { list.sort(byName); groupOf = e => e.name[0].toUpperCase(); }
  else if (f.sort === 'used') { list.sort((a, b) => usedCount(usage, b) - usedCount(usage, a) || byName(a, b)); groupOf = tried; }
  else if (f.sort === 'recent') { list.sort((a, b) => (usage.get(b.id)?.last || 0) - (usage.get(a.id)?.last || 0) || byName(a, b)); groupOf = tried; }
  else if (f.sort === 'muscle') {
    const rank = e => (e.primary.length ? MUSCLES.indexOf(e.primary[0]) : MUSCLES.length);
    list.sort((a, b) => rank(a) - rank(b) || byName(a, b));
    groupOf = e => e.primary[0] || 'Breath & whole body';
  } else {
    list = libraryOrder(list);
    if (f.query.trim()) list = rankByQuery(list, f.query);
    else if (f.category === 'All') groupOf = e => (e.custom ? 'Your exercises' : e.category);
  }
  return { list, groupOf };
}

/** Search, activity chips, Filters toggle, Sort and the filter panel, for `scope` = library | picker. */
function filterControlsHTML(scope) {
  const f = filters[scope], n = activeFilterCount(f), open = filterPanelOpen[scope];
  return `<div class="filter-controls" data-scope="${scope}">
    <input type="search" class="filter-search" data-bind="filter-query" data-scope="${scope}" value="${esc(f.query)}" placeholder="Search by name, muscle or equipment…" aria-label="Search exercises" autocomplete="off">
    ${chips('cat-' + scope, ['All', 'Yours', ...CATEGORIES], f.category, {}, 'scroll')}
    <div class="filter-bar">
      <button type="button" class="btn light small filter-toggle ${n ? 'has' : ''}" data-action="toggle-filters" data-scope="${scope}" aria-expanded="${open}">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        Filters<span class="filter-count">${n ? ' · ' + n : ''}</span></button>
      <label class="sort-label"><span>Sort</span><select data-bind="filter-sort" data-scope="${scope}" aria-label="Sort exercises">${options(Object.keys(SORTS), f.sort, SORTS)}</select></label>
      <span class="muted small result-count" data-count="${scope}"></span>
    </div>
    <div class="filter-panel" data-panel="${scope}" ${open ? '' : 'hidden'}>
      <label>Muscle<select data-bind="filter-muscle" data-scope="${scope}">${options(['All muscles', ...MUSCLES], f.muscle)}</select></label>
      <label>Equipment<select data-bind="filter-gear" data-scope="${scope}">${options(['Any equipment', 'No equipment', ...GEAR], f.gear)}</select></label>
      <label>Level<select data-bind="filter-level" data-scope="${scope}">${options(['Any level', 'General', 'Advanced'], f.level)}</select></label>
      <div class="panel-foot"><label class="checkrow"><input type="checkbox" data-bind="filter-mygear" data-scope="${scope}" ${state.settings.onlyMyGear ? 'checked' : ''}> Only equipment I have</label>
      <button type="button" class="text-btn" data-action="clear-filters" data-scope="${scope}">Clear filters</button></div>
    </div></div>`;
}

/** Re-render a scope's results after a filter change, and keep its controls in step. */
function filtersChanged(scope) {
  listLimits[scope] = 60;
  const f = filters[scope], n = activeFilterCount(f);
  $$(`.filter-controls[data-scope="${scope}"]`).forEach(box => {
    $('.filter-toggle', box)?.classList.toggle('has', n > 0);
    const count = $('.filter-count', box);
    if (count) count.textContent = n ? ' · ' + n : '';
    $$('.chip', box).forEach(c => { const on = c.dataset.value === f.category; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
  });
  if (scope === 'library') renderExerciseResults();
  else renderPickerList();
}

const scopeOf = el => (el.dataset.scope === 'picker' ? 'picker' : 'library');
binds['filter-query'] = el => { filters[scopeOf(el)].query = el.value; filtersChanged(scopeOf(el)); };
binds['filter-sort'] = el => { filters[scopeOf(el)].sort = el.value; filtersChanged(scopeOf(el)); };
binds['filter-muscle'] = el => { filters[scopeOf(el)].muscle = el.value; filtersChanged(scopeOf(el)); };
binds['filter-gear'] = el => { filters[scopeOf(el)].gear = el.value; filtersChanged(scopeOf(el)); };
binds['filter-level'] = el => { filters[scopeOf(el)].level = el.value; filtersChanged(scopeOf(el)); };
binds['filter-mygear'] = el => { state.settings.onlyMyGear = el.checked; save(); filtersChanged(scopeOf(el)); };
chipHandlers['cat-library'] = v => { filters.library.category = v; filtersChanged('library'); };
chipHandlers['cat-picker'] = v => { filters.picker.category = v; filtersChanged('picker'); };
actions['toggle-filters'] = el => {
  const scope = scopeOf(el);
  filterPanelOpen[scope] = !filterPanelOpen[scope];
  const panel = $(`[data-panel="${scope}"]`);
  if (panel) panel.hidden = !filterPanelOpen[scope];
  el.setAttribute('aria-expanded', filterPanelOpen[scope]);
};
actions['clear-filters'] = el => {
  const scope = scopeOf(el);
  filters[scope] = { ...FILTER_DEFAULTS };
  state.settings.onlyMyGear = false;
  save();
  if (scope === 'library') render(); else renderPickerShell();
};

/** Section heading rows between groups of results. */
function withHeadings(list, groupOf, item, heading) {
  let last = null;
  return list.map(e => {
    const g = groupOf ? groupOf(e) : null;
    const head = g !== null && g !== last ? heading(g) : '';
    last = g;
    return head + item(e);
  }).join('');
}

// -------------------------------------------------------------- library ----

renderers.library = () => {
  app().innerHTML = heading('Find your next move.', `${allExercises().length} exercises: strength, cardio, stillness and everything in between.`,
    `<button class="btn" data-action="new-exercise">${icon('plus')} Custom exercise</button>`)
    + filterControlsHTML('library')
    + `<div id="exercise-results"></div>
    <p class="note">Body maps show approximate target areas, not exact muscle activation. Instructions are general guidance, not a personal programme: warm up, move within a range you control, and stop if something hurts. Set up your equipment in <button class="link" data-view="settings">Settings</button>.</p>`;
  renderExerciseResults();
};

function renderExerciseResults() {
  const usage = exerciseUsage();
  const { list: all, groupOf } = filterExercises(filters.library, usage);
  const list = all.slice(0, listLimits.library);
  const count = $('[data-count="library"]');
  if (count) count.textContent = plural(all.length, 'exercise');
  const card = e => {
    const n = usedCount(usage, e);
    return `<button class="exercise-card" data-action="detail" data-id="${e.id}">${bodymap(e)}
      <div><span class="category">${esc(e.category)}${e.custom ? ' · YOURS' : e.level === 'Advanced' ? ' · ADVANCED' : ''}</span>
      <h3>${esc(e.name)}</h3><p>${esc(e.primary.join(' · ') || 'Breath and awareness')}</p>
      <p class="gear-line">${esc((e.gear || []).map(gearLabel).join(', ') || 'No equipment')}${n ? ` · <span class="logged-mark">done ${n}×</span>` : ''}</p></div></button>`;
  };
  $('#exercise-results').innerHTML = `<div class="exercise-grid">${withHeadings(list, groupOf, card, g => `<h3 class="group-head">${esc(g)}</h3>`)}</div>
    ${all.length > list.length ? `<div class="center row more-row"><button class="btn light" data-action="more-exercises">Show ${Math.min(60, all.length - list.length)} more of ${all.length - list.length}</button></div>` : ''}
    ${all.length ? '' : emptyState('No exercises match', 'Try another filter, or create your own exercise.', '<button class="btn light" data-action="clear-filters" data-scope="library">Clear filters</button>')}`;
}
actions['more-exercises'] = () => { listLimits.library += 60; renderExerciseResults(); };

// -------------------------------------------------------------- details ----

function breathText(pattern) {
  const names = { in: 'in', hold: 'hold', out: 'out' };
  return pattern.map(p => `${p.label ? p.label.toLowerCase() : names[p.phase]} ${p.seconds}`).join(' · ');
}

function exerciseHistoryHTML(e) {
  const log = exerciseLog(e);
  if (!log.length) return '';
  const best = bestOf(e, log);
  const facts = [];
  if (best.weight) facts.push(`Heaviest: <strong>${esc(setText(best.weight))}</strong>`);
  if (best.e1rm) facts.push(`Est. 1-rep max: <strong>${fmtWeight(best.e1rm)}</strong>`);
  if (best.reps) facts.push(`Most reps: <strong>${best.reps}</strong>`);
  if (best.distance) facts.push(`Longest: <strong>${fmtDistance(best.distance)}</strong>`);
  if (best.fastest) facts.push(`Best pace: <strong>${fmtPace(best.fastest.seconds, best.fastest.distance)}</strong>`);
  if (best.seconds && !best.distance) facts.push(`Longest: <strong>${fmtDuration(best.seconds)}</strong>`);
  // Trend of the top set per session (weight, else reps, else time, else distance), oldest first.
  const trend = log.slice(0, 20).reverse().map(({ sets }) => Math.max(...sets.map(t =>
    t.weight ? e1rm(t.weight, t.reps ?? t.value) || t.weight : t.mode === 'reps' ? (t.reps ?? t.value) : t.mode === 'distance' ? (t.distance ?? t.value) : (t.actualSeconds ?? t.value))));
  return `<div class="your-history"><h3>Your history</h3>
    <p class="muted small">${plural(log.length, 'session')}${facts.length ? ' · ' + facts.join(' · ') : ''}</p>
    ${sparkline(trend)}
    <ul class="history-mini">${log.slice(0, 5).map(({ entry, sets }) => `<li><span>${shortDate(new Date(entry.at))}</span><span>${esc(setsSummary(sets))}</span></li>`).join('')}</ul></div>`;
}

actions.detail = el => exerciseDetail(el.dataset.id);

/** The body of an exercise's details. `relatedAction` decides where related variations open. */
function exerciseInfoHTML(e, relatedAction = 'detail') {
  const related = e.family ? BUILTIN_EXERCISES.filter(x => x.id !== e.id && x.family === e.family) : [];
  const stretch = isStretch(e.category);
  return `<div class="detail-grid">
    <div class="anatomy">${bodymap(e, 'large')}<div class="legend"><span><i class="swatch ${stretch ? 'stretch' : ''}"></i>${stretch ? 'Stretch' : 'Primary'}</span><span><i class="swatch secondary"></i>Secondary</span></div></div>
    <div>
      <div class="row">${pill(esc(e.category))}${e.level === 'Advanced' ? pill('Advanced', 'warn') : ''}${e.custom ? pill('Yours') : ''}${e.bilateral ? pill('Left & right') : ''}</div>
      <h3>${stretch ? 'Areas stretched' : 'Primary focus'}</h3><p>${esc(e.primary.join(', ') || 'Breath and body awareness')}${e.secondary?.length ? `<br><span class="muted small">Also: ${esc(e.secondary.join(', '))}</span>` : ''}</p>
      <p class="muted small">Equipment: ${esc(e.equipment || 'None')} · Default: ${e.mode === 'reps' ? e.value + ' reps' : e.mode === 'distance' ? fmtDistance(e.value) : fmtDuration(e.value)}</p>
      ${e.breath ? `<p class="small">Breathing pattern: <strong>${esc(breathText(e.breath))}</strong> seconds. The player shows a guide.</p>` : ''}
      ${e.instructions.length ? `<ol class="instructions">${e.instructions.map(i => `<li>${esc(i)}</li>`).join('')}</ol>` : '<p class="muted">No instructions added.</p>'}
      ${safeURL(e.image) ? `<img class="illustration" src="${esc(e.image)}" alt="Demonstration of ${esc(e.name)}" loading="lazy">` : ''}
      ${safeURL(e.video) ? `<p><a href="${esc(e.video)}" target="_blank" rel="noopener noreferrer">Watch demonstration ↗</a></p>` : ''}
    </div></div>
    ${e.level === 'Advanced' ? '<p class="note">Advanced skill: warm up first and build up through the related variations. These default to waiting for you to tap Begin.</p>' : ''}
    ${exerciseHistoryHTML(e)}
    ${related.length ? `<h3 class="related-title">Related variations</h3><div class="row">${related.map(x => `<button type="button" class="btn light small" data-action="${relatedAction}" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>` : ''}`;
}

function exerciseDetail(id) {
  const e = exercise(id);
  if (!e) return;
  showModal(modalHead(e.name) + exerciseInfoHTML(e) + `
    <div class="modal-actions spread"><div class="row">
      ${e.custom ? `<button class="btn light" data-action="edit-exercise" data-id="${e.id}">Edit</button><button class="btn danger" data-action="delete-exercise" data-id="${e.id}">Delete</button>`
        : `<button class="btn light" data-action="copy-exercise" data-id="${e.id}" title="Create an editable copy with your own defaults and notes">Make my own version</button>`}</div>
      <div class="row"><button class="btn light" data-action="add-to-routine" data-id="${e.id}">Add to routine</button><button class="btn" data-action="close">Done</button></div></div>`);
}

// ----------------------------------------------------- custom exercises ----

actions['new-exercise'] = () => exerciseForm();
actions['edit-exercise'] = el => exerciseForm(el.dataset.id);
actions['copy-exercise'] = el => exerciseForm(null, el.dataset.id);

function exerciseForm(id, copyOf) {
  const source = id ? exercise(id) : copyOf ? exercise(copyOf) : null;
  const e = source ? structuredClone(source) : { name: '', category: 'Strength', mode: 'reps', value: 10, primary: [], secondary: [], equipment: '', gear: [], level: 'General', bilateral: false, instructions: [] };
  if (copyOf) e.name = `${source.name} (mine)`.slice(0, 90);
  const valueShown = e.mode === 'distance' ? fmtNum(mToDisplay(e.value), 2) : e.value;
  const muscleBoxes = (name, list) => MUSCLES.map(m => `<label class="checkrow"><input type="checkbox" name="${name}" value="${m}" ${list.includes(m) ? 'checked' : ''}>${m}</label>`).join('');
  showModal(modalHead(id ? 'Edit your exercise' : copyOf ? 'Your own version' : 'Your own exercise',
    copyOf ? 'A copy you can change freely. The original stays in the library.' : '')
    + `<form id="exercise-form" data-id="${id || ''}" data-based-on="${copyOf || source?.basedOn || ''}">
    <div class="field"><label for="ex-name">Name</label><input id="ex-name" name="name" required maxlength="90" value="${esc(e.name)}"></div>
    <div class="form-grid">
      <div class="field"><label for="ex-category">Activity</label><select id="ex-category" name="category">${options(CATEGORIES, e.category)}</select></div>
      <div class="field"><label for="ex-mode">Track by</label><select id="ex-mode" name="mode" data-bind="exercise-mode">${options(MODES, e.mode, MODE_LABELS)}</select></div>
      <div class="field"><label for="ex-value" id="ex-value-label">${valueLabelFor(e.mode)}</label><input id="ex-value" name="value" type="number" min="${e.mode === 'distance' ? 0.01 : 1}" step="${e.mode === 'distance' ? 0.01 : 1}" max="7200" required value="${valueShown}"></div>
      <div class="field"><label for="ex-level">Level</label><select id="ex-level" name="level">${options(['General', 'Advanced'], e.level || 'General')}</select></div>
    </div>
    <label class="checkrow"><input type="checkbox" name="bilateral" ${e.bilateral ? 'checked' : ''}> Done on each side separately (left and right)</label>
    <div class="field"><label for="ex-equipment">Equipment description (optional)</label><input id="ex-equipment" name="equipment" maxlength="100" value="${esc(e.equipment)}" placeholder="e.g. Kettlebell, 16 kg"></div>
    <fieldset class="field"><legend>Equipment needed (for the equipment filter)</legend><div class="checks">${GEAR.map(g => `<label class="checkrow"><input type="checkbox" name="gear" value="${esc(g)}" ${(e.gear || []).some(x => x.split('|')[0] === g) ? 'checked' : ''}>${esc(g)}</label>`).join('')}</div></fieldset>
    <fieldset class="field"><legend>Main muscles</legend><div class="checks">${muscleBoxes('primary', e.primary)}</div></fieldset>
    <fieldset class="field"><legend>Also works (optional)</legend><div class="checks">${muscleBoxes('secondary', e.secondary || [])}</div></fieldset>
    <div class="field"><label for="ex-notes">Instructions (optional, one step per line)</label><textarea id="ex-notes" name="notes" maxlength="5000">${esc(e.instructions.join('\n'))}</textarea></div>
    <div class="form-grid"><div class="field"><label for="ex-image">Picture link (optional, https)</label><input id="ex-image" name="image" type="url" value="${esc(e.image || '')}" placeholder="https://…"></div>
      <div class="field"><label for="ex-video">Video link (optional, https)</label><input id="ex-video" name="video" type="url" value="${esc(e.video || '')}" placeholder="https://…"></div></div>
    <div class="modal-actions"><button type="button" class="btn light" data-action="close">Cancel</button><button class="btn">Save exercise</button></div></form>`);
}
const valueLabelFor = mode => ({ reps: 'Default reps', time: 'Default seconds', manual: 'Reference seconds', distance: `Default distance (${distanceUnit()})` }[mode]);
binds['exercise-mode'] = el => {
  const input = $('#ex-value');
  $('#ex-value-label').textContent = valueLabelFor(el.value);
  input.step = el.value === 'distance' ? '0.01' : '1';
  input.min = el.value === 'distance' ? '0.01' : '1';
  input.value = el.value === 'distance' ? fmtNum(mToDisplay(1000), 2) : ({ reps: 10, time: 30, manual: 30 }[el.value]);
};

forms['exercise-form'] = (f, fd) => {
  const name = fd.get('name').trim();
  if (!name) { toast('Give your exercise a name.'); return; }
  if ((fd.get('image') && !safeURL(fd.get('image'))) || (fd.get('video') && !safeURL(fd.get('video')))) { toast('Use an https:// link for the picture or video.'); return; }
  const mode = fd.get('mode');
  const raw = Number(fd.get('value'));
  const primary = fd.getAll('primary');
  const e = {
    id: f.dataset.id || uid(), name, category: fd.get('category'), mode,
    value: mode === 'distance' ? displayToM(raw) : Math.round(raw),
    equipment: fd.get('equipment').trim(), gear: fd.getAll('gear'), level: fd.get('level'), bilateral: fd.has('bilateral'),
    primary, secondary: fd.getAll('secondary').filter(m => !primary.includes(m)),
    instructions: fd.get('notes').split('\n').map(x => x.trim()).filter(Boolean),
    image: fd.get('image').trim(), video: fd.get('video').trim(), custom: true,
    ...(f.dataset.basedOn ? { basedOn: f.dataset.basedOn } : {}),
  };
  try { normalizeState({ ...state, exercises: [...state.exercises.filter(x => x.id !== e.id), e] }); }
  catch (err) { toast(err.message.replace('This is not a valid Forma backup: ', 'Please check: ')); return; }
  const i = state.exercises.findIndex(x => x.id === e.id);
  if (i < 0) state.exercises.push(e); else state.exercises[i] = e;
  save(); closeModal(); render(); toast('Exercise saved.');
};

actions['delete-exercise'] = el => {
  const e = exercise(el.dataset.id);
  const users = state.routines.filter(r => routineMoves(r).some(b => b.exerciseId === e.id));
  confirmDialog({
    title: 'Delete this exercise?', yes: users.length ? 'Remove and delete' : 'Delete',
    body: `<p>“${esc(e.name)}” will be removed from your library. Past history keeps its records.</p>`
      + (users.length ? `<p class="note warning">It is used in ${plural(users.length, 'routine')}: ${users.map(r => '“' + esc(r.name) + '”').join(', ')}. It will be removed from ${users.length === 1 ? 'it' : 'them'}.</p>` : ''),
    onYes: () => {
      const strip = blocks => blocks.filter(b => b.exerciseId !== e.id).map(b => (b.kind === 'group' ? { ...b, steps: strip(b.steps) } : b))
        .filter(b => b.kind !== 'group' || b.steps.length);
      state.routines.forEach(r => { r.steps = strip(r.steps); });
      state.exercises = state.exercises.filter(x => x.id !== e.id);
      save(); render(); toast('Exercise deleted.');
    },
    onNo: () => exerciseDetail(e.id),
  });
};

</script>
<script>/* js/views/quick.js */
// Quick start: repeat recent routines, interval timer, meditation & breathing, logging outside activities.
'use strict';

const INTERVAL_PRESETS = [
  { label: 'Tabata 20/10 × 8', work: 20, rest: 10, rounds: 8 },
  { label: '30/30 × 10', work: 30, rest: 30, rounds: 10 },
  { label: '40/20 × 10', work: 40, rest: 20, rounds: 10 },
  { label: '45/15 × 12', work: 45, rest: 15, rounds: 12 },
  { label: '1 min on / 1 off × 8', work: 60, rest: 60, rounds: 8 },
];
const MEDITATION_GUIDES = [
  { id: 'breath', label: 'Silent, with a bell' },
  { id: 'x-box-breathing', label: 'Box breathing (4-4-4-4)' },
  { id: 'x-coherent-breathing', label: 'Coherent breathing (5-5)' },
  { id: 'x-478-breathing', label: '4-7-8 breathing' },
  { id: 'lib-body-scan', label: 'Body scan' },
  { id: 'lib-loving-kindness-meditation', label: 'Loving-kindness' },
];

renderers.quick = () => {
  const recentIds = [];
  for (let i = state.history.length - 1; i >= 0 && recentIds.length < 4; i--) {
    const id = state.history[i].routineId;
    if (id && routine(id) && !recentIds.includes(id)) recentIds.push(id);
  }
  app().innerHTML = heading('Just start.', 'Timers and quick sessions when you do not want to plan.')
    + (recentIds.length ? `<div class="section-head first"><h2>Do it again</h2></div><div class="recent-list">${recentIds.map(id => {
      const r = routine(id);
      return `<div class="recent-item"><span class="dot cat-${catClass(r.category)}"></span><div><strong>${esc(r.name)}</strong><small>about ${duration(r)} min · last ${shortDate(new Date(lastDoneTime(r)))}</small></div>
        <button class="btn" data-action="start" data-id="${r.id}">Start</button></div>`;
    }).join('')}</div>` : '')
    + `<div class="quick-grid">
      <section class="panel"><span class="category">HIIT · INTERVALS</span><h2>Interval timer</h2>
        <p class="muted small">Work, rest, repeat. Beeps count you into every change.</p>
        <div class="chips">${INTERVAL_PRESETS.map((p, i) => `<button type="button" class="chip" data-action="interval-preset" data-index="${i}">${p.label}</button>`).join('')}</div>
        <form id="interval-form">
          <div class="form-grid three"><div class="field"><label for="iv-work">Work (sec)</label><input id="iv-work" name="work" type="number" min="5" max="3600" required value="20"></div>
          <div class="field"><label for="iv-rest">Rest (sec)</label><input id="iv-rest" name="rest" type="number" min="0" max="3600" required value="10"></div>
          <div class="field"><label for="iv-rounds">Rounds</label><input id="iv-rounds" name="rounds" type="number" min="1" max="50" required value="8"></div></div>
          <label class="checkrow"><input type="checkbox" name="keep"> Also save it as a routine</label>
          <button class="btn">Start timer</button>
        </form></section>

      <section class="panel"><span class="category">MEDITATION · BREATH</span><h2>A moment to come back</h2>
        <p class="muted small">No score, no perfect technique. Guided patterns show a breathing circle to follow.</p>
        <form id="meditate-form">
          <div class="form-grid"><div class="field"><label for="med-guide">Guide</label><select id="med-guide" name="guide">${MEDITATION_GUIDES.map(g => `<option value="${g.id}">${esc(g.label)}</option>`).join('')}</select></div>
          <div class="field"><label for="med-minutes">Minutes</label><input id="med-minutes" name="minutes" type="number" min="1" max="120" required value="5"></div></div>
          <label class="checkrow"><input type="checkbox" name="bell" checked> Sound a bell when finished</label>
          <button class="btn">Begin</button>
        </form></section>

      <section class="panel"><span class="category">ANYTHING ELSE</span><h2>Log an activity</h2>
        <p class="muted small">Ran, climbed, played football, took a class? Log it so your week and progress show everything in one place.</p>
        <button class="btn" data-action="log-activity">${icon('plus')} Log activity</button></section>

      <section class="panel"><span class="category">JUST CURIOUS</span><h2>Player demo</h2>
        <p class="muted small">A one-minute run-through of sides, breaks and rounds. No movement needed and nothing is saved.</p>
        <button class="btn light" data-action="test-player">Try the demo</button></section>
    </div>`;
};

actions['interval-preset'] = el => {
  const p = INTERVAL_PRESETS[Number(el.dataset.index)];
  const f = $('#interval-form');
  f.elements.work.value = p.work; f.elements.rest.value = p.rest; f.elements.rounds.value = p.rounds;
};

forms['interval-form'] = (f, fd) => {
  const work = Number(fd.get('work')), rest = Number(fd.get('rest')), rounds = Number(fd.get('rounds'));
  const r = {
    id: uid(), name: `Intervals ${work}/${rest} × ${rounds}`, category: 'HIIT', transition: 0,
    description: `${rounds} rounds of ${work} seconds work and ${rest} seconds rest.`,
    steps: [tplGroup(rounds, [tplStep('x-work-interval', 'Main', { value: work }), ...(rest ? [tplRest(rest)] : [])], 'Intervals')],
  };
  if (fd.has('keep')) { state.routines.push({ ...r, createdAt: new Date().toISOString() }); save(); }
  startSession(r);
};

forms['meditate-form'] = (f, fd) => {
  const guide = fd.get('guide');
  const e = exercise(guide) || exercise('breath');
  const seconds = Number(fd.get('minutes')) * 60;
  startSession({ id: '', name: e.id === 'breath' ? 'Quiet meditation' : e.name, category: 'Meditation', transition: 0,
    steps: [tplStep(e.id, 'Main', { value: seconds })] }, { meditation: true, bell: fd.has('bell'), autoStart: true });
};

actions['test-player'] = () => startSession({
  name: 'Player demo', category: 'Other', transition: 5, isDemo: true,
  steps: [tplStep('mountain', 'Main', { value: 5, side: 'Both sides', sideSwitch: 5 }), tplRest(5),
    tplGroup(2, [tplStep('mountain', 'Main', { value: 5 }), tplRest(5)]), tplStep('mountain', 'Main', { value: 1, mode: 'reps' })],
});

// ------------------------------------------------------- log activity ----

actions['log-activity'] = () => activityForm();
function activityForm(entry) {
  const e = entry || { kind: 'Run', name: '', at: new Date().toISOString(), seconds: 1800 };
  const d = new Date(e.at);
  const type = ACTIVITY_TYPES.find(t => t.name === e.kind) || ACTIVITY_TYPES[0];
  showModal(modalHead(entry ? 'Edit activity' : 'Log an activity', 'Anything you did outside the player.') + `<form id="activity-form" data-id="${entry?.id || ''}">
    <div class="form-grid"><div class="field"><label for="act-kind">Type</label><select id="act-kind" name="kind" data-bind="activity-kind">${options(ACTIVITY_TYPES.map(t => t.name), type.name)}</select></div>
      <div class="field"><label for="act-name">Name (optional)</label><input id="act-name" name="name" maxlength="90" value="${esc(entry && entry.name !== entry.kind ? entry.name : '')}" placeholder="e.g. Bouldering with Sam"></div></div>
    <div class="form-grid three"><div class="field"><label for="act-date">Date</label><input id="act-date" name="date" type="date" required value="${dateKey(d)}"></div>
      <div class="field"><label for="act-time">Start time</label><input id="act-time" name="time" type="time" value="${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}"></div>
      <div class="field"><label for="act-min">Minutes</label><input id="act-min" name="minutes" type="number" min="1" max="1440" required value="${Math.round(e.seconds / 60)}"></div></div>
    <div class="field distance-field" ${type.distance ? '' : 'hidden'}><label for="act-dist">Distance (${distanceUnit()}, optional)</label><input id="act-dist" name="distance" type="number" min="0" max="10000" step="0.01" value="${e.distance ? fmtNum(mToDisplay(e.distance), 2) : ''}"></div>
    <div class="field"><label>Effort (optional)</label>${effortPicker(e.effort)}</div>
    <div class="field"><label for="act-note">Note (optional)</label><textarea id="act-note" name="note" maxlength="2000" placeholder="How did it feel?">${esc(e.note || '')}</textarea></div>
    <div class="modal-actions"><button type="button" class="btn light" data-action="close">Cancel</button><button class="btn">Save</button></div></form>`);
}
binds['activity-kind'] = el => {
  const type = ACTIVITY_TYPES.find(t => t.name === el.value);
  el.form.querySelector('.distance-field').hidden = !type?.distance;
};
forms['activity-form'] = (f, fd) => {
  const type = ACTIVITY_TYPES.find(t => t.name === fd.get('kind')) || ACTIVITY_TYPES.at(-1);
  if (!isValidDateKey(fd.get('date'))) { toast('Choose a date.'); return; }
  const at = new Date(`${fd.get('date')}T${fd.get('time') || '12:00'}:00`);
  const dist = Number(fd.get('distance'));
  const entry = {
    id: f.dataset.id || uid(), type: 'activity', kind: type.name, name: fd.get('name').trim() || type.name,
    category: type.category, at: at.toISOString(), seconds: Number(fd.get('minutes')) * 60, skipped: 0, steps: [],
    distance: type.distance && dist > 0 ? displayToM(dist) : undefined, effort: readEffort(fd), note: fd.get('note').trim(),
  };
  state.history = state.history.filter(h => h.id !== entry.id);
  addHistory(entry);
  closeModal(); render();
  toast(f.dataset.id ? 'Activity updated.' : 'Logged. Nice work.');
};

</script>
<script>/* js/views/progress.js */
// Progress: headline numbers, minutes per week, personal records and the full history.
'use strict';

let historyFilter = 'All';
let historyLimit = 30;
let showAllRecords = false;

renderers.progress = () => {
  if (!state.history.length) {
    app().innerHTML = heading('Every bit counts.', 'Your sessions, records and trends will build up here.')
      + emptyState('A fresh start', 'Finish a routine, use a timer or log an activity, and it will show up here.',
        '<div class="row center"><button class="btn" data-view="routines">Find a routine</button><button class="btn light" data-action="log-activity">Log an activity</button></div>')
      + importHint();
    return;
  }
  app().innerHTML = heading('Every bit counts.', 'What you have done, how it adds up, and where you are getting stronger.',
    `<button class="btn light" data-action="log-activity">${icon('plus')} Log activity</button>`)
    + statTiles()
    + `<section class="panel chart-panel"><div class="panel-head"><h2>Minutes per week</h2><span class="muted small">Last 12 weeks</span></div>${weeklyChart()}</section>`
    + recordsSection()
    + historySection();
};

function importHint() {
  return '<p class="muted small center">Coming from the previous Forma? Restore your backup in <button class="link" data-view="settings">Settings</button>.</p>';
}

function statTiles() {
  const weeks = weeklyTotals(2);
  const [last, now] = weeks;
  const diff = Math.round(now.total - last.total);
  const totalHours = sum(state.history, h => h.seconds) / 3600;
  const streak = weekStreak();
  const tile = (label, value, sub = '') => `<div class="stat"><span class="stat-label">${label}</span><strong class="stat-value">${value}</strong>${sub ? `<span class="stat-sub">${sub}</span>` : ''}</div>`;
  return `<section class="stats">
    ${tile('Minutes this week', Math.round(now.total), last.total || now.total ? `${diff >= 0 ? '+' : '−'}${Math.abs(diff)} vs last week` : '')}
    ${tile('Sessions this week', now.sessions, `${last.sessions} last week`)}
    ${tile('Weekly streak', streak, streak === 1 ? 'week in a row' : 'weeks in a row')}
    ${tile('All time', state.history.length, `${fmtNum(totalHours, 1)} hours in total`)}</section>`;
}

// ---------------------------------------------------------------- chart ----

/** A clean axis: a round step (15, 30, 60 … minutes) and a top that is a multiple of it. */
function niceScale(v) {
  const step = [15, 30, 60, 120, 180, 300, 600].find(s => Math.max(v, 1) / s <= 4) || Math.ceil(v / 4 / 600) * 600;
  return { step, max: Math.max(step, Math.ceil(v / step) * step) };
}

/** Stacked columns of minutes per week, by activity group. Legend, hover tooltips and a table view. */
function weeklyChart() {
  const weeks = weeklyTotals(12);
  const { step, max } = niceScale(Math.max(...weeks.map(w => w.total)));
  const W = clamp(($('#app')?.clientWidth || 640) - 48, 300, 760), H = W < 480 ? 220 : 250, left = 40, right = 12, top = 18, bottom = 28;
  const plotW = W - left - right, plotH = H - top - bottom;
  const band = plotW / weeks.length, barW = Math.min(24, band * 0.6);
  const y = v => top + plotH - (v / max) * plotH;
  const ticks = Array.from({ length: max / step + 1 }, (_, i) => i * step);
  const grid = ticks.map(t => `<line class="grid" x1="${left}" x2="${W - right}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${left - 8}" y="${y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`).join('');
  const bars = weeks.map((w, i) => {
    const x = left + i * band + (band - barW) / 2;
    let base = top + plotH;
    const present = STAT_GROUPS.filter(g => w.groups[g] > 0);
    const segs = present.map((g, j) => {
      const h = (w.groups[g] / max) * plotH;
      const gap = j < present.length - 1 ? 2 : 0;   // 2px surface gap between stacked segments
      const segH = Math.max(0, h - gap);
      const yTop = base - h + gap;
      base -= h;
      const isTop = j === present.length - 1;
      const r = isTop ? Math.min(4, segH) : 0;
      const d = r
        ? `M${x} ${yTop + segH} V${yTop + r} Q${x} ${yTop} ${x + r} ${yTop} H${x + barW - r} Q${x + barW} ${yTop} ${x + barW} ${yTop + r} V${yTop + segH} Z`
        : `M${x} ${yTop + segH} V${yTop} H${x + barW} V${yTop + segH} Z`;
      return `<path class="seg s${STAT_GROUPS.indexOf(g) + 1}" d="${d}"/>`;
    }).join('');
    const every = W < 480 ? 3 : 2;
    const label = (weeks.length - 1 - i) % every === 0 ? `<text class="tick" x="${x + barW / 2}" y="${H - 8}" text-anchor="middle">${esc(shortDate(w.start))}</text>` : '';
    const latest = i === weeks.length - 1 && w.total ? `<text class="bar-value" x="${x + barW / 2}" y="${y(w.total) - 6}" text-anchor="middle">${Math.round(w.total)}</text>` : '';
    const tip = `Week of ${shortDate(w.start)}|${Math.round(w.total)} min in total|` + present.map(g => `${g}: ${Math.round(w.groups[g])} min`).join('|');
    return `<g class="col" data-tip="${esc(tip)}" tabindex="0" role="img" aria-label="${esc(tip.replace(/\|/g, ', '))}"><rect class="hit" x="${left + i * band}" y="${top}" width="${band}" height="${plotH}"/>${segs}${label}${latest}</g>`;
  }).join('');
  const legend = STAT_GROUPS.map((g, i) => `<span class="legend-item"><i class="key s${i + 1}"></i>${g}</span>`).join('');
  const table = `<details class="table-view"><summary>Show as table</summary><div class="table-scroll"><table><thead><tr><th>Week of</th>${STAT_GROUPS.map(g => `<th>${g}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody>${weeks.slice().reverse().map(w => `<tr><td>${shortDate(w.start)}</td>${STAT_GROUPS.map(g => `<td>${Math.round(w.groups[g])}</td>`).join('')}<td><strong>${Math.round(w.total)}</strong></td></tr>`).join('')}</tbody></table></div></details>`;
  return `<div class="viz"><div class="legend-row">${legend}</div>
    <div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="Minutes per week for the last 12 weeks, stacked by activity">
      ${grid}<line class="axis" x1="${left}" x2="${W - right}" y1="${top + plotH}" y2="${top + plotH}"/>${bars}</svg>
      <div class="chart-tip" hidden></div></div>${table}</div>`;
}

function showChartTip(col) {
  const wrap = col.closest('.chart-wrap');
  const tip = $('.chart-tip', wrap);
  const [title, total, ...rows] = col.dataset.tip.split('|');
  tip.innerHTML = `<strong>${esc(title)}</strong><span>${esc(total)}</span>${rows.map(r => {
    const g = r.split(':')[0];
    return `<span><i class="key s${STAT_GROUPS.indexOf(g) + 1}"></i>${esc(r)}</span>`;
  }).join('')}`;
  tip.hidden = false;
  const box = col.getBoundingClientRect(), outer = wrap.getBoundingClientRect();
  const x = box.left - outer.left + box.width / 2;
  tip.style.left = `${clamp(x, 90, outer.width - 90)}px`;
  $$('.col', wrap).forEach(c => c.classList.toggle('dim', c !== col));
}
function hideChartTip(wrap) {
  const tip = $('.chart-tip', wrap);
  if (tip) tip.hidden = true;
  $$('.col', wrap).forEach(c => c.classList.remove('dim'));
}

// -------------------------------------------------------------- records ----

function recordsSection() {
  const records = allRecords().filter(({ best }) => best.weight || best.reps || best.distance || best.seconds);
  if (!records.length) return '';
  const shown = showAllRecords ? records : records.slice(0, 8);
  const rows = shown.map(({ e, best }) => {
    const main = best.weight ? setText(best.weight) : best.distance ? fmtDistance(best.distance) : best.reps ? `${best.reps} reps` : fmtDuration(best.seconds);
    const extra = best.e1rm ? `≈ ${fmtWeight(best.e1rm)} 1RM` : best.fastest ? fmtPace(best.fastest.seconds, best.fastest.distance) : '';
    return `<tr ${e.id && exercise(e.id) ? `data-action="detail" data-id="${e.id}" tabindex="0" class="clickable"` : ''}>
      <td><strong>${esc(e.name)}</strong><small class="muted">${esc(e.category || '')}</small></td><td>${esc(main)}</td><td class="muted">${esc(extra)}</td>
      <td class="muted">${best.sessions}</td><td class="muted">${best.last ? shortDate(new Date(best.last)) : ''}</td></tr>`;
  }).join('');
  return `<section class="panel"><div class="panel-head"><h2>Personal bests</h2><span class="muted small">Tap an exercise for its history</span></div>
    <div class="table-scroll"><table class="records"><thead><tr><th>Exercise</th><th>Best</th><th>Estimate / pace</th><th>Sessions</th><th>Last</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${records.length > 8 ? `<button class="text-btn" data-action="toggle-records">${showAllRecords ? 'Show fewer' : `Show all ${records.length}`}</button>` : ''}</section>`;
}
actions['toggle-records'] = () => { showAllRecords = !showAllRecords; render(); };

// -------------------------------------------------------------- history ----

function historySection() {
  const list = state.history.filter(h => historyFilter === 'All' || (historyFilter === 'Workouts' ? h.type === 'session' : h.type === 'activity')).slice().reverse();
  let month = '';
  const rows = list.slice(0, historyLimit).map(h => {
    const d = new Date(h.at);
    const m = d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const head = m !== month ? `<h3 class="month">${esc(m)}</h3>` : '';
    month = m;
    const facts = [fmtDuration(h.seconds)];
    if (h.steps.length) facts.push(plural(h.steps.length, 'set'));
    const vol = entryVolume(h);
    if (vol) facts.push(`${Math.round(kgToDisplay(vol)).toLocaleString()} ${weightUnit()} lifted`);
    const dist = entryDistance(h);
    if (dist) facts.push(fmtDistance(dist));
    if (h.effort) facts.push(`effort ${h.effort}/10`);
    if (h.skipped) facts.push(`${h.skipped} skipped`);
    return `${head}<button class="history-row" data-action="history-detail" data-id="${h.id}">
      <span class="dot cat-${catClass(h.category)}" aria-hidden="true"></span>
      <span class="history-main"><strong>${esc(h.name)}</strong><small>${d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })} · ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })} · ${facts.map(esc).join(' · ')}</small></span>
      <span class="history-kind">${h.type === 'activity' ? 'Activity' : h.manual ? 'Marked done' : esc(h.category)}</span></button>`;
  }).join('');
  return `<section class="history-section"><div class="section-head"><h2>History</h2><button class="text-btn" data-action="export-csv">Export as spreadsheet (CSV)</button></div>
    ${chips('history-filter', ['All', 'Workouts', 'Activities'], historyFilter)}
    <div class="history-list">${rows || '<p class="muted">Nothing here yet.</p>'}</div>
    ${list.length > historyLimit ? `<button class="btn light" data-action="more-history">Show more</button>` : ''}</section>`;
}
chipHandlers['history-filter'] = v => { historyFilter = v; historyLimit = 30; render(); };
actions['more-history'] = () => { historyLimit += 30; render(); };
actions['export-csv'] = () => exportCSV();

actions['history-detail'] = el => historyDetail(el.dataset.id);
function historyDetail(id) {
  const h = state.history.find(x => x.id === id);
  if (!h) return;
  const d = new Date(h.at);
  const records = h.type === 'session' ? newRecords(h) : [];
  const rows = h.steps.map(t => `<tr><td><strong>${esc(t.name)}</strong><small class="muted">${[t.roundLabel, t.side !== 'Not applicable' ? t.side : '', t.sets > 1 || t.set > 1 ? `set ${t.set}` : ''].filter(Boolean).map(esc).join(' · ')}</small></td>
    <td>${esc(setText(t))}</td><td class="muted">${t.mode === 'reps' && t.reps !== undefined && t.reps !== t.value ? `planned ${t.value}` : t.mode === 'time' ? `planned ${fmtDuration(t.value)}` : ''}</td></tr>`).join('');
  const facts = [fmtDuration(h.seconds), h.category, h.distance ? fmtDistance(h.distance) : '', h.distance && h.seconds ? fmtPace(h.seconds, h.distance) : '', h.effort ? `effort ${h.effort}/10` : ''].filter(Boolean);
  showModal(modalHead(h.name, esc(`${dateTime(h.at)} · ${facts.join(' · ')}`)) + `
    ${records.length ? `<div class="note good"><strong>New personal best${records.length > 1 ? 's' : ''}</strong><ul>${records.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
    ${h.note ? `<p class="entry-note">${esc(h.note)}</p>` : ''}
    ${rows ? `<div class="table-scroll"><table class="sets"><tbody>${rows}</tbody></table></div>` : `<p class="muted">${h.type === 'activity' ? esc(h.kind || 'Activity') + ', logged manually.' : 'Marked as done without the player, so there are no set details.'}</p>`}
    ${h.skipped ? `<p class="muted small">${plural(h.skipped, 'step')} skipped.</p>` : ''}
    <div class="modal-actions spread"><button class="btn danger" data-action="delete-entry" data-id="${h.id}">Delete</button>
      <div class="row"><button class="btn light" data-action="edit-entry" data-id="${h.id}">Edit</button><button class="btn" data-action="close">Done</button></div></div>`);
}

actions['edit-entry'] = el => {
  const h = state.history.find(x => x.id === el.dataset.id);
  if (h.type === 'activity') { activityForm(h); return; }
  showModal(modalHead('Edit session', esc(h.name)) + `<form id="entry-form" data-id="${h.id}">
    <div class="form-grid"><div class="field"><label for="entry-min">Duration (minutes)</label><input id="entry-min" name="minutes" type="number" min="1" max="1440" required value="${Math.max(1, Math.round(h.seconds / 60))}"></div>
    <div class="field"><label for="entry-date">Date</label><input id="entry-date" name="date" type="date" required value="${dateKey(new Date(h.at))}"></div></div>
    <div class="field"><label>Effort</label>${effortPicker(h.effort)}</div>
    <div class="field"><label for="entry-note">Note</label><textarea id="entry-note" name="note" maxlength="2000">${esc(h.note || '')}</textarea></div>
    <div class="modal-actions"><button type="button" class="btn light" data-action="history-detail" data-id="${h.id}">Cancel</button><button class="btn">Save</button></div></form>`);
};
forms['entry-form'] = (f, fd) => {
  const h = state.history.find(x => x.id === f.dataset.id);
  const old = new Date(h.at);
  if (!isValidDateKey(fd.get('date'))) { toast('Choose a date.'); return; }
  if (fd.get('date') !== dateKey(old)) h.at = new Date(`${fd.get('date')}T${old.toTimeString().slice(0, 8)}`).toISOString();
  h.seconds = Number(fd.get('minutes')) * 60;
  h.effort = readEffort(fd);
  h.note = fd.get('note').trim();
  state.history.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  save(); render(); historyDetail(h.id); toast('Saved.');
};
actions['delete-entry'] = el => {
  const h = state.history.find(x => x.id === el.dataset.id);
  confirmDialog({
    title: 'Delete this entry?', yes: 'Delete', body: `<p>“${esc(h.name)}” on ${esc(dateTime(h.at))} will be removed from your history.</p>`,
    onYes: () => { state.history = state.history.filter(x => x.id !== h.id); save(); render(); toast('Entry deleted.'); },
    onNo: () => historyDetail(h.id),
  });
};

</script>
<script>/* js/views/settings.js */
// Settings: units, calendar, theme, session behaviour, equipment and data.
'use strict';

const APP_VERSION = '0.6';

renderers.settings = () => {
  const s = state.settings;
  const radio = (name, value, label) => `<label class="seg-option"><input type="radio" name="${name}" value="${value}" data-bind="setting" ${String(s[name]) === String(value) ? 'checked' : ''}><span>${label}</span></label>`;
  const toggle = (name, label, hint = '') => `<label class="toggle-row"><span><strong>${label}</strong>${hint ? `<small>${hint}</small>` : ''}</span><input type="checkbox" class="switch" name="${name}" data-bind="setting" ${s[name] ? 'checked' : ''}></label>`;
  app().innerHTML = heading('Make it yours.', 'Preferences are saved on this device and included in backups.')
    + `<div class="settings-grid">
      <section class="panel"><h2>Display</h2>
        <p class="label">Units</p><div class="segmented">${radio('units', 'metric', 'Metric (kg, km)')}${radio('units', 'imperial', 'Imperial (lb, mi)')}</div>
        <p class="label">Week starts on</p><div class="segmented">${radio('weekStart', 1, 'Monday')}${radio('weekStart', 0, 'Sunday')}</div>
        <p class="label">Colours</p>
        <div class="palette-picker">${PALETTES.map(p => `<label class="palette-option"><input type="radio" name="palette" value="${p.id}" data-bind="setting" ${s.palette === p.id ? 'checked' : ''}>
          <span class="palette-swatch" style="--sa:${p.a};--sb:${p.b}">${p.id === 'kitty' ? stickerSVG('face', 'swatch-kitty') : ''}</span><span class="palette-name">${p.name}</span></label>`).join('')}</div>
        <p class="label">Light or dark</p><div class="segmented">${radio('theme', 'system', 'Match device')}${radio('theme', 'light', 'Light')}${radio('theme', 'dark', 'Dark')}</div>
      </section>

      <section class="panel"><h2>Sessions</h2>
        ${toggle('countdown', 'Countdown beeps', 'Three short beeps before a timed step ends')}
        ${toggle('sounds', 'Bell at the end of timed steps')}
        ${toggle('wakeLock', 'Keep the screen on', 'While a session is running, where the browser allows it')}
        <div class="field inline-field"><label for="set-rest">Default rest between sets (sec)</label>
          <input id="set-rest" type="number" name="defaultRest" data-bind="setting" min="0" max="600" step="5" value="${s.defaultRest}"><small>Used when you add a strength exercise to a routine.</small></div>
      </section>

      <section class="panel span-2"><h2>My equipment</h2>
        <p class="muted small">Tick what you have at home or at your gym. Turn on “Only my equipment” in the library or the exercise picker to hide anything you cannot do.</p>
        <div class="gear-grid">${GEAR.map(g => `<label class="gear-chip"><input type="checkbox" name="gear" value="${esc(g)}" data-bind="gear" ${s.gear.includes(g) ? 'checked' : ''}><span>${esc(g)}</span></label>`).join('')}</div>
        <p class="muted small" id="gear-count">${BUILTIN_EXERCISES.filter(e => gearOk(e)).length} of ${BUILTIN_EXERCISES.length} built-in exercises fit your equipment.</p>
      </section>

      ${appPanelHTML()}

      <section class="panel"><h2>About</h2>
        <p class="small">Forma ${APP_VERSION} · a personal planner and tracker for strength, cardio, yoga, mobility and meditation.</p>
        <p class="muted small">Exercise instructions are general guidance, not medical or personal training advice. Warm up, move within a range you control, and stop if something hurts.</p>
        <div class="stack"><button class="btn light" data-action="test-player">Try the player demo</button>
        <button class="btn danger" data-action="erase-all">Erase all data on this device</button></div>
      </section>
    </div>`;
};

binds.setting = el => {
  const key = el.name;
  let value = el.type === 'checkbox' ? el.checked : el.value;
  if (key === 'weekStart') value = Number(value);
  if (key === 'defaultRest') {
    value = Number(value);
    if (!Number.isInteger(value) || value < 0 || value > 600) return;
  }
  state.settings[key] = value;
  save();
  if (key === 'theme' || key === 'palette') applyTheme();
  if (el.type === 'radio') { render(); toast('Saved.'); }
};
binds.gear = () => {
  state.settings.gear = $$('input[data-bind="gear"]').filter(x => x.checked).map(x => x.value);
  save();
  const count = $('#gear-count');
  if (count) count.textContent = `${BUILTIN_EXERCISES.filter(e => gearOk(e)).length} of ${BUILTIN_EXERCISES.length} built-in exercises fit your equipment.`;
};

actions.export = () => exportBackup();
actions.import = () => {
  if (session) { toast('End your current session before restoring a backup.'); return; }
  $('#backup-file').click();
};

let pendingBackup = null;
async function handleBackupFile(file) {
  try {
    if (file.size > 20e6) throw new Error('Choose a backup smaller than 20 MB.');
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch { throw new Error('This file is not a Forma backup (it is not JSON).'); }
    pendingBackup = normalizeState(parsed);
    const b = pendingBackup;
    showModal(modalHead('Restore this backup?') + `<p>It contains ${plural(b.routines.length, 'routine')}, ${plural(b.exercises.length, 'custom exercise')}, ${plural(b.schedule.length, 'plan')} and ${plural(b.history.length, 'history entry', 'history entries')}${b.activeSession ? ', plus an unfinished session you can resume' : ''}.</p>
      <p class="note warning">Restoring replaces everything currently saved in this browser. Export first if you want to keep it.</p>
      <div class="modal-actions"><button class="btn light" data-action="export">Export current data</button><button class="btn danger" data-action="confirm-restore">Replace with backup</button></div>`);
  } catch (err) { toast(err.message || 'Could not read this backup.'); }
}
actions['confirm-restore'] = () => {
  if (!pendingBackup) return;
  const b = pendingBackup;
  pendingBackup = null;
  const snapshot = b.activeSession;
  delete b.activeSession;
  state = b;
  storageProblem = '';
  save();
  applyTheme();
  if (snapshot) { resumeSession(snapshot); saveSession(); }
  closeModal(); render(); toast('Backup restored.');
};

actions['erase-all'] = () => confirmDialog({
  title: 'Erase everything?', yes: 'Erase all data',
  body: '<p>This deletes all routines, plans, custom exercises, history and settings from this browser. It cannot be undone.</p><p class="note warning">Export a backup first if there is anything you might want back.</p>',
  onYes: () => {
    state = freshState();
    session = null;
    try { [STORAGE_KEY, STORAGE_KEY + '-recovery', SESSION_KEY, LEGACY_KEY, LEGACY_KEY + '-recovery'].forEach(k => localStorage.removeItem(k)); } catch { /* ignore */ }
    save(); applyTheme(); go('week'); toast('All data erased.');
  },
});

</script>
<script>/* js/player.js */
// The session player: timing, logging actual sets, sounds, wake lock and the breathing guide.
'use strict';

let session = null;
let timerHandle = null;
let lastPersistSecond = -1;
let howToOpen = window.innerWidth > 760;

const current = () => session.queue[session.index];
const isTimed = q => q.kind !== 'move' || q.mode === 'time';
const isWeighted = q => q.kind === 'move' && q.mode !== 'distance' && q.mode !== 'manual'
  && (['Strength', 'HIIT'].includes(q.exercise.category) || q.weight > 0);

function startSession(r, { meditation = false, bell = true, autoStart = false } = {}) {
  if (session) { toast('Finish your current session first.'); return; }
  let queue;
  try { queue = compileRoutine(r); } catch (err) { toast(err.message); return; }
  if (!queue.some(q => q.kind === 'move')) { toast('Add an exercise to this routine first.'); return; }
  closeDialogs();
  initAudio();
  session = {
    id: uid(), name: r.name, routineId: r.id && routine(r.id) ? r.id : undefined, category: r.category || 'Other',
    queue, index: 0, remaining: 0, running: false, deadline: 0, elapsed: 0, lastTick: Date.now(), stepElapsed: 0,
    skippedIdx: [], skipped: 0, completed: [], bell, meditation, started: new Date().toISOString(),
    recovered: false, isDemo: !!r.isDemo, pending: null,
  };
  enterStep(false);
  armTimer();
  window.scrollTo(0, 0);
  if (autoStart) toggleTimer();
}

function resumeSession(snapshot) {
